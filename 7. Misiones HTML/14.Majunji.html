<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>14.Majunji</title>
<style>
  body { margin: 0; padding: 20px; background-color: #3a2a1a; /* fondo marrón oscuro */ display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; position: relative; }
  .button { padding: 10px 20px; background-color: #ffffff; color: #000000; border: 2px solid #8B4513; border-radius: 5px; cursor: pointer; user-select: none; font-weight: bold; transition: all 0.2s; }
  .button.active { background-color: #4CAF50; color: white; border-color: #2E7D32; box-shadow: 0 0 10px #4CAF50; }
  .marco { width: 1940px; height: 1100px; border: 10px solid #000000; display: flex; justify-content: center; align-items: center; box-sizing: border-box; margin-top: 20px; position: relative; }
  .area { width: 1920px; height: 1080px; background-color: #ffffff; position: relative; overflow: hidden; }
  .area img,
.area video {
  position: absolute;
  cursor: grab;
  user-select: none;
}
.area img.dragging,
.area video.dragging {
  cursor: grabbing;
}

  .feedback { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background-color: #4CAF50; color: white; padding: 5px 15px; border-radius: 5px; font-size: 14px; display: none; z-index: 1000; box-shadow: 0 0 5px #00000066; }
  .ficha-drop { padding: 10px; width: 200px; height: 60px; border: 2px dashed #8B4513; border-radius: 5px; display: flex; align-items: center; justify-content: center; margin-right: 10px; color: #8B4513; cursor: pointer; font-weight: bold; }
  #mapDrop { background-color: #ffebcd; color: #8B4513; }
  input[type=file] { display:none; }
  #resizeInput { position:absolute; width:60px; display:none; z-index:9999; font-size:14px; padding:2px 4px; border:1px solid #8B4513; border-radius:3px; }
  img.selected { outline: 3px solid #4CAF50; }
  .measurement-line { position: absolute; background: red; height: 2px; transform-origin: 0 0; z-index: 100; pointer-events: none; }
  .measurement-text { position: absolute; background: #4CAF50; color: white; padding: 2px 6px; border-radius: 4px; font-size: 14px; z-index: 101; pointer-events: none; }
  
</style>
</head>
<body>

<div class="controls">
  <div class="ficha-drop" id="mapDrop">Arrastra mapa aquí</div>
  <div class="ficha-drop" id="fichaDrop">Arrastra ficha aquí</div>
  <button class="button" id="moveMapBtn">Mover Mapa</button>
  <button class="button" id="fichaBtn">Ficha</button>
  <button class="button" id="resizeBtn">Redimensionar</button>
  <button class="button" id="moveBoardBtn">Mover Tablero</button>
  <button class="button" id="measureBtn">Medir</button>

  <!-- Persistencia con IndexedDB -->
  <button class="button" id="saveBtn">Guardar (IndexedDB)</button>
  <button class="button" id="loadBtn">Cargar (IndexedDB)</button>

  <!-- Export/Import JSON (archivos) -->
  <button class="button" id="exportBtn">Exportar JSON</button>
  <button class="button" id="importBtn">Importar JSON</button>

  <div class="feedback" id="feedback"></div>
  <input type="file" id="importFile" accept="application/json">
</div>

<div class="marco">
  <div class="area" id="area"></div>
</div>

<input type="number" id="resizeInput" min="10" placeholder="px">
<input type="file" id="importMapFile" accept="image/*" style="display:none;">


<script>
/*************************
 * IndexedDB helpers
 *************************/
const DB_NAME = 'TableroDB';
const STORE_NAME = 'estados';
const DB_VERSION = 1;
const STATE_KEY = 'tablero';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt');
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbSet(id, data) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
    const store = tx.objectStore(STORE_NAME);
    store.put({ id, ...data, updatedAt: new Date().toISOString() });
  }));
}

function idbGet(id) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    tx.onerror = () => reject(tx.error);
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}

function pushHistory(){
    const state = buildState();
    historyStack = historyStack.slice(0, historyIndex + 1); // recortar redo
    historyStack.push(JSON.stringify(state));
    if(historyStack.length > MAX_HISTORY) historyStack.shift();
    historyIndex = historyStack.length - 1;
}

async function undo(){
    if(historyIndex <= 0) return;
    historyIndex--;
    const state = JSON.parse(historyStack[historyIndex]);
    await restoreFromState(state);
}

async function redo(){
    if(historyIndex >= historyStack.length - 1) return;
    historyIndex++;
    const state = JSON.parse(historyStack[historyIndex]);
    await restoreFromState(state);
}

document.addEventListener('keydown', async e=>{
    if(e.ctrlKey && e.key==='z'){ await undo(); e.preventDefault(); }
    if(e.ctrlKey && e.key==='y'){ await redo(); e.preventDefault(); }
});

/*************************
 * Tablero original + cambios a IndexedDB
 *************************/
const area = document.getElementById('area');
const moveMapBtn = document.getElementById('moveMapBtn');
const fichaBtn = document.getElementById('fichaBtn');
const resizeBtn = document.getElementById('resizeBtn');
const moveBoardBtn = document.getElementById('moveBoardBtn');
const measureBtn = document.getElementById('measureBtn');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const saveBtn = document.getElementById('saveBtn');
const loadBtn = document.getElementById('loadBtn');
const feedback = document.getElementById('feedback');
const fichaDrop = document.getElementById('fichaDrop');
const importFile = document.getElementById('importFile');
const mapDrop = document.getElementById('mapDrop');
const importMapFile = document.getElementById('importMapFile');
const resizeInput = document.getElementById('resizeInput');

let moveMapMode = false;
let fichaMode = false;
let resizeMode = false;
let moveBoardMode = false;
let measureMode = false;
let currentImage = null;
let fichas = [];
let resizeTarget = null;
let selectedFichas = [];
let historyStack = [];
let historyIndex = -1;
const MAX_HISTORY = 20;



// Medición
let measureLines = [];
let measureTexts = [];
let measureStart = null;

// helpers
function genId(prefix='id'){ return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,9)}`; }
function showFeedback(msg, dur=1400){ feedback.textContent=msg; feedback.style.display='block'; setTimeout(()=>feedback.style.display='none', dur); }

// --- Guardado (IndexedDB) ---
function buildState(){
  const state = {
    map: null,
    fichas: [],
    moveMapMode: !!moveMapMode,
    fichaMode: !!fichaMode,
    resizeMode: !!resizeMode,
    moveBoardMode: !!moveBoardMode,
    metaVersion: 2
  };
  if(currentImage) state.map = {
    src: currentImage.dataset.localpath||currentImage.src,
    left: parseInt(currentImage.style.left||0),
    top: parseInt(currentImage.style.top||0)
  };
  state.fichas = fichas.map(f => ({
    src: f.dataset.localpath||f.src,
    left: parseInt(f.style.left||0),
    top: parseInt(f.style.top||0),
    width: parseInt(f.style.width||100),
    height: parseInt(f.style.height||100),
    name: f.dataset.name || null
  }));
  return state;
}

async function saveIDBState(showMsg=true){
  const state = buildState();
  await idbSet(STATE_KEY, state);
  if (showMsg) showFeedback('Guardado en IndexedDB ✅', 1200);
}

// --- Export completo a JSON (descarga) ---
function exportStateJSON(){
  const state = buildState();
  const full = { ...state, exportedAt:(new Date()).toISOString() };
  const blob = new Blob([JSON.stringify(full,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);

  // 🔹 Usar título tal cual, solo limpiando espacios al inicio/final
  let filename = document.title.trim() + ".json";
  a.download = filename;

  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showFeedback(`Exportado como ${filename} ✅`,1500);
}


// --- Importar JSON desde archivo ---
function importStateFromFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try {
      const full = JSON.parse(e.target.result);
      await restoreFromState(full);
      pushHistory();
      await saveIDBState(false);
      showFeedback('Estado importado ✅',1500);
    }catch(err){console.error(err); alert('JSON inválido');}
  };
  reader.readAsText(file);
}

// --- limpiar fichas ---
function clearAllFichas(){
  fichas.forEach(f=>f.parentNode?.removeChild(f));
  fichas=[];
  selectedFichas=[];
}

function clearMap(){
    if(currentImage){ 
        area.removeChild(currentImage); 
        currentImage = null; 
    }
}

// --- cargar mapa ---
function loadMap(src,left=null,top=null){
  if(currentImage){
    currentImage.src=src;
    currentImage.dataset.localpath = src;
    if(left!==null) currentImage.style.left=left+'px';
    if(top!==null) currentImage.style.top=top+'px';
    return;
  }
  const img=document.createElement('img');
  img.src=src; img.dataset.localpath = src; img.style.zIndex=0;
  img.style.left=(left!==null)?left+'px':(area.clientWidth/2)+'px';
  img.style.top=(top!==null)?top+'px':(area.clientHeight/2)+'px';
  img.dataset.ficha=''; 
  area.prepend(img);
  currentImage=img;

  img.onmousedown = (e)=>{
    if(moveMapMode && e.button===0){
      e.preventDefault();
      const startX=e.clientX,startY=e.clientY;
      const startLeft=parseInt(img.style.left||0),startTop=parseInt(img.style.top||0);
      img.classList.add('dragging');

      function onMouseMove(ev){ img.style.left=(startLeft+ev.clientX-startX)+'px'; img.style.top=(startTop+ev.clientY-startY)+'px'; }
      function onMouseUp(){ img.classList.remove('dragging'); document.removeEventListener('mousemove',onMouseMove); document.removeEventListener('mouseup',onMouseUp); saveIDBState(false); }
      document.addEventListener('mousemove',onMouseMove);
      document.addEventListener('mouseup',onMouseUp);
    }
  };
}

// --- cargar ficha y video---
function loadFicha(src,left=null,top=null,id=null,isData=false,name=null,width=100,height=100){
  let ficha;

  if(src.endsWith('.webm')) {
  ficha = document.createElement('video');
  ficha.src = src;
  ficha.autoplay = true;
  ficha.loop = true;
  ficha.muted = true;
  ficha.playsInline = true;
  ficha.controls = true;        // 🔹 visible aunque no arranque
  ficha.style.background = "#000"; // 🔹 cuadro negro por defecto
  console.log("Añadiendo ficha:", src, ficha);


    // 🔹 Forzar reproducción en Chrome
    ficha.addEventListener('canplay', () => {
      const p = ficha.play();
      if(p !== undefined){
        p.catch(err => {
          console.warn("Chrome bloqueó autoplay, esperando interacción:", err);
        });
      }
    });

  } else {
    ficha = document.createElement('img');
    ficha.src = src;
  }

  ficha.dataset.localpath = src;
  ficha.style.width = width+'px';
  ficha.style.height = height+'px';
  ficha.style.left = (left!==null)?left+'px':(area.clientWidth/2-50)+'px';
  ficha.style.top = (top!==null)?top+'px':(area.clientHeight/2-50)+'px';
  ficha.style.position = 'absolute';
  ficha.style.zIndex = 2;
  ficha.dataset.ficha='true';
  if(name) ficha.dataset.name=name;

  area.appendChild(ficha);
  fichas.push(ficha);

  ficha.onmousedown = (e)=>{
    if(fichaMode && e.button===0 && !resizeMode){
        e.preventDefault();

        // Ctrl+click añade o quita de la selección
        if(e.ctrlKey){
  if(selectedFichas.includes(ficha)){
    selectedFichas = selectedFichas.filter(f => f!==ficha);
    ficha.classList.remove('selected');
  } else {
    selectedFichas.push(ficha);
    ficha.classList.add('selected');
  }
  return;
}

        // Si la ficha no está seleccionada, seleccionarla sola
        if(!selectedFichas.includes(ficha)){
            selectedFichas.forEach(f => f.classList.remove('selected'));
            selectedFichas = [ficha];
            ficha.classList.add('selected');
        }

        // Ahora sí, arrastrar todas las seleccionadas
        const startX = e.clientX, startY = e.clientY;
        const startPos = selectedFichas.map(f => ({f, left: parseInt(f.style.left||0), top: parseInt(f.style.top||0)}));
        ficha.classList.add('dragging');

        function onMouseMove(ev){
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            startPos.forEach(obj => {
                obj.f.style.left = obj.left + dx + 'px';
                obj.f.style.top = obj.top + dy + 'px';
            });
        }

        function onMouseUp(){
            ficha.classList.remove('dragging');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            pushHistory();
            saveIDBState(false);
        }

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    } else if(resizeMode){
      e.preventDefault();
      resizeTarget = ficha;
      resizeInput.style.display='block';
      resizeInput.value = parseInt(ficha.style.width);
      const rect = ficha.getBoundingClientRect();
      resizeInput.style.left = rect.right + 5 + 'px';
      resizeInput.style.top = rect.top + 'px';
      resizeInput.focus();
    }
  };

  ficha.oncontextmenu = (e)=>{
    if(fichaMode){
      e.preventDefault();
      fichas = fichas.filter(f => f !== ficha);
      selectedFichas = selectedFichas.filter(f => f!==ficha);
      ficha.parentNode?.removeChild(ficha);
      pushHistory();
      saveIDBState(false);
      showFeedback('Ficha eliminada ❌',1000);
    }
  };
}

// --- input resize ---
resizeInput.addEventListener('change',()=>{
  if(resizeTarget){
    let newSize = Math.max(10, parseInt(resizeInput.value));
    resizeTarget.style.width=newSize+'px';
    resizeTarget.style.height=newSize+'px';
    pushHistory();
    saveIDBState(false);
    showFeedback('Ficha redimensionada 🔹',1000);
    resizeInput.style.display='none';
    resizeTarget=null;
  }
});

// --- Manejo DROP fichas desde PC (localhost o cualquier carpeta) ---
fichaDrop.addEventListener('dragover', e => e.preventDefault());

fichaDrop.addEventListener('drop', e => {
  e.preventDefault();

  const files = Array.from(e.dataTransfer.files).filter(f =>
    f.type.startsWith('image/')
  );
  if(files.length === 0){ alert("Arrastra imágenes válidas"); return; }

  files.forEach(async file => {
    // Leer archivo como base64
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataURL = ev.target.result; // contiene el blob como base64
      loadFicha(dataURL, null, null, null, false, file.name);
      await saveIDBState(false); // persiste inmediatamente
    };
    reader.readAsDataURL(file);
  });
});



mapDrop.addEventListener('dragover', e=>e.preventDefault());
mapDrop.addEventListener('drop', e=>{
    e.preventDefault();
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if(files.length === 0){ alert("Arrastra imágenes válidas"); return; }
    const file = files[0]; // solo un mapa
    const localPath = `http://localhost:8000/05. Objetos/Majunji/${file.name}`; // <-- ruta relativa a la carpeta raíz del servidor
    clearMap();
    loadMap(localPath, area.clientWidth/2, area.clientHeight/2);
    pushHistory();
    saveIDBState(false);
});


// --- Botones ---
moveMapBtn.addEventListener('click',()=>{ moveMapMode=!moveMapMode; moveMapBtn.classList.toggle('active',moveMapMode); saveIDBState(false); });
fichaBtn.addEventListener('click',()=>{ 
  fichaMode=!fichaMode; 
  fichaBtn.classList.toggle('active',fichaMode); 
  if(!fichaMode){ selectedFichas.forEach(f=>f.classList.remove('selected')); selectedFichas=[]; } 
  saveIDBState(false); 
});
resizeBtn.addEventListener('click',()=>{ resizeMode=!resizeMode; resizeBtn.classList.toggle('active',resizeMode); resizeInput.style.display='none'; resizeTarget=null; saveIDBState(false); });
moveBoardBtn.addEventListener('click',()=>{ moveBoardMode=!moveBoardMode; moveBoardBtn.classList.toggle('active',moveBoardMode); saveIDBState(false); });
exportBtn.addEventListener('click',()=>exportStateJSON());
importBtn.addEventListener('click',()=>importFile.click());
importFile.addEventListener('change',(ev)=>{ const file=ev.target.files[0]; if(file) importStateFromFile(file); importFile.value=''; });
saveBtn.addEventListener('click',()=>{ saveIDBState(true); });
loadBtn.addEventListener('click', async ()=>{
  const saved = await idbGet(STATE_KEY);
  if(saved){ await restoreFromState(saved); showFeedback('Cargado desde IndexedDB ✅', 1200); }
  else { showFeedback('No hay estado guardado en IndexedDB', 1400); }
});

// --- Mover tablero ---
area.onmousedown = (e)=>{
  if(moveBoardMode && e.button===0 && currentImage){
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startMapLeft = parseInt(currentImage.style.left||0);
    const startMapTop = parseInt(currentImage.style.top||0);
    const startFichas = fichas.map(f=>({f,fLeft:parseInt(f.style.left||0), fTop:parseInt(f.style.top||0)}));
    function onMouseMove(ev){
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      currentImage.style.left = startMapLeft + dx + 'px';
      currentImage.style.top = startMapTop + dy + 'px';
      startFichas.forEach(obj=>{
        obj.f.style.left = obj.fLeft + dx + 'px';
        obj.f.style.top = obj.fTop + dy + 'px';
      });
    }
    function onMouseUp(){
      document.removeEventListener('mousemove',onMouseMove);
      document.removeEventListener('mouseup',onMouseUp);
      pushHistory();
      saveIDBState(false);
    }
    document.addEventListener('mousemove',onMouseMove);
    document.addEventListener('mouseup',onMouseUp);
  }
};

// --- Restaurar desde estado (objeto) ---
async function restoreFromState(state){
  clearAllFichas();
  if(currentImage){ area.removeChild(currentImage); currentImage=null; }
  if(state.map) loadMap(state.map.src, state.map.left, state.map.top);
  if(Array.isArray(state.fichas)) state.fichas.forEach(f=>loadFicha(f.src, f.left, f.top, null, false, f.name, f.width, f.height));
  // modos
  fichaMode=!!state.fichaMode;
  resizeMode=!!state.resizeMode;
  moveMapMode=!!state.moveMapMode;
  moveBoardMode=!!state.moveBoardMode;
  moveMapBtn.classList.toggle('active',moveMapMode);
  fichaBtn.classList.toggle('active',fichaMode);
  resizeBtn.classList.toggle('active',resizeMode);
  moveBoardBtn.classList.toggle('active',moveBoardMode);
}

// --- Carga al inicio (desde IndexedDB, con fallback) ---
window.addEventListener('load', async ()=>{
  try{
    const saved = await idbGet(STATE_KEY);
    if(saved){
      await restoreFromState(saved);
    } else {
      // Fallback a un mapa por defecto si no hay estado
      loadMap('Mapa_Posada_Sótano.jpg');
      await saveIDBState(false);
    }
  }catch(err){
    console.error('Error cargando IndexedDB', err);
    loadMap('Mapa_Posada_Sótano.jpg');
  }
});

// --- Botón medir ---
measureBtn.addEventListener('click', ()=>{
    measureMode = !measureMode;
    measureBtn.classList.toggle('active', measureMode);
    if(!measureMode){
        measureLines.forEach(l => area.removeChild(l));
        measureTexts.forEach(t => area.removeChild(t));
        measureLines = [];
        measureTexts = [];
        measureStart = null;
    }
});

// --- Manejo clicks para medición ---
area.addEventListener('click', (e)=>{
    if(!measureMode) return;
    const rect = area.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if(!measureStart){
        measureStart = {x, y};
    } else {
        const dx = x - measureStart.x;
        const dy = y - measureStart.y;
        const distancePx = Math.sqrt(dx*dx + dy*dy);
        const distanceM = (distancePx/76)*1.5;

        // Crear línea nueva
        const line = document.createElement('div');
        line.className='measurement-line';
        line.style.width = distancePx+'px';
        line.style.left = measureStart.x+'px';
        line.style.top = measureStart.y+'px';
        line.style.transform = `rotate(${Math.atan2(dy,dx)}rad)`;
        area.appendChild(line);
        measureLines.push(line);

        // Crear texto nuevo
        const text = document.createElement('div');
        text.className='measurement-text';
        text.textContent = `${distanceM.toFixed(2)} m`;
        text.style.left = ((measureStart.x+x)/2)+'px';
        text.style.top = ((measureStart.y+y)/2 - 20)+'px';
        area.appendChild(text);
        measureTexts.push(text);

        measureStart=null;
    }
});

document.addEventListener("click", ()=>{
  fichas.forEach(f=>{
    if(f.tagName === "VIDEO"){
      f.play().catch(()=>{});
    }
  });
},{once:true});

</script>
</body>
</html>
