<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa Interactivo</title>
  <style>
    :root{
      --bg-screen: #0e1522;
      --parchment: #b89368;
      --parchment-2: #d2b48c;
      --ink: #2a1f0f;
      --shadow: rgba(0,0,0,.4);
    }
    html,body{
      margin:0; padding:0; height:100%; background: var(--bg-screen); color: #eee; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    .toolbar{
      position: sticky; top:0; z-index:1000; background: #0b101b; border-bottom: 1px solid #1e2a3d; padding: .5rem; display:flex; gap:.5rem; align-items:center; flex-wrap: wrap;
    }
    .title-edit{ background:#0f1726; color:#e5e7eb; border:1px solid #22324d; padding:.35rem .5rem; border-radius:.5rem; width: min(420px, 60vw); }
    .btn{ cursor:pointer; background: #1a2538; color:#e5e7eb; border:1px solid #2b3d5f; padding:.45rem .7rem; border-radius:.6rem; box-shadow: 0 2px 6px var(--shadow); font-weight:600; user-select:none; }
    .hint{opacity:.8; font-size:.9rem;}

    .stage-wrap{ display:flex; justify-content:center; padding: 1rem; }
    .stage{ width: 1920px; height: 1080px; position: relative; border: 3px solid #2b3d5f; border-radius: 12px; overflow: hidden; background: #101826; box-shadow: 0 8px 20px var(--shadow); }
    .map-bg{ width:100%; height:100%; object-fit: cover; display:block; }

    .overlay{ position:absolute; inset:0; pointer-events:none; }

    .marker{ position:absolute; width:22px; height:22px; border-radius:50%; background: radial-gradient(circle at 30% 30%, #ffd08a, #e09a3f 60%, #804b00 100%); border:1px solid #3a250e; box-shadow: 0 2px 8px var(--shadow); transform: translate(-50%, -50%); cursor: grab; pointer-events:auto; }
    .marker[data-title]::before{ content: attr(data-title); position:absolute; bottom: 120%; left:50%; transform: translateX(-50%); background: rgba(16,24,38,.9); color:#f3e7d3; padding:.2rem .35rem; border:1px solid #3a2a17; border-radius:.35rem; font-size:.75rem; white-space: nowrap; pointer-events:none; }

    .modal-backdrop{ position:fixed; inset:0; background: rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:1rem; z-index:2000; }
.modal{
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  max-height: 100vh;
  border-radius: 0;
  overflow: hidden; /* sin scroll interno */
  display: flex;
  flex-direction: column;
  padding: 0;
}
    .modal h3{ margin:.2rem 0 .6rem; font-size:1.4rem; }
.modal .row {
  display: flex;        /* cambiar grid a flex para ocupar todo */
  flex: 1;              /* ocupa todo el alto disponible */
  gap: 0;               /* opcional, ajusta si quieres margen */
}
.modal .row > div {
  flex: 1;              /* columnas iguales */
  display: flex;
  flex-direction: column;
}
    .modal input[type="text"], .modal textarea{ width:100%; background: #f3e7d3; color:#2a1f0f; border:1px solid #6e4d2d; border-radius:.5rem; padding:.5rem .6rem; }
.modal .img-frame {
  flex: 1;                  /* ocupa todo el alto disponible */
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 0;
  border: none;
  border-radius: 0;
  background: #f6ebd6;
}
.modal .img-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;      /* mantiene proporción sin recortar */
  border-radius: 0;
}
.modal input, .modal textarea {
  flex: 1;
  width: 100%;
  margin: 0;
}


    .popup-card{ opacity:0; transform:scale(.96); transition:opacity .35s, transform .35s; pointer-events:none; }
    .popup-card.show{ opacity:1; transform:scale(1); pointer-events:auto; }

    .actions{ display:flex; justify-content: space-between; gap:.5rem; margin-top:.8rem; }
    .modal .btn{ background:#8b5e34; border-color:#6e4d2d; color:#fdf5e6; }
    .modal .btn.secondary{ background:#3c2a1a; }
    .modal .btn.danger{ background:#5b2b20; }

    .hidden { display: none !important; }

  </style>
</head>
<body>
  <header class="toolbar">
    <input id="docTitle" class="title-edit" value="Mapa Interactivo" />
    <button class="btn" id="btnToggleMode">Modo: Edición</button>
    <span class="mode-indicator" id="modeIndicator">Edición</span>

    <button class="btn" id="btnLoadBG">Cargar mapamundi</button>
    <input type="file" id="fileBG" accept="image/*" class="hidden" />

    <button class="btn" id="btnAddMarker">Añadir punto</button>

    <button class="btn" id="btnSave">Guardar</button>
    <button class="btn" id="btnExport">Exportar JSON</button>
    <label class="btn" for="fileImport">Importar JSON</label>
    <input type="file" id="fileImport" accept="application/json" class="hidden" />

    <div class="legend hint">Click en el mapa para añadir. Arrastra para mover. Click para editar. Secundario para borrar.</div>
  </header>

  <main class="stage-wrap">
    <section class="stage" id="stage">
      <canvas id="mapCanvas" class="map-bg"></canvas>
      <div id="markerLayer" class="overlay"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal popup-card" id="modal">
      <h3>Editar lugar</h3>
      <div class="row">
        <div>
          <label for="locTitle">Título</label>
          <input type="text" id="locTitle" placeholder="Nombre del lugar" />
          <div style="height:.6rem"></div>
          <label for="locDesc">Descripción</label>
          <textarea id="locDesc" placeholder="Historia, clima, cultura..."></textarea>
          <div style="height:.6rem"></div>
          <label for="locNotes">Anotaciones</label>
          <textarea id="locNotes" placeholder="Rumores, ganchos, PNJ, misiones..."></textarea>
        </div>
        <div>
          <div class="pill">
            <button class="btn" id="btnLoadRegion">Cargar mapa de región</button>
            <input type="file" id="fileRegion" accept="image/*" class="hidden" />
          </div>
          <div class="img-frame" id="regionFrame"><span class="hint">Sin imagen</span></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn danger" id="btnDeleteMarker">Borrar punto</button>
        <div>
          <button class="btn secondary" id="btnCancel">Cerrar</button>
          <button class="btn" id="btnApply">Aplicar</button>
        </div>
      </div>
    </div>
  </div>

<script>
/* Versión limpia y coherente: un solo canvas, una sola capa de marcadores y un modal grande */
const mapCanvas = document.getElementById('mapCanvas');
const ctx = mapCanvas.getContext('2d');
const markerLayer = document.getElementById('markerLayer');

mapCanvas.width = 1920;
mapCanvas.height = 1080;

let mapScale = 1;
let mapOffsetX = 0;
let mapOffsetY = 0;
let isPanningMap = false;
let startPanX = 0;
let startPanY = 0;

let bgImage = null;
let state = { title: document.getElementById('docTitle').value.trim(), background: '', markers: [] };
let autosaveTimer = null;
const $ = (s,p=document) => p.querySelector(s);
const $$ = (s,p=document) => Array.from(p.querySelectorAll(s));

function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveNow, 600); }
async function saveNow(){
  state.title = $('#docTitle').value.trim() || 'Mapa Interactivo';
  document.title = state.title;
  state.updatedAt = new Date().toISOString();
  try{ const db = await openDB(); const tx = db.transaction('maps','readwrite'); tx.objectStore('maps').put(structuredClone(state)); }catch(e){ console.warn(e); }
  try{ localStorage.setItem('mapa:'+state.title, JSON.stringify(state)); }catch(e){}
}

/* IndexedDB helper */
const DB_NAME='MapaInteractivoDB', DB_STORE='maps';
function openDB(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { const db = e.target.result; if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE,{ keyPath:'title' }); };
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
  });
}
async function idbGet(title){ try{ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(DB_STORE,'readonly'); const rq=tx.objectStore(DB_STORE).get(title); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }catch(e){ return null; }}

/* RENDER */
function render(){
  ctx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
  if(bgImage){
    ctx.save();
    ctx.translate(mapOffsetX,mapOffsetY);
    ctx.scale(mapScale,mapScale);
    ctx.drawImage(bgImage,0,0,mapCanvas.width,mapCanvas.height);
    ctx.restore();
  }
  // sincronizar capa DOM de marcadores con transform
  markerLayer.style.transformOrigin = '0 0';
  markerLayer.style.transform = `translate(${mapOffsetX}px, ${mapOffsetY}px) scale(${mapScale})`;
  renderMarkers();
}

function renderMarkers(){
  $$('.marker', markerLayer).forEach(n=>n.remove());
  for(const m of state.markers){
    const el = document.createElement('div');
    el.className = 'marker';
    // usamos porcentajes para posicionar relativo al tamaño del stage
    el.style.left = (m.x*100) + '%';
    el.style.top  = (m.y*100) + '%';
    el.dataset.id = m.id;
    if(m.title) el.dataset.title = m.title;
    attachMarkerEvents(el);
    markerLayer.appendChild(el);
  }
}

/* MARcADORES */
function newMarker(px,py){
  const rect = document.getElementById('stage').getBoundingClientRect();
  const x = (px - rect.left) / rect.width;
  const y = (py - rect.top) / rect.height;
  const id = crypto.randomUUID();
  const marker = { id, x, y, title:'', desc:'', notes:'', regionImg:'' };
  state.markers.push(marker);
  scheduleAutosave();
  render();
  if(editMode) openEditor(id);
}
function deleteMarker(id){
  state.markers = state.markers.filter(m=>m.id!==id);
  scheduleAutosave();
  render();
  closePopup(modal);
}
function attachMarkerEvents(el){
  let clickCount = 0, clickTimer;
  el.addEventListener('click', e=>{
    e.stopPropagation();
    const id = el.dataset.id;
    const m = state.markers.find(mm=>mm.id===id);
    if(editMode){ openEditor(id); return; }
    clickCount++; clearTimeout(clickTimer);
    clickTimer = setTimeout(()=>{ clickCount=0; },350);
    if(clickCount===1) showMiniInfo(el,m);
    else if(clickCount===2){ removeMiniInfo(); openRegionView(id); clickCount=0; }
  });
  el.addEventListener('contextmenu', e=>{ e.preventDefault(); if(editMode) deleteMarker(el.dataset.id); });

  // drag en modo edición (actualiza porcentaje)
  let dragging=false;
  function onMove(ev){
    if(!dragging) return;
    const rect = document.getElementById('stage').getBoundingClientRect();
    state.markers = state.markers.map(mk=>{
      if(mk.id===el.dataset.id){
        mk.x = Math.min(1, Math.max(0, (ev.clientX - rect.left)/rect.width));
        mk.y = Math.min(1, Math.max(0, (ev.clientY - rect.top)/rect.height));
        el.style.left = (mk.x*100)+'%';
        el.style.top  = (mk.y*100)+'%';
      }
      return mk;
    });
  }
  let draggingMarker = null;
el.addEventListener('mousedown', ev=>{
  if(!editMode) return;
  draggingMarker = el;
  document.addEventListener('mousemove', onMove);
});
window.addEventListener('mouseup', ()=>{
  if(draggingMarker){
    draggingMarker = null;
    document.removeEventListener('mousemove', onMove);
    scheduleAutosave();
  }
});
}

/* Mini-info */
let miniInfoEl = null;
function showMiniInfo(el,m){
  removeMiniInfo();
  miniInfoEl = document.createElement('div');
  miniInfoEl.className = 'mini-info';
  miniInfoEl.style.position = 'absolute'; miniInfoEl.style.zIndex = 2100;
  miniInfoEl.style.background = 'rgba(16,24,38,0.95)'; miniInfoEl.style.color = '#f3e7d3';
  miniInfoEl.style.padding = '8px'; miniInfoEl.style.border = '1px solid #3a2a17'; miniInfoEl.style.borderRadius = '6px';
  miniInfoEl.style.maxWidth = '320px'; miniInfoEl.style.fontSize = '.9rem';
  miniInfoEl.innerHTML = `<strong>${m.title||'Sin título'}</strong><div style="margin-top:.3rem; max-height:6rem; overflow:hidden;">${(m.desc||'').substring(0,300)}</div>`;
  const rect = document.getElementById('stage').getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  let left = elRect.left - rect.left + 24;
  let top  = elRect.top  - rect.top  - 8;
  if(left + 340 > rect.width) left = rect.width - 360;
  if(top < 0) top = elRect.top - rect.top + 28;
  miniInfoEl.style.left = left+'px'; miniInfoEl.style.top = top+'px';
  document.getElementById('stage').appendChild(miniInfoEl);

  const onClickOutside = (ev)=>{
    if(!miniInfoEl.contains(ev.target)) removeMiniInfo();
    document.removeEventListener('click', onClickOutside);
  };
  document.addEventListener('click', onClickOutside);
}

function removeMiniInfo(){ if(miniInfoEl && miniInfoEl.parentNode){ miniInfoEl.remove(); miniInfoEl=null; } }

/* Modal / editor (pergamino) */
const modalBackdrop = $('#modalBackdrop'), modal = $('#modal');
const locTitle = $('#locTitle'), locDesc = $('#locDesc'), locNotes = $('#locNotes');
const regionFrame = $('#regionFrame'), fileRegion = $('#fileRegion');
const btnDeleteMarker = $('#btnDeleteMarker'), btnApply = $('#btnApply'), btnLoadRegion = $('#btnLoadRegion');

let currentId = null;
function setModalMode(editable){
  locTitle.readOnly = !editable; locDesc.readOnly = !editable; locNotes.readOnly = !editable;
  btnLoadRegion.style.display = editable ? '' : 'none';
  btnDeleteMarker.style.display = editable ? '' : 'none';
  btnApply.style.display = editable ? '' : 'none';
}
function openPopup(popup){ modalBackdrop.style.display='flex'; requestAnimationFrame(()=> popup.classList.add('show')); }
function closePopup(popup){ popup.classList.remove('show'); setTimeout(()=>{ if(!modal.classList.contains('show')) modalBackdrop.style.display='none'; },420); }
modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closePopup(modal); });

function drawRegion(dataURL){
  regionFrame.innerHTML = '';
  if(dataURL){
    const img = new Image(); img.src = dataURL; img.style.maxWidth='100%'; img.style.maxHeight='100%'; img.style.borderRadius='10px'; img.style.cursor='zoom-in';
    img.addEventListener('dblclick', ev=>{
      ev.stopPropagation();
      if(!editMode){
        if(img.style.transform==='scale(1.5)'){ img.style.transform=''; img.style.cursor='zoom-in'; }
        else { img.style.transform='scale(1.5)'; img.style.cursor='zoom-out'; }
        img.style.transition='transform .25s';
      }
    });
    regionFrame.appendChild(img);
  } else regionFrame.innerHTML = '<span class="hint">Sin imagen</span>';
}

function openEditor(id){
  currentId = id; const m = state.markers.find(x=>x.id===id); if(!m) return;
  setModalMode(true); locTitle.value = m.title||''; locDesc.value = m.desc||''; locNotes.value = m.notes||'';
  drawRegion(m.regionImg); openPopup(modal);
}
function openRegionView(id){
  currentId = id; const m = state.markers.find(x=>x.id===id); if(!m) return;
  setModalMode(false); locTitle.value = m.title||''; locDesc.value = m.desc||''; locNotes.value = m.notes||'';
  drawRegion(m.regionImg); openPopup(modal);
}

$('#btnApply').addEventListener('click', ()=>{
  if(!currentId) return closePopup(modal);
  const m = state.markers.find(x=>x.id===currentId); if(!m) return closePopup(modal);
  m.title = locTitle.value.trim(); m.desc = locDesc.value; m.notes = locNotes.value;
  scheduleAutosave(); render(); closePopup(modal);
});
$('#btnCancel').addEventListener('click', ()=> closePopup(modal));
btnDeleteMarker.addEventListener('click', ()=> { if(currentId) deleteMarker(currentId); });

btnLoadRegion.addEventListener('click', ()=> fileRegion.click());
fileRegion.addEventListener('change', async (e)=>{
  const file = e.target.files?.[0]; if(!file || !currentId) return;
  const dataURL = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  const m = state.markers.find(x=>x.id===currentId); if(!m) return;
  m.regionImg = dataURL; drawRegion(dataURL); scheduleAutosave();
});

/* Controles generales (barra superior) */
$('#btnAddMarker').addEventListener('click', ()=>{
  const stage = document.getElementById('stage');
  stage.style.cursor = 'crosshair';
  function onClick(ev){
    newMarker(ev.clientX, ev.clientY);
    stage.removeEventListener('click', onClick);
    stage.style.cursor = '';
  }
  stage.addEventListener('click', onClick);
});

$('#btnLoadBG').addEventListener('click', ()=> $('#fileBG').click());
$('#fileBG').addEventListener('change', async (e)=>{
  const file = e.target.files?.[0]; if(!file) return;
  const dataURL = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  state.background = dataURL; bgImage = new Image(); bgImage.onload = ()=> render(); bgImage.src = dataURL; scheduleAutosave();
});
$('#btnSave').addEventListener('click', saveNow);
$('#btnExport').addEventListener('click', ()=>{ state.title = $('#docTitle').value.trim() || 'Mapa Interactivo'; const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${state.title}.json`; a.click(); URL.revokeObjectURL(a.href); });
$('#fileImport').addEventListener('change', async (e)=>{ const file=e.target.files?.[0]; if(!file) return; const text=await file.text(); try{ const obj=JSON.parse(text); if(!obj||!obj.markers) throw new Error('JSON inválido'); state=obj; document.title=state.title||'Mapa Interactivo'; $('#docTitle').value=document.title; if(state.background){ bgImage=new Image(); bgImage.onload=()=>render(); bgImage.src=state.background; } else bgImage=null; render(); scheduleAutosave(); }catch(err){ alert('No se pudo importar el JSON.'); console.error(err); } });

/* Cambio de título (recupera mapa guardado si existe) */
let titleTimer=null;
$('#docTitle').addEventListener('input', ()=>{ clearTimeout(titleTimer); titleTimer=setTimeout(async ()=>{ const t=$('#docTitle').value.trim(); if(!t) return; const saved = await idbGet(t); if(saved) state=saved; else { state.title=t; document.title=t; } if(state.background){ bgImage=new Image(); bgImage.onload=()=>render(); bgImage.src=state.background; } render(); scheduleAutosave(); },500); });

/* Zoom y paneo del mapa (solo en interacción) */
let editMode = true;
$('#btnToggleMode').addEventListener('click', ()=>{
  editMode = !editMode;
  $('#btnToggleMode').textContent = 'Modo: ' + (editMode ? 'Edición' : 'Interacción');
  $('#modeIndicator').textContent = editMode ? 'Edición' : 'Interacción';
});
mapCanvas.addEventListener('wheel', (e)=>{
  if(!editMode){
    e.preventDefault();
    const factor = 1 + (e.deltaY * -0.001); // factor suave
    const newScale = Math.min(Math.max(1, mapScale * factor), 3);
    mapScale = newScale;
    render();
  }
}, {passive:false});
mapCanvas.addEventListener('mousedown', (e)=>{ if(!editMode && mapScale>1){ isPanningMap=true; startPanX = e.clientX - mapOffsetX; startPanY = e.clientY - mapOffsetY; }});
window.addEventListener('mousemove', (e)=>{ if(isPanningMap){ mapOffsetX = e.clientX - startPanX; mapOffsetY = e.clientY - startPanY; render(); }});
window.addEventListener('mouseup', ()=> isPanningMap=false);

/* Inicio */
(async function init(){
  try{ const db = await openDB(); const initial = await idbGet(state.title); if(initial) state = initial; }catch(err){ console.warn('IndexedDB no disponible', err); }
  document.title = state.title;
  if(state.background){ bgImage = new Image(); bgImage.onload = ()=> render(); bgImage.src = state.background; } else render();
})();
</script>
</body>
</html>
