<script>

let db;
function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('DiarioMisionesDB', 1);

    request.onupgradeneeded = function(e) {
  db = e.target.result;
  if (!db.objectStoreNames.contains('misiones')) {
    db.createObjectStore('misiones', { keyPath: 'id' });
  }
};

    request.onsuccess = function(e) {
      db = e.target.result;
      resolve(db);
    };

    request.onerror = function() {
      reject('Error al abrir IndexedDB');
    };
  });
}

const STORAGE_KEY = 'diarioMisiones_v1';
const filenameBase = 'Estado Diario de Misiones.json';

let missions = [];
let autosaveEnabled = true;
let autosaveDebounceTimer = null;

function uid(){ return 'm_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }

async function saveIndexedDB(showToast = true) {
  await initDB();
  const tx = db.transaction('misiones', 'readwrite');
  const store = tx.objectStore('misiones');

  const clearReq = store.clear();
  clearReq.onsuccess = () => { missions.forEach(m => store.put(m)); };

  tx.oncomplete = () => {
    document.getElementById('lastSaved').textContent = new Date().toLocaleString('es-ES');
    document.getElementById('storageInfo').textContent = 'Guardado en IndexedDB ✔';
    if (showToast) flashStatus('Guardado en IndexedDB');
  };
}

async function loadIndexedDB() {
  await initDB();
  return new Promise((resolve) => {
    const tx = db.transaction('misiones', 'readonly');
    const store = tx.objectStore('misiones');
    const request = store.getAll();
    request.onsuccess = function () {
      if (request.result.length > 0) {
        missions = request.result;
        renderAll();
        document.getElementById('lastSaved').textContent = new Date().toLocaleString('es-ES');
        document.getElementById('storageInfo').textContent = 'Cargado desde IndexedDB';
        resolve(true);
      } else {
        resolve(false);
      }
    };
  });
}

function updateSizeInfo(bytes){
  const kb = Math.round(bytes/1024);
  const el = document.getElementById('sizeInfo');
  el.textContent = kb + ' KB';
  const warnEl = document.getElementById('storageInfo');
  if(bytes > 4*1024*1024){
    warnEl.textContent = '⚠ Datos muy grandes para LocalStorage (riesgo)';
    warnEl.style.color = '#ffd6d6';
  } else {
    warnEl.style.color = '';
  }
}

function flashStatus(msg){
  const el = document.getElementById('storageInfo');
  const old = el.textContent;
  el.textContent = msg;
  setTimeout(()=> el.textContent = 'Guardado local ✔', 1200);
}

// filtros
const hideActiveCheckbox = document.getElementById('hideActive');
const hideRumorCheckbox = document.getElementById('hideRumor');
const hideCompletedCheckbox = document.getElementById('hideCompleted');
const hideOcultasCheckbox = document.getElementById('hideOcultas');

function saveFilters() {
  const filtersState = {
    hideActive: hideActiveCheckbox.checked,
    hideRumor: hideRumorCheckbox.checked,
    hideCompleted: hideCompletedCheckbox.checked,
    hideOcultas: hideOcultasCheckbox.checked
  };
  localStorage.setItem('filtersState', JSON.stringify(filtersState));
}

function loadFilters() {
  const stored = localStorage.getItem('filtersState');
  if(stored){
    const f = JSON.parse(stored);
    hideActiveCheckbox.checked = f.hideActive;
    hideRumorCheckbox.checked = f.hideRumor;
    hideCompletedCheckbox.checked = f.hideCompleted;
    hideOcultasCheckbox.checked = f.hideOcultas;
  }
}

hideActiveCheckbox.addEventListener('change', () => { renderAll(); saveFilters(); });
hideRumorCheckbox.addEventListener('change', () => { renderAll(); saveFilters(); });
hideCompletedCheckbox.addEventListener('change', () => { renderAll(); saveFilters(); });
hideOcultasCheckbox.addEventListener('change', () => { renderAll(); saveFilters(); });

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const storedHandle = await loadDirHandle();
    if (storedHandle) {
      // Pedir permiso para lectura/escritura

  } catch (e) {
    console.warn('No se pudo restaurar la carpeta de imágenes:', e);
    imagesDirHandle = null;
  }

  // Luego cargamos las misiones
  const loaded = await loadIndexedDB();
  if (!loaded) renderAll();


loadFilters();
renderAll();



});

function renderAll(){
  ['listActiva','listRumor','listCompletada','listOcultas'].forEach(id => {
    document.getElementById(id).innerHTML = '';
  });

  const q = document.getElementById('search').value.toLowerCase();
  const hideActive = hideActiveCheckbox.checked;
  const hideRumor = hideRumorCheckbox.checked;
  const hideCompleted = hideCompletedCheckbox.checked;
  const hideOcultas = hideOcultasCheckbox.checked;

  ['activa','rumor','completada','ocultas'].forEach(category => {
  const colEl = document.getElementById('col' + capitalize(category));
  let shouldHide = false;

  if(category === 'activa') shouldHide = hideActive;
  else if(category === 'rumor') shouldHide = hideRumor;
  else if(category === 'completada') shouldHide = hideCompleted;
  else if(category === 'ocultas') shouldHide = hideOcultas;

  if(shouldHide){
    colEl.style.maxWidth = '0';
    colEl.style.padding = '0';
    colEl.style.opacity = '0';
    colEl.style.pointerEvents = 'none';
  } else {
    colEl.style.maxWidth = '1000px'; 
    colEl.style.padding = '10px';
    colEl.style.opacity = '1';
    colEl.style.pointerEvents = 'auto';
  }

  const listEl = document.getElementById('list' + capitalize(category));
  missions
  .filter(m => m.category === category)
  .filter(m => !q || (m.title+m.description+m.notes+(m.reward||'')).toLowerCase().includes(q))
  .sort((a,b) => a.order - b.order)
  .forEach(m => listEl.appendChild(createCard(m)));
});

  markCardsDraggable();
  enableDragAndDrop();
  updateSizeInfo(JSON.stringify({missions}).length);
}

function markCardsDraggable(){
  document.querySelectorAll('.card').forEach(card => {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
}

function getDragAfterElement(container, y){
  const draggableElements = [...container.querySelectorAll('.card:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset){
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function enableDragAndDrop(){
  ['listActiva','listRumor','listCompletada', 'listOcultas'].forEach(listId => {
    const listEl = document.getElementById(listId);
    let placeholder; // <- ahora placeholder es LOCAL a cada lista

    listEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      const afterElement = getDragAfterElement(listEl, e.clientY);
      if(!placeholder){
        placeholder = document.createElement('div');
        placeholder.className = 'card placeholder';
        placeholder.style.height = '50px';
        placeholder.style.marginBottom = '10px';
        placeholder.style.border = '2px dashed #7a4b2b';
      }
      if(afterElement == null) listEl.appendChild(placeholder);
      else listEl.insertBefore(placeholder, afterElement);
    });

    listEl.addEventListener('drop', (e) => {
      e.preventDefault();
      const draggingId = e.dataTransfer.getData('text/plain');
      const draggingEl = document.querySelector(`.card[data-id='${draggingId}']`);
      if(draggingEl && placeholder && placeholder.parentNode){
        listEl.insertBefore(draggingEl, placeholder);
        placeholder.parentNode.removeChild(placeholder);
        placeholder = null;
      }
      updateMissionOrder();
      scheduleSave();
    });
  });
}

function updateMissionOrder(){
  ['listActiva','listRumor','listCompletada', 'listOcultas'].forEach(listId => {
    const listEl = document.getElementById(listId);
    [...listEl.children].forEach((card, index) => {
      const m = missions.find(mm => mm.id === card.dataset.id);
      if(m) m.order = index;
    });
  });
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

// attach drop-end to save order
['listActiva','listRumor','listCompletada'].forEach(id => {
  document.getElementById(id).addEventListener('drop', ()=>{ updateMissionOrder(); scheduleSave(); });
});

// === NUEVO: File System Access API (para copiar imagenes en la carpeta /images del servidor) ===
let imagesDirHandle = null;

const DB_HANDLES = "HandlesDB";
const STORE_HANDLES = "dirHandles";
const KEY_IMAGES_DIR = "imagesDirHandle";

function openHandlesDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_HANDLES, 1);
    req.onupgradeneeded = e => {
      const dbh = e.target.result;
      if (!dbh.objectStoreNames.contains(STORE_HANDLES)) {
        dbh.createObjectStore(STORE_HANDLES);
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveDirHandle(handle) {
  const dbh = await openHandlesDB();
  return new Promise((resolve, reject) => {
    const tx = dbh.transaction(STORE_HANDLES, "readwrite");
    tx.objectStore(STORE_HANDLES).put(handle, KEY_IMAGES_DIR);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function loadDirHandle() {
  const dbh = await openHandlesDB();
  return new Promise((resolve, reject) => {
    const tx = dbh.transaction(STORE_HANDLES, "readonly");
    const req = tx.objectStore(STORE_HANDLES).get(KEY_IMAGES_DIR);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function sanitizeFileName(name){
  return name
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // quita acentos
    .replace(/[^\w.\- ]+/g,'')                       // limpia raros
    .replace(/\s+/g,' ')                             // colapsa espacios
    .trim();
}

async function pickImagesFolder(){
  if(!window.showDirectoryPicker){
    alert('Tu navegador no soporta File System Access API. Usa Chrome/Edge recientes.');
    return;
  }
  try{
    const dir = await window.showDirectoryPicker({ mode:'readwrite' });
    imagesDirHandle = dir;
    await saveDirHandle(dir); // persistir
    document.getElementById('storageInfo').textContent = 'Carpeta de imágenes vinculada ✔';
  }catch(e){
    // cancelado por usuario o error
  }
}


async function copyFileToImagesDir(sourceFile){
  if(!imagesDirHandle) throw new Error('Primero elige la "Carpeta imágenes".');
  const safeName = sanitizeFileName(sourceFile.name);
  const uniqueName = `${Date.now()}_${safeName}`;
  const fileHandle = await imagesDirHandle.getFileHandle(uniqueName, { create:true });
  const writable = await fileHandle.createWritable();
  await writable.write(await sourceFile.arrayBuffer());
  await writable.close();
  return uniqueName;
}

function clearFormPreview(){
  // limpiar preview de la imagen
  if(form.dataset.imageObjectUrl){
    try{ URL.revokeObjectURL(form.dataset.imageObjectUrl); }catch(e){}
    delete form.dataset.imageObjectUrl;
  }
  delete form.dataset.imageFileName;
  imagePreviewEl.innerHTML = '';

  // limpiar input file
  imageFileInput.value = ''; 
}

// abrir formulario
function openForm(id){
  document.getElementById('formContainer').style.display = 'block';
  clearFormPreview();
  if(id){
    const m = missions.find(x => x.id === id);
    if(!m) return;
    document.getElementById('missionId').value = m.id;
    document.getElementById('title').value = m.title;
    document.getElementById('category').value = m.category;
    document.getElementById('description').value = m.description || '';
    document.getElementById('reward').value = m.reward || '';
    document.getElementById('notes').value = m.notes || '';
    // mostrar preview existente (archivo en ./images/)
    const fileInput = imageFileInput.files[0];
    if(fileInput){ // imagen nueva desde formulario
      const obj = URL.createObjectURL(fileInput);
      imagePreviewEl.innerHTML = `<img src="${obj}" style="max-width:120px;border-radius:4px;">`;
    } else if(m.imagePath){ // cargar desde ruta relativa (servida por localhost)
      imagePreviewEl.innerHTML = `<img src="${m.imagePath}" style="max-width:120px;border-radius:4px;">`;
    } else {
      imagePreviewEl.innerHTML = '';
    }
  } else {
    form.reset();
    document.getElementById('missionId').value = '';
    clearFormPreview();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('btnCancel').addEventListener('click', () => {
  document.getElementById('formContainer').style.display = 'none';
  clearFormPreview();
});

// cuando el usuario selecciona un archivo en el formulario (solo ahí)
imageFileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if(!f || !f.type.startsWith('image/')){
    clearFormPreview();
    return;
  }
  // limpia preview anterior si existía
  if(form.dataset.imageObjectUrl) {
    try{ URL.revokeObjectURL(form.dataset.imageObjectUrl); }catch(e){}
  }
  const obj = URL.createObjectURL(f);
  form.dataset.imageObjectUrl = obj;
  form.dataset.imageFileName = f.name; // guardamos nombre para cuando se haga submit
  imagePreviewEl.innerHTML = `<img src="${obj}" style="max-width:120px;border-radius:4px;">`;
});

document.getElementById('fileImport').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
  try {
    const imported = JSON.parse(ev.target.result);
    if(imported.missions){
      missions = imported.missions.map(m => ({
        ...m,
        order: typeof m.order === 'number' ? m.order : Date.now() + Math.random()*1000
      }));
      renderAll();      // renderiza primero
      scheduleSave();   // luego guarda
    }
  } catch(err){
    alert('Error al importar JSON: ' + err.message);
  }
};
  reader.readAsText(file);
});

document.getElementById('btnImportNow').addEventListener('click', ()=> document.getElementById('fileImport').click());

document.getElementById('btnClear').addEventListener('click', () => {
  if(confirm('¿Borrar todas las misiones?')){
    missions = [];
    scheduleSave();
    renderAll();
  }
});

document.getElementById('search').addEventListener('input', debounce(() => renderAll(), 250));

function scheduleSave(){
  if(autosaveDebounceTimer) clearTimeout(autosaveDebounceTimer);
  autosaveDebounceTimer = setTimeout(() => saveIndexedDB(false), 800);
}

function debounce(fn, wait=300){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(()=> fn.apply(this,args), wait);
  }
}

async function renderCard(m) {
  const card = document.createElement('div');
  card.className = `card ${m.category}`;
  card.dataset.id = m.id;

  const imgHtml = document.createElement('img');

  if(m.imagePath){
    const txImg = db.transaction('images', 'readonly');
    const storeImg = txImg.objectStore('images');
    const req = storeImg.get(m.imagePath);
    req.onsuccess = function(ev){
      const data = ev.target.result;
      if(data?.blob){
        const url = URL.createObjectURL(data.blob);
        imgHtml.src = url;
      }
    };
  }

  card.appendChild(imgHtml);
  // ... resto de la construcción de la card (meta, descripción, botones)
  return card;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('missionId').value || uid();
  const existingIndex = missions.findIndex(m => m.id === id);

  // Si se selecciona un archivo, solo usamos su nombre
  let imagePath = null;
  const fileInput = imageFileInput.files[0];
  if(fileInput){
    imagePath = `images/${encodeURIComponent(fileInput.name)}`;
  } else if(existingIndex >= 0){
    imagePath = missions[existingIndex].imagePath;
  }

  const payload = {
    id,
    title: document.getElementById('title').value.trim(),
    category: document.getElementById('category').value,
    description: document.getElementById('description').value.trim(),
    reward: document.getElementById('reward').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    imagePath,  // ruta relativa
    order: existingIndex >= 0 ? missions[existingIndex].order : Date.now(),
  };

  if (existingIndex >= 0) missions[existingIndex] = payload;
  else missions.push(payload);

  scheduleSave();
  renderAll();
  document.getElementById('formContainer').style.display = 'none';
  clearFormPreview();
});
