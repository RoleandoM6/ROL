<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consejos de rol — DVD Bounce</title>
  <style>
    :root {
      --bg1: #0f1220;
      --bg2: #111827;
      --txt: #ffffff;
      --accent: #00e0ff;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(60% 80% at 50% 50%, var(--bg2), var(--bg1));
      color: var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
      user-select: none;
    }
    .dot {
      position: absolute;
      width: 12px; height: 12px; border-radius: 50%;
      background: rgba(255,255,255,.05);
      filter: blur(2px);
      pointer-events: none;
      animation: float 12s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    #tip {
      position: absolute;
      top: 20px; left: 20px;
      max-width: min(60ch, 65vw);
      padding: 14px 18px;
      line-height: 1.2;
      font-weight: 700;
      font-size: clamp(16px, 3.2vw, 28px);
      border-radius: 14px;
      background: rgba(0,0,0,.45);
      border: 2px solid currentColor;
      box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 30px rgba(255,255,255,.04);
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      transition: transform .08s ease-out;
      will-change: transform, left, top, color;
      color: var(--accent);
    }
    .hud {
      position: fixed;
      left: 12px; bottom: 12px;
      display: flex; gap: 8px; align-items: center;
      padding: 8px 10px; border-radius: 12px;
      font-size: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(6px);
    }
    .hud label { opacity: .8; }
    .hud input[type="range"] { width: 160px; }
    .btn {
      appearance: none; cursor: pointer;
      padding: 6px 10px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.06);
      color: #fff; font-weight: 600;
    }
    .btn:hover { background: rgba(255,255,255,.12); }
    .credits { position: fixed; right: 12px; bottom: 12px; opacity: .4; font-size: 12px; }
    @media (max-width: 560px) {
      #tip { max-width: 80vw; }
    }
  </style>
</head>
<body>
  <div class="dot" style="left:8%; top:20%; animation-delay:.2s"></div>
  <div class="dot" style="left:70%; top:10%; animation-delay:.6s"></div>
  <div class="dot" style="left:30%; top:70%; animation-delay:1.1s"></div>
  <div class="dot" style="left:85%; top:65%; animation-delay:1.6s"></div>

  <div id="tip" aria-live="polite" aria-atomic="true">Cargando consejos…</div>

  <div class="hud">
    <label>Velocidad
      <input id="speed" type="range" min="80" max="480" value="240" />
    </label>
    <button class="btn" id="next">Siguiente</button>
    <button class="btn" id="shuffle">Aleatorio</button>
  </div>
  <div class="credits">DVD-like bounce • Consejos de rol</div>

  <script>
    const tips = [
      "Nunca te encariñes demasiado con tu personaje: el dado no tiene corazón.",
      "Pregunta primero, ataca después… o no, pero que sepas que lo intentaste.",
      "El plan más simple suele ser el único que funciona (y aún así fallará).",
      "Si no sabes qué hacer, hazlo dramático: el rol es teatro improvisado.",
      "Nunca subestimes el poder de un PNJ con nombre propio.",
      "Tira dados con confianza: da igual el resultado, parecerá que lo sabías.",
      "No discutas con el máster, negocia como si fueras tu personaje.",
      "Revisa tu inventario: seguro que guardas una cuerda, siempre salva partidas.",
      "El verdadero tesoro es el caos que generas en grupo.",
      "Antes de preguntar ‘¿qué hay en la habitación?’, asume que es una trampa.",
      "Describe demasiado y tus jugadores sospecharán, describe poco y te acusarán.",
      "No necesitas mapas perfectos, necesitas improvisación perfecta.",
      "Recuerda: los jugadores SIEMPRE harán lo contrario a lo que preparaste.",
      "Ten un PNJ comodín: tabernero, mercader o anciano sabio. Siempre te salva.",
      "A veces la mejor amenaza no es un dragón, sino una puerta cerrada.",
      "Nunca empieces en una taberna sin poner un borracho sospechoso.",
      "Si describes un objeto en detalle, los jugadores intentarán robárselo al rey.",
      "Los cofres con cerradura no son tesoros: son cebos del máster.",
      "La frase ‘no parece peligroso’ debería ir siempre entre comillas.",
      "Cuanto más inocente sea el PNJ, más querrán interrogarlo o adoptarlo.",
      "Si la trampa parece obvia, es doble trampa.",
      "Nunca toques la calavera que brilla, nunca.",
      "La retirada también es rol, aunque duela.",
      "Si el monstruo sonríe, huye.",
      "Recuerda: los dados aman la ironía."
    ];

    const $ = (sel) => document.querySelector(sel);
    const tipEl = $('#tip');
    const speedEl = $('#speed');
    const nextBtn = $('#next');
    const shuffleBtn = $('#shuffle');

    let idx = 0;
    let x = 40, y = 40;
    let vx = 220, vy = 180;
    let last = performance.now();

    function pickColor() {
      const h = Math.floor(Math.random() * 360);
      const s = 85 + Math.random() * 10;
      const l = 55 + Math.random() * 10;
      return `hsl(${h} ${s}% ${l}%)`;
    }

    function setTip(newIdx = null) {
      if (newIdx !== null) idx = newIdx;
      tipEl.textContent = tips[idx % tips.length];
      tipEl.style.color = pickColor();
      tipEl.style.transform = 'scale(1.02)';
      setTimeout(() => (tipEl.style.transform = 'scale(1)'), 90);
    }

    function nextTip() { setTip((idx + 1) % tips.length); }
    function randomTip() { setTip(Math.floor(Math.random() * tips.length)); }

    function loop(t) {
      const dt = Math.min(0.032, (t - last) / 1000);
      last = t;

      const speedFactor = Number(speedEl.value) / 220;
      x += vx * dt * speedFactor;
      y += vy * dt * speedFactor;

      const rect = tipEl.getBoundingClientRect();
      const W = window.innerWidth;
      const H = window.innerHeight;

      let hitX = false, hitY = false;

      if (x <= 0) { x = 0; vx = Math.abs(vx); hitX = true; }
      else if (x + rect.width >= W) { x = W - rect.width; vx = -Math.abs(vx); hitX = true; }

      if (y <= 0) { y = 0; vy = Math.abs(vy); hitY = true; }
      else if (y + rect.height >= H) { y = H - rect.height; vy = -Math.abs(vy); hitY = true; }

      tipEl.style.left = x + 'px';
      tipEl.style.top  = y + 'px';

      // Cambiar consejo en cada rebote (borde o esquina)
      if (hitX || hitY) {
        nextTip();
      }

      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
      const rect = tipEl.getBoundingClientRect();
      x = Math.min(Math.max(0, x), window.innerWidth - rect.width);
      y = Math.min(Math.max(0, y), window.innerHeight - rect.height);
    });

    nextBtn.addEventListener('click', nextTip);
    shuffleBtn.addEventListener('click', randomTip);

    setTip(0);

    window.addEventListener('load', () => {
      const r = tipEl.getBoundingClientRect();
      x = Math.random() * (window.innerWidth - r.width);
      y = Math.random() * (window.innerHeight - r.height);
      tipEl.style.left = x + 'px';
      tipEl.style.top  = y + 'px';
      requestAnimationFrame((t) => { last = t; loop(t); });
    });
  </script>
</body>
</html>
