<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>10.Mapamundi</title>
<style>
  body { margin:0; background:#222; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center;}
  #controls { margin:10px; display:flex; gap:5px; flex-wrap:wrap;}
  #tabs { display:flex; gap:5px; margin:5px;}
  .tab { padding:5px 10px; background:#444; cursor:pointer; border-radius:5px; }
  .tab.active { background:#666; font-weight:bold;}
  #mapContainer { width:1920px; height:1080px; background:#333; border:2px solid #555; position:relative; overflow:hidden;}
  canvas { position:absolute; top:0; left:0; width:1920px; height:1080px;}
  .notes { width:1920px; height:120px; margin-top:5px;}
</style>
</head>
<body>
<div id="controls">
  <button id="newMapBtn">Nuevo mapa</button>
  <input type="file" id="fileLoader" accept="image/*">
  <button id="exportBtn">Exportar JSON</button>
  <input type="file" id="importLoader" accept=".json">
</div>
<div id="tabs"></div>
<div id="mapContainer"></div>
<textarea id="notesArea" class="notes" placeholder="Notas del mapa..."></textarea>

<script>
let db;
let maps=[];
let activeMap=null;
let mapCounter = 0; // contador global de mapas creados (solo nuevos)
const tabsDiv=document.getElementById("tabs");
const container=document.getElementById("mapContainer");
const notesArea=document.getElementById("notesArea");
const fileLoader=document.getElementById("fileLoader");

tabsDiv.addEventListener("dragover", e=>{
  e.preventDefault(); // necesario para que funcione drop
  const dragging = document.querySelector(".tab.dragging");
  const afterElement = getDragAfterElement(tabsDiv, e.clientX);
  if(afterElement == null){
    tabsDiv.appendChild(dragging);
  }else{
    tabsDiv.insertBefore(dragging, afterElement);
  }
});

tabsDiv.addEventListener("drop", e=>{
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  
  // ⚡ Recalcular el orden real según el DOM actual
  reorderMaps();
});

// función auxiliar para calcular dónde soltar
function getDragAfterElement(container, x){
  const draggableElements = [...container.querySelectorAll(".tab:not(.dragging)")];
  return draggableElements.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width/2;
    if(offset < 0 && offset > closest.offset){
      return {offset: offset, element: child};
    }else{
      return closest;
    }
  }, {offset: Number.NEGATIVE_INFINITY}).element;
}

function reorderMaps(){
  const newOrder = [];
  const tabElements = [...tabsDiv.children];
  
  tabElements.forEach((tabEl, index)=>{
    const mapObj = maps.find(m=>m.tab===tabEl);
    if(mapObj){
      newOrder.push(mapObj);
      // ⚡ actualizar también el campo order inmediatamente
      mapObj.order = index;
      saveMap(mapObj);
    }
  });

  maps = newOrder;
}

// --- IndexedDB ---
const request=indexedDB.open("MapsDB_v1",1);
request.onerror=e=>console.error("DB error",e);
request.onupgradeneeded=e=>{
  db=e.target.result;
  db.createObjectStore("maps",{keyPath:"id"});
};
request.onsuccess=e=>{
  db=e.target.result;
  loadMapsFromDB();
};

// --- Controles ---
document.getElementById("newMapBtn").onclick=()=>createMap();
fileLoader.onchange=e=>{
  if(!activeMap) return;
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      activeMap.background=img;
      activeMap.bgData=ev.target.result;
      draw(activeMap);
      saveMap(activeMap);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  fileLoader.value="";
};

document.getElementById("exportBtn").onclick=()=>{
  const tx=db.transaction("maps","readonly");
  const store=tx.objectStore("maps");
  const allData=[];
  store.openCursor().onsuccess=e=>{
    const cursor=e.target.result;
    if(cursor){
      allData.push(cursor.value);
      cursor.continue();
    }else{
      const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download = document.title.replace(/\s+/g, "_") + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }
  };
};

document.getElementById("importLoader").onchange=e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const imported=JSON.parse(ev.target.result);
    imported.forEach(data=>createMap(data));
  };
  reader.readAsText(file);
  e.target.value="";
};

// --- Crear mapa ---
function createMap(savedData=null, fromDB=false){
  let id, tabName;
  if(savedData && savedData.id){ 
    id = savedData.id;
    tabName = savedData.tabName || "Mapa "+(++mapCounter);
  } else {
    id = "map"+Date.now();
    tabName = "Mapa "+(++mapCounter);
  }

  const canvas=document.createElement("canvas");
  canvas.width=1920; canvas.height=1080;
  canvas.style.display="none";
  container.appendChild(canvas);
  const ctx=canvas.getContext("2d");

  const mapObj={
    id,
    tabName,
    canvas,
    ctx,
    zoom:savedData?.zoom||1,
    offsetX:savedData?.offsetX||0,
    offsetY:savedData?.offsetY||0,
    dragging:false,
    dragStartX:0,
    dragStartY:0,
    background:null,
    bgData:savedData?.bgData||null,
    notes:savedData?.notes||""
  };

  if(mapObj.bgData){
    const img=new Image();
    img.onload=()=>{ mapObj.background=img; draw(mapObj); };
    img.src=mapObj.bgData;
  }

  maps.push(mapObj);
  addTab(mapObj);
  switchMap(mapObj);
  setupCanvasEvents(mapObj);

  draw(mapObj);

  // 🚫 solo guardamos si es nuevo, no cuando viene del DB
  if(!fromDB) saveMap(mapObj);
}


function addTab(mapObj){
  const tab=document.createElement("div");
  tab.className="tab";
  tab.draggable = true;
  
  const nameSpan=document.createElement("span");
  nameSpan.textContent=mapObj.tabName;
  nameSpan.style.marginRight="5px";
  nameSpan.onclick=()=>switchMap(mapObj);

  const renameBtn=document.createElement("button");
  renameBtn.textContent="✏️";
  renameBtn.style.marginLeft="5px";
  renameBtn.onclick=(e)=>{
    e.stopPropagation(); // no cambiar de mapa al hacer clic
    renameMap(mapObj);
  };

  const deleteBtn=document.createElement("button");
  deleteBtn.textContent="❌";
  deleteBtn.style.marginLeft="5px";
  deleteBtn.onclick=(e)=>{
    e.stopPropagation();
    deleteMap(mapObj);
  };

  // Eventos de drag
tab.addEventListener("dragstart", e=>{
  e.dataTransfer.setData("text/plain", mapObj.id);
  tab.classList.add("dragging");
});

tab.addEventListener("dragend", ()=>{
  tab.classList.remove("dragging");
});

  tab.appendChild(nameSpan);
  tab.appendChild(renameBtn);
  tab.appendChild(deleteBtn);

  mapObj.tab=tab;
  mapObj.nameSpan=nameSpan;
  tabsDiv.appendChild(tab);
}

function renameMap(mapObj){
  const newName=prompt("Nuevo nombre del mapa:", mapObj.tabName);
  if(newName && newName.trim()!==""){
    mapObj.tabName=newName.trim();
    mapObj.nameSpan.textContent=mapObj.tabName;
    saveMap(mapObj);
  }
}

function deleteMap(mapObj){
  if(!confirm(`¿Seguro que quieres borrar "${mapObj.tabName}"?`)) return;

  // quitar de la lista
  maps = maps.filter(m=>m.id!==mapObj.id);

  // quitar de la interfaz
  mapObj.canvas.remove();
  mapObj.tab.remove();

  // quitar de IndexedDB
  const tx=db.transaction("maps","readwrite");
  tx.objectStore("maps").delete(mapObj.id);

  // si era el activo, activar otro (si existe)
  if(activeMap===mapObj){
    if(maps.length>0){
      switchMap(maps[0]);
    }else{
      activeMap=null;
      notesArea.value="";
    }
  }
}

function switchMap(mapObj){
  maps.forEach(m=>{ m.canvas.style.display="none"; m.tab.classList.remove("active"); });
  mapObj.canvas.style.display="block";
  mapObj.tab.classList.add("active");
  activeMap=mapObj;
  notesArea.value=activeMap.notes;
}

notesArea.oninput=()=>{
  if(activeMap){ activeMap.notes=notesArea.value; saveMap(activeMap); }
}

function setupCanvasEvents(mapObj){
  const c=mapObj.canvas;
  c.addEventListener("wheel", e=>{
    e.preventDefault();
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX - rect.left - mapObj.offsetX)/mapObj.zoom;
    const my=(e.clientY - rect.top - mapObj.offsetY)/mapObj.zoom;
    const factor=e.deltaY<0?1.1:0.9;
    const newZoom=mapObj.zoom*factor;
    mapObj.offsetX-=mx*(newZoom-mapObj.zoom);
    mapObj.offsetY-=my*(newZoom-mapObj.zoom);
    mapObj.zoom=newZoom;
    draw(mapObj);
    saveMap(mapObj);
  });

  c.addEventListener("mousedown", e=>{
    mapObj.dragging=true;
    mapObj.dragStartX=e.clientX-mapObj.offsetX;
    mapObj.dragStartY=e.clientY-mapObj.offsetY;
  });
  c.addEventListener("mousemove", e=>{
    if(mapObj.dragging){
      mapObj.offsetX=e.clientX-mapObj.dragStartX;
      mapObj.offsetY=e.clientY-mapObj.dragStartY;
      draw(mapObj);
      saveMap(mapObj);
    }
  });
  c.addEventListener("mouseup", ()=>mapObj.dragging=false);
  c.addEventListener("mouseleave", ()=>mapObj.dragging=false);
  c.addEventListener("dblclick", ()=>{
    mapObj.zoom=1; mapObj.offsetX=0; mapObj.offsetY=0;
    draw(mapObj);
    saveMap(mapObj);
  });
}

function draw(mapObj){
  const ctx=mapObj.ctx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,1920,1080);
  ctx.setTransform(mapObj.zoom,0,0,mapObj.zoom,mapObj.offsetX,mapObj.offsetY);
  if(mapObj.background) ctx.drawImage(mapObj.background,0,0);
  else{
    ctx.fillStyle="#555";
    ctx.fillRect(0,0,1920,1080);
    ctx.fillStyle="#fff";
    ctx.fillText("Mapa vacío",900,540);
  }
}

function saveMap(mapObj){
  const tx=db.transaction("maps","readwrite");
  const store=tx.objectStore("maps");
  store.put({
    id:mapObj.id,
    tabName: mapObj.tabName,
    zoom:mapObj.zoom,
    offsetX:mapObj.offsetX,
    offsetY:mapObj.offsetY,
    bgData:mapObj.bgData,
    notes:mapObj.notes,
    order: mapObj.order ?? maps.indexOf(mapObj) // 👈
  });
}

function loadMapsFromDB(){
  const tx=db.transaction("maps","readonly");
  const store=tx.objectStore("maps");
  const loaded = [];
  store.openCursor().onsuccess=e=>{
    const cursor=e.target.result;
    if(cursor){
      loaded.push(cursor.value);
      cursor.continue();
    }else{
      // ordenamos por `order` (si no existe, lo ponemos al final)
      loaded.sort((a,b)=>(a.order ?? 9999) - (b.order ?? 9999));
      loaded.forEach(data=>createMap(data, true));
    }
  };
}

</script>
</body>
</html>
