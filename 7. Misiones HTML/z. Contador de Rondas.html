<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>3. Rondas</title>
<style>
  body {
    font-family: "Trebuchet MS", sans-serif;
    background: #f5e0c3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    gap: 20px;
  }

  .contador {
  background: #f7edd5;
  border: 3px solid #8b5a2b;
  border-radius: 0px;
  width: 125px;
  height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: center;   /* Centra verticalmente todo */
  align-items: center;
  text-align: center;
  padding: 0;                /* Quitamos padding para controlar mejor la posición */
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}

h1 {
  margin: 0;
  font-size: 1.2rem;
  padding-top: 10px;         /* Empuja ligeramente el título hacia arriba */
}

.numero {
  font-size: 4rem;
  font-weight: bold;
  margin: 5px 0 0 0;          /* Poco margen arriba para bajar un poco el número */
  padding: 10px;
  border-radius: 8px;
  transition: transform 0.3s ease, color 0.3s ease, background 0.3s ease;
}

  .numero.animar {
    transform: scale(1.3);
    color: #b22222;
  }

  .botones {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  button {
    padding: 8px 14px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    border: 2px solid #8b5a2b;
    background: #f0d9b5;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover {
    background: #e6cfa8;
  }
</style>
</head>
<body>
  <div class="contador">
    <h1>Ronda</h1>
    <div class="numero" id="numero">1</div>
  </div>

  <div class="botones">
    <button onclick="cambiar(-1)">-1</button>
    <button onclick="resetear()">Reset</button>
    <button onclick="cambiar(1)">+1</button>
    <button onclick="guardarRonda()">Guardar</button>
    <button onclick="exportarJSON()">Exportar JSON</button>
    <input type="file" id="importFile" style="display:none" onchange="importarJSON(event)">
    <button onclick="document.getElementById('importFile').click()">Importar JSON</button>

  </div>

<script>
  let numero = 1;
  const numeroDiv = document.getElementById("numero");

  // ---------- IndexedDB ----------
let db;
const dbName = "RondasDB";
const storeName = "rondaStore";

// Abrir/crear base de datos
const request = indexedDB.open(dbName, 1);

request.onerror = (event) => {
  console.error("Error al abrir IndexedDB", event);
};

request.onsuccess = (event) => {
  db = event.target.result;
  cargarRonda(); // cargar al iniciar
};

request.onupgradeneeded = (event) => {
  db = event.target.result;
  if (!db.objectStoreNames.contains(storeName)) {
    db.createObjectStore(storeName, { keyPath: "id" });
  }
};

// Exportar a JSON
function exportarJSON() {
  const data = { numero };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "3. Rondas.json"; // nombre según tu HTML
  a.click();
}

// Importar desde JSON
function importarJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = JSON.parse(e.target.result);
    if (data.numero) {
      numero = data.numero;
      numeroDiv.textContent = numero;
      actualizarColor();
      animar();
      guardarRonda();
    }
  };
  reader.readAsText(file);
}

  // animación al cambiar el número
  function animar() {
    numeroDiv.classList.add("animar");
    setTimeout(() => numeroDiv.classList.remove("animar"), 300);
  }

  // actualizar color de fondo
  function actualizarColor() {
  if (numero < 6) {
    numeroDiv.style.background = "#c5f7c5"; // verde
  } else if (numero < 16) {
    numeroDiv.style.background = "#fff2a8"; // amarillo
  } else if (numero < 26) {
    numeroDiv.style.background = "#ffc78e"; // naranja
  } else if (numero < 36) {
    numeroDiv.style.background = "#f7b5b5"; // rojo
  } else {
    numeroDiv.style.background = "#d4b5f7"; // morado
  }

  // Borde negro para resaltar
  numeroDiv.style.border = "3px solid black";

  // Color del texto
  numeroDiv.style.color = "black";
}

// Guardar ronda en IndexedDB
function guardarRonda() {
  const tx = db.transaction(storeName, "readwrite");
  const store = tx.objectStore(storeName);
  store.put({ id: 1, numero: numero });
}

// Cargar ronda desde IndexedDB
function cargarRonda() {
  const tx = db.transaction(storeName, "readonly");
  const store = tx.objectStore(storeName);
  const getRequest = store.get(1);
  getRequest.onsuccess = () => {
    if (getRequest.result) {
      numero = getRequest.result.numero;
      numeroDiv.textContent = numero;
      actualizarColor();
    }
  };
}


  // sumar/restar rondas
  function cambiar(valor) {
    numero += valor;
    if (numero < 1) numero = 1;
    numeroDiv.textContent = numero;
    guardarRonda();
    actualizarColor();
    animar();
  }

  // resetear a ronda 1
  function resetear() {
    numero = 1;
    numeroDiv.textContent = numero;
    guardarRonda();
    actualizarColor();
    animar();
  }
</script>
</body>
</html>
