<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>1. Barra INI</title>
<style>
  body {
    background-color: #163475; /* fondo marrón oscuro */ /* background-color:  #00ff00; /* verde croma */ /* Magenta (#FF00FF) o un azul eléctrico (#00FFFF).*/ /*#00ff00; /* verde croma */ /*  #34393d;*/
    background-image: url('Textura Pergamino.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    filter: contrast(1.05) sepia(0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    color: #333;
    overflow-x: hidden;
    padding: 20px;
    box-sizing: border-box;
  }

  #grid-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    max-width: 95%;
    position: relative;
    transition: box-shadow .2s ease, outline .2s ease;
    border-radius: 12px;
  }

  /* Marco/realce cuando Modo Condiciones está activo */
  #grid-wrapper.conditions-mode {
    box-shadow: inset 0 0 0 4px #22c55e, 0 0 24px #22c55e;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(50px, 188px));
    grid-auto-rows: 202px;
    gap: 5px;
    justify-content: center;
    max-width: 100%;
  }

  .cell {
    aspect-ratio: 188 / 202;
    background-color: rgba(119,119,119,0.9);
    border: 5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    /* ANTES: overflow: hidden */
    overflow: visible;
    user-select: none;
    transition: transform 0.3s ease, opacity 0.3s ease, border 0.2s;
    cursor: grab;
    position: relative;
    box-shadow: 0 0 15px rgba(231, 39, 5, 0.6);
  }

  .cell:hover {
    transform: scale(1.2);
    z-index: 10;
    animation: pulse 1s infinite;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: transform 0.3s;
  }

  .celda { position: relative; }

  .info-lateral {
    position: absolute;
    right: -35px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 0.85em;
    background: rgba(0,0,0,0.6);
    color: white;
    border-radius: 6px;
    padding: 4px 6px;
    min-width: auto;
    z-index: 30;
  }

  .number {
    position: absolute;
    top: -1px;
    left: -1px;
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(0,0,0,0.6);
    color: white;
    font-weight: bold;
    font-size: 17px;
    border-radius: 10px;
    border: 2px solid gold;
    pointer-events: none;
    transition: transform 0.2s;
  }

  .cell:hover .number { transform: scale(1.3); }

  @keyframes pulse { 0% { box-shadow: 0 0 8px rgb(210, 231, 14); } 50% { box-shadow: 0 0 20px rgb(127, 129, 16); } 100% { box-shadow: 0 0 8px rgb(188, 207, 15); } }
  .cell.current { border: 6px solid rgb(189, 21, 21); }
  .cell.current:not(.removed) { animation: pulse 1s infinite; }

  #buttons-overlay {
    position: absolute;
    top: 1000px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 20;
    pointer-events: auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  #add-cell {
    position: fixed;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 188px;
    height: 202px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(85,85,85,0.8);
    border: 2px dashed #aaa;
    font-size: 48px;
    cursor: grab;
    user-select: none;
    z-index: 99999;
    transition: transform 0.2s;
  }

  #add-cell:active { cursor: grabbing; }
  #add-cell:hover { transform: scale(1.2); }

  button { margin: 5px; padding: 5px 10px; font-size: 16px; cursor: pointer; }

  #toggle-conditions.active {
    background-color: #22c55e;
    color: white;
    border: 2px solid #16a34a;
  }

  @keyframes cellIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes cellOut { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.5); } }

  @keyframes pulseRonda { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .ronda-pulse { animation: pulseRonda 0.3s ease; }

  .cell.added { animation: cellIn 0.3s ease forwards; }
  .cell.removed { animation: cellOut 0.3s ease forwards; }

  /* Menú de condiciones */
  #conditions-menu {
    display: none;
    position: absolute;
    background: rgba(0,0,0,0.92);
    color: white;
    border: 2px solid gold;
    padding: 10px;
    z-index: 50;
    max-height: auto;
    overflow-y: auto;
    min-width: 220px;
    border-radius: 8px;
    column-count: 4;
    column-gap: 10px;
  }

  #conditions-menu h4 { margin: 0 0 8px 0; }

  /* Posicionar condiciones */
  .conditions {
    position: absolute;
    top: 3px;
    right: 0px;
    background: rgba(0,0,0,0.0);
    color: white;
    font-size: 12px;
    padding: 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    max-height: 90%;
    overflow-y: auto;
  }

  /* Cada condición */
  .conditions span {
    margin: 1px 0;
    display: inline-block;
    padding: 2px 2px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
  }

  .conditions span b { color: #ef4444; margin-left: 4px; }

  @keyframes removeMove { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
  @keyframes addMove { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }

  /* ---------------- Ronda flotante ---------------- */
  .ronda-floating {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
    cursor: grab;
    user-select: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    min-width: 90px;
  }
  .ronda-floating .label { font-size: 12px; opacity: 0.9; }
  .ronda-floating .num { font-size: 22px; line-height: 1; margin-top: 4px; }
  .ronda-floating:active { cursor: grabbing; }
</style>
</head>
<body>

<!-- Ronda flotante (fuera del overlay para evitar solapes) -->
<div id="ronda-display" class="ronda-floating" title="Arrastra para mover">
  <div class="label">Ronda</div>
  <div id="ronda-num" class="num">1</div>
</div>

<div id="grid-wrapper">
  <div id="grid"></div>
  <div id="buttons-overlay">
    <button onclick="prevTurn()">Turno Anterior</button>
    <button onclick="nextTurn()">Siguiente Turno</button>
    <button onclick="saveGrid()">Guardar Estado</button>
    <button id="toggle-conditions">Modo Condiciones</button>
    <button onclick="clearGrid()">Vaciar Barra</button>

    <button id="export-json">Exportar JSON</button>
    <input type="file" id="import-json" style="display:none;" accept=".json">
    <button onclick="document.getElementById('import-json').click()">Importar JSON</button>
  </div>
</div>

<div id="add-cell">+</div>

<div id="conditions-menu">

</div>

<script>
/* ==================== Estado & Referencias ==================== */
const grid = document.getElementById("grid");
const gridWrapper = document.getElementById("grid-wrapper");
const addCell = document.getElementById("add-cell");
const buttonsOverlay = document.getElementById("buttons-overlay");
const conditionsMenu = document.getElementById("conditions-menu");
const conditionsListDiv = document.getElementById("conditions-list");
const closeConditionsBtn = document.getElementById("close-conditions");
const toggleConditionsBtn = document.getElementById("toggle-conditions");
const rondaDisplay = document.getElementById("ronda-display");
const rondaNumDiv = document.getElementById("ronda-num");

const specialConditions = [
  {name: "PV", key: "pv", min: 0, max: 999},
  {name: "PD", key: "dano", min: 0, max: 999}
];

/* ==================== IndexedDB (BarraINI_DB) ==================== */
let db;
const DB_NAME = "BarraINI_DB";
const DB_VERSION = 1;
const STORE_NAME = "gridStore";

function openDB(callback) {
  const request = indexedDB.open(DB_NAME, DB_VERSION);
  request.onerror = () => console.error("Error abriendo IndexedDB");
  request.onupgradeneeded = e => {
    db = e.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
      db.createObjectStore(STORE_NAME); // sin keyPath, usaremos put(value, key)
    }
  };
  request.onsuccess = e => {
    db = e.target.result;
    if (callback) callback();
  };
}

function saveToDB(key, value, callback) {
  if (!db) { if (callback) callback(); return; }
  const tx = db.transaction(STORE_NAME, "readwrite");
  const store = tx.objectStore(STORE_NAME);
  store.put(value, key);
  tx.oncomplete = () => { if (callback) callback(); };
  tx.onerror = () => console.error("Error guardando en IndexedDB");
}

function loadFromDB(key, callback) {
  if (!db) { callback(null); return; }
  const tx = db.transaction(STORE_NAME, "readonly");
  const store = tx.objectStore(STORE_NAME);
  const request = store.get(key);
  request.onsuccess = () => callback(request.result);
  request.onerror = () => callback(null);
}

/* ==================== Ronda: estado y UI ==================== */
let currentRonda = 1;
let rondaPos = null; // {left:number, top:number}

function actualizarRondaUI(){
  rondaNumDiv.textContent = currentRonda;
}

function saveRondaMeta(callback){
  loadFromDB("gridData", saved => {
    let exportData = saved || {};
    exportData.currentRonda = currentRonda;
    exportData.rondaPos = rondaPos;
    saveToDB("gridData", exportData, callback);
  });
}

/* Hacer draggable la ronda y editable el número */
(function makeRondaDraggable(){
  let dragging = false, offsetX = 0, offsetY = 0;
  rondaDisplay.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dragging = true;
    const rect = rondaDisplay.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    try { rondaDisplay.setPointerCapture(e.pointerId); } catch {}
    rondaDisplay.style.cursor = "grabbing";
  });

  rondaNumDiv.addEventListener("click", (e) => {
    e.stopPropagation();
    const span = document.createElement("span");
    span.textContent = currentRonda;
    span.contentEditable = true;
    span.style.fontWeight = "bold";
    span.style.minWidth = "24px";
    span.style.display = "inline-block";
    span.style.cursor = "text";
    span.style.textAlign = "center";
    rondaNumDiv.textContent = "";
    rondaNumDiv.appendChild(span);
    span.focus();

    function finishEdit() {
      let val = parseInt(span.textContent);
      if (isNaN(val) || val < 1) val = 1;
      currentRonda = val;
      actualizarRondaUI();
      animateRonda();
      saveGrid();
      span.removeEventListener("blur", finishEdit);
      span.removeEventListener("keydown", handleKey);
    }
    function handleKey(evt) { if (evt.key === "Enter") { evt.preventDefault(); finishEdit(); } }
    span.addEventListener("blur", finishEdit);
    span.addEventListener("keydown", handleKey);
  });

  // Drag
  document.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    let left = e.clientX - offsetX;
    let top = e.clientY - offsetY;
    const maxLeft = window.innerWidth - rondaDisplay.offsetWidth;
    const maxTop = window.innerHeight - rondaDisplay.offsetHeight;
    left = Math.max(0, Math.min(left, maxLeft));
    top = Math.max(0, Math.min(top, maxTop));
    rondaDisplay.style.left = left + "px";
    rondaDisplay.style.top = top + "px";
    rondaDisplay.style.right = "auto";
    rondaPos = { left, top };
  });
  document.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    rondaDisplay.style.cursor = "grab";
    saveRondaMeta();
    try { rondaDisplay.releasePointerCapture(e.pointerId); } catch {}
  });
})();

// Doble clic reset
rondaDisplay.addEventListener("dblclick", () => {
  currentRonda = 1;
  actualizarRondaUI();
  animateRonda();
  saveGrid();
});

/* ==================== Condiciones ==================== */
const conditions = [
  {name:"Envenenado", icon:"☠️", defaultTurns:1, desc:"Envenenado: 1D4 daño; Desventaja FUE y CON"},
  {name:"Quemado", icon:"🔥", defaultTurns:1, desc:"Quemado: 1D6 daño al inicio del turno; no puede ocultarse"},
  {name:"Congelado", icon:"❄️", defaultTurns:1, desc:"Congelado: Velocidad 0; desventaja en tiradas de DES"},
  {name:"Ralentizado", icon:"🐌", defaultTurns:1, desc:"Ralentizado: Mitad de movimiento; -2 a iniciativa"},
  {name:"Acelerado", icon:"💨", defaultTurns:1, desc:"Acelerado: Doble movimiento; ventaja en iniciativa"},
  {name:"Ventaja", icon:"⭐", defaultTurns:1, desc:"Ventaja: Tira dos dados, escoge el mejor"},
  {name:"Desventaja", icon:"❗", defaultTurns:1, desc:"Desventaja: Tira dos dados, escoge el peor"},
  {name:"Cegado", icon:"👁️‍🗨️", defaultTurns:1, desc:"Cegado: No puede ver; ataques contra él tienen ventaja"},
  {name:"Sordo", icon:"🙉", defaultTurns:1, desc:"Sordo: No puede oír; -2 a percepción auditiva"},
  {name:"Silenciado", icon:"🤐", defaultTurns:1, desc:"Silenciado: No puede lanzar conjuros con componente verbal"},
  {name:"Aturdido", icon:"💫", defaultTurns:1, desc:"Aturdido: Pierde su turno; no puede reaccionar"},
  {name:"Confuso", icon:"🌀", defaultTurns:1, desc:"Confuso: 50% actúa normalmente; 50% actúa al azar"},
  {name:"Encantado", icon:"💖", defaultTurns:1, desc:"Encantado: No puede dañar al encantador"},
  {name:"Controlado", icon:"🎮", defaultTurns:1, desc:"Controlado: El enemigo decide sus acciones"},
  {name:"Inmóvil", icon:"🪨", defaultTurns:1, desc:"Inmóvil: No puede moverse ni usar acciones de movimiento"},
  {name:"Inconsciente", icon:"🛏️", defaultTurns:1, desc:"Inconsciente: Caído; ataques CC ventaja y críticos si impactan"},
  {name:"Oculto", icon:"👤", defaultTurns:1, desc:"Oculto: No puede ser objetivo directo si no es detectado"},
  {name:"Iluminado", icon:"💡", defaultTurns:1, desc:"Iluminado: Pierde beneficio de ocultamiento o sigilo"},
  {name:"Protegido", icon:"🛡️", defaultTurns:1, desc:"Protegido: +2 CA o resistencia al daño"},
  {name:"Maldito", icon:"🕷️", defaultTurns:1, desc:"Maldito: No puede recuperar PV; desventaja en TS"},
  {name:"Herido Grave", icon:"🩸", defaultTurns:1, desc:"Herido Grave: PV ≤50%; -1 a todas las tiradas"},
  {name:"Regenerando", icon:"🌱", defaultTurns:1, desc:"Regenerando: Recupera 1D4 PV al inicio del turno"},
  {name:"Derribado", icon:"🍌", defaultTurns:1, desc:"Derribado: En suelo; ventajas CC, -CD; 1/2 movimiento para levantarse"}
];

function buildConditionsMenu() {
  conditionsListDiv.innerHTML = "";
  conditions.forEach(cond => {
    const btn = document.createElement("button");
    btn.innerHTML = `${cond.icon} ${cond.name}`;
    btn.style.display = "block";
    btn.style.margin = "3px 0";
    btn.title = cond.desc;
    btn.onclick = () => addConditionToCell(activeCell, cond);
    conditionsListDiv.appendChild(btn);
  });
}
buildConditionsMenu();

/* ==================== UI: Modo Condiciones ==================== */
let currentIndex = -1;
let selectedCells = new Set();
let conditionsMode = false;
let activeCell = null;

/*function setConditionsMode(on){
  conditionsMode = on;
  toggleConditionsBtn.classList.toggle("active", on);
  gridWrapper.classList.toggle("conditions-mode", on);
  [...grid.children].forEach(cell => {
    const condDiv = cell.querySelector(".conditions");
    if(!condDiv) return;
    [...condDiv.querySelectorAll(".special-btn")].forEach(btn=>{
      btn.style.display = on ? "inline-block" : "none";
    });
  });
}
*/

function setConditionsMode(on){
  conditionsMode = on;
  toggleConditionsBtn.classList.toggle("active", on);
  gridWrapper.classList.toggle("conditions-mode", on);

  [...grid.children].forEach(cell => {
    const condDiv = cell.querySelector(".conditions");
    if(!condDiv) return;

    const specialBtns = [...condDiv.querySelectorAll(".special-btn")];

    // mostrar/ocultar botones
    specialBtns.forEach(btn=>{
      btn.style.display = on ? "inline-block" : "none";
      if(!on) btn.classList.remove("active"); // <- esto resetea el estado
    });

    // cerrar panel abierto si hay
    if(!on){
      const panel = condDiv.querySelector(".panel-condiciones");
      if(panel) panel.style.display = "none";
    }
  });

  if(!on) activeCell = null;
}


toggleConditionsBtn.addEventListener("click", () => setConditionsMode(!conditionsMode));

function closeConditionsMenu() {
  conditionsMenu.style.display = "none";
  activeCell = null;
}
closeConditionsBtn.addEventListener("click", closeConditionsMenu);

document.addEventListener("click", (e) => {
  if (conditionsMenu.style.display === "block") {
    const withinMenu = conditionsMenu.contains(e.target);
    const openedFromCell = activeCell && activeCell.contains && activeCell.contains(e.target);
    const clickedToggle = e.target === toggleConditionsBtn;
    if (!withinMenu && !openedFromCell && !clickedToggle) closeConditionsMenu();
  }
});

function positionConditionsMenuForCell(cell) {
  const rect = cell.getBoundingClientRect();
  conditionsMenu.style.display = "block"; // para medir
  const menuW = conditionsMenu.offsetWidth;
  const menuH = conditionsMenu.offsetHeight;

  let left = rect.left + window.scrollX;
  let top  = rect.bottom + window.scrollY + 6;

  if (left + menuW > window.scrollX + window.innerWidth) left = window.scrollX + window.innerWidth - menuW - 10;
  if (top + menuH > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - menuH - 6;
  if (left < window.scrollX + 6) left = window.scrollX + 6;
  if (top < window.scrollY + 6) top = window.scrollY + 6;

  conditionsMenu.style.left = left + "px";
  conditionsMenu.style.top = top + "px";
}

function ensureConditionsDiv(cell) {
  let div = cell.querySelector('.info-lateral');
  if (!div) {
    div = document.createElement('div');
    div.className = 'info-lateral';
    cell.appendChild(div);
  }
  return div;
}

function renderCellConditions(cell) {
  // asegurar datasets
  if (!cell.dataset.pv) cell.dataset.pv = String(cell.pv ?? 10);
  if (!cell.dataset.dano) cell.dataset.dano = String(cell.dano ?? 0);
  if (!cell.dataset.conditions) cell.dataset.conditions = JSON.stringify(cell.conditions || []);

  const pv = Number(cell.dataset.pv) || 10;
  const dano = Number(cell.dataset.dano) || 0;
  const conditionsArr = cell.dataset.conditions ? JSON.parse(cell.dataset.conditions) : [];

  cell.conditions = conditionsArr;

  const condDiv = ensureConditionsDiv(cell);
  condDiv.innerHTML = "";

  // especiales PV y Daño (❤️ / 💥)
  specialConditions.forEach(sc => {
    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.alignItems = "center";
    wrap.style.justifyContent = "space-between";
    wrap.style.gap = "6px";

    const label = document.createElement("span");
    label.textContent = sc.key === "pv" ? "❤️" : "💥";

    const rightGroup = document.createElement("div");
    rightGroup.style.display = "flex";
    rightGroup.style.alignItems = "center";
    rightGroup.style.gap = "4px";

    const key = sc.key;
    const valueSpan = document.createElement("span");
    valueSpan.textContent = sc.key === "pv" ? pv : dano;
    valueSpan.contentEditable = true;
    valueSpan.style.fontWeight = "bold";
    valueSpan.style.minWidth = "28px";
    valueSpan.style.display = "inline-block";
    valueSpan.style.cursor = "text";

    valueSpan.addEventListener("blur", () => {
      let val = parseInt(valueSpan.textContent);
      if (isNaN(val)) val = sc.min;
      val = Math.min(sc.max, Math.max(sc.min, val));
      cell.dataset[key] = String(val);
      valueSpan.textContent = String(val);
      saveGrid();
    });
    valueSpan.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); valueSpan.blur(); } });

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.className = "special-btn";
    plus.style.fontSize = "12px";
    plus.style.display = conditionsMode ? "inline-block" : "none";
    plus.onclick = e => {
      e.stopPropagation();
      const cur = Number(cell.dataset[key]) || 0;
      const next = Math.min(sc.max, cur + 1);
      cell.dataset[key] = String(next);
      valueSpan.textContent = String(next);
      saveGrid();
    };

    const minus = document.createElement("button");
    minus.textContent = "-";
    minus.className = "special-btn";
    minus.style.fontSize = "12px";
    minus.style.display = conditionsMode ? "inline-block" : "none";
    minus.onclick = e => {
      e.stopPropagation();
      const cur = Number(cell.dataset[key]) || 0;
      const next = Math.max(sc.min, cur - 1);
      cell.dataset[key] = String(next);
      valueSpan.textContent = String(next);
      saveGrid();
    };

    rightGroup.appendChild(valueSpan);
    rightGroup.appendChild(plus);
    rightGroup.appendChild(minus);

    wrap.appendChild(label);
    wrap.appendChild(rightGroup);
    condDiv.appendChild(wrap);
  });

  // condiciones normales
  cell.conditions.forEach((c, index) => {
    const row = document.createElement("div");
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.justifyContent = "space-between";
    row.style.gap = "6px";

    const left = document.createElement("div");
    left.textContent = c.icon; // solo el emoji

    const turnsSpan = document.createElement("span");
    turnsSpan.textContent = String(c.turns ?? 1);
    turnsSpan.contentEditable = true;
    turnsSpan.style.fontWeight = "bold";
    turnsSpan.style.minWidth = "20px";
    turnsSpan.style.display = "inline-block";
    turnsSpan.style.cursor = "text";

    turnsSpan.addEventListener("blur", () => {
      let val = parseInt(turnsSpan.textContent);
      if (isNaN(val) || val < 0) val = 0;
      c.turns = val;
      if (c.turns === 0) cell.conditions.splice(index, 1);
      cell.dataset.conditions = JSON.stringify(cell.conditions);
      renderCellConditions(cell);
      saveGrid();
    });
    turnsSpan.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); turnsSpan.blur(); } });

    row.appendChild(left);
    row.appendChild(turnsSpan);
    row.title = c.desc;
    condDiv.appendChild(row);
  });
}

function animateGridChange(callback) {
  const cells = [...grid.children];
  const firstRects = cells.map(c => c.getBoundingClientRect());
  callback();
  const lastRects = cells.map(c => c.getBoundingClientRect());
  cells.forEach((cell, i) => {
    const dx = firstRects[i].left - lastRects[i].left;
    const dy = firstRects[i].top - lastRects[i].top;
    if (dx || dy) {
      cell.style.transition = 'none';
      cell.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        cell.style.transition = 'transform 0.4s ease';
        cell.style.transform = '';
      });
    }
  });
}

function animateCellMove(fromIndex, toIndex) {
  const cells = [...grid.children];
  const fromCell = cells[fromIndex];
  const toCell = cells[toIndex];
  const fromRect = fromCell.getBoundingClientRect();
  const toRect = toCell.getBoundingClientRect();
  const deltaX = toRect.left - fromRect.left;
  const deltaY = toRect.top - fromRect.top;
  fromCell.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
  fromCell.style.transition = "transform 0.3s ease";
  setTimeout(() => {
    fromCell.style.transform = "";
    fromCell.style.transition = "";
    insertCellAt(fromIndex, toIndex);
  }, 300);
}

function addConditionToCell(cell, cond) {
  if (!cell) return;
  let turns = parseInt(prompt(`Añadir condición "${cond.name}". Indica duración en turnos:`, cond.defaultTurns));
  if (isNaN(turns) || turns < 1) turns = cond.defaultTurns;
  cell.conditions = cell.conditions || [];
  cell.conditions.push({...cond, turns});
  cell.dataset.conditions = JSON.stringify(cell.conditions);
  renderCellConditions(cell);
  saveGrid();
}

/* ==================== Utilidades de Grid ==================== */
function ensureCells(count) {
  while (grid.children.length < count) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("draggable", true);
    grid.appendChild(cell);
  }
}

function centerGrid() { grid.style.justifyContent = 'center'; }

grid.addEventListener("click", e => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  activeCell = cell;
  if (conditionsMode) positionConditionsMenuForCell(cell);
});

/* ==================== Números & Selección ==================== */
function updateNumbers() {
  [...grid.children].forEach((cell, i) => {
    let num = cell.querySelector('.number');
    if (!num) { num = document.createElement('div'); num.className = 'number'; cell.appendChild(num); }
    num.textContent = i + 1;
  });
}

function updateHighlight() {
  [...grid.children].forEach((cell, i) => {
    cell.classList.toggle("current", i === currentIndex && cell.querySelector("img"));
  });
}

/* ==================== Guardado / Carga ==================== */
function buildExportData() {
  const gridData = [...grid.children].map(c => ({
    img: c.querySelector("img")?.src || null,
    conditions: c.dataset.conditions ? JSON.parse(c.dataset.conditions) : [],
    pv: Number(c.dataset.pv ?? 10),
    dano: Number(c.dataset.dano ?? 0)
  }));
  return { currentIndex, currentRonda, rondaPos, grid: gridData };
}

function saveGrid() {
  const exportData = buildExportData();
  saveToDB("gridData", exportData, () => { saveRondaMeta(); });
}

/* ==================== Autoguardado en LocalStorage ==================== */
function saveToLocalStorage() {
  loadFromDB("gridData", (data) => {
    if (!data) return;
    localStorage.setItem("barraINI_estado", JSON.stringify(data));
  });
}

const originalSaveGrid = saveGrid;
saveGrid = function() { originalSaveGrid(); saveToLocalStorage(); };

function loadFromLocalStorage() {
  const dataStr = localStorage.getItem("barraINI_estado");
  if (!dataStr) return;
  try {
    const data = JSON.parse(dataStr);
    saveToDB("gridData", data, () => { loadGrid(); });
  } catch(err) { console.error("Error cargando desde LocalStorage", err); }
}

window.addEventListener("load", () => {
  if (localStorage.getItem("barraINI_estado")) loadFromLocalStorage();
  else loadGrid();
});

function loadGrid() {
  loadFromDB("gridData", saved => {
    if (!saved || !saved.grid) return;
    [...grid.children].forEach(c => c.remove());
    saved.grid.forEach((data, i) => {
      ensureCells(i + 1);
      const cell = grid.children[i];
      cell.innerHTML = "";
      if (data.img) cell.innerHTML = `<img src="${data.img}">`;
      cell.conditions = data.conditions || [];
      cell.dataset.conditions = JSON.stringify(cell.conditions);
      cell.dataset.pv = String(data.pv ?? 10);
      cell.dataset.dano = String(data.dano ?? 0);
      renderCellConditions(cell);
    });
    addCellEvents();
    currentIndex = saved.currentIndex ?? -1;
    updateNumbers();
    updateHighlight();
    centerGrid();
    // Ronda
    currentRonda = saved.currentRonda || 1;
    rondaPos = saved.rondaPos || null;
    if (rondaPos) {
      rondaDisplay.style.left = rondaPos.left + "px";
      rondaDisplay.style.top = rondaPos.top + "px";
      rondaDisplay.style.right = "auto";
    }
    actualizarRondaUI();
  });
}

// ================= Exportar / Importar JSON =================
const exportBtn = document.getElementById("export-json");
const importInput = document.getElementById("import-json");

exportBtn.addEventListener("click", () => {
  loadFromDB("gridData", (data) => {
    if (!data) return alert("Nada que exportar");
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${document.title}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
});

importInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.grid || !Array.isArray(data.grid)) throw "Formato inválido";
      saveToDB("gridData", data, () => { loadGrid(); alert("Importación completada"); });
    } catch(err) { alert("Error al leer JSON"); }
  };
  reader.readAsText(file);
});

function insertImageAt(index, src) {
  ensureCells(index + 1);
  const cell = grid.children[index];
  cell.innerHTML = `<img src="${src}">`;
  cell.conditions = [];
  cell.dataset.pv = "10";
  cell.dataset.dano = "0";
  cell.dataset.conditions = JSON.stringify([]);
  renderCellConditions(cell);
  cell.classList.add('added');
  setTimeout(() => cell.classList.remove('added'), 300);
  updateNumbers();
  centerGrid();
  saveGrid();
}

function insertCellAt(fromIndex, toIndex) {
  animateGridChange(() => {
    const cells = [...grid.children];

    // 1) Guardamos datos de TODAS las celdas
    const data = cells.map(c => ({
      img: c.querySelector("img")?.outerHTML || "",
      conditions: JSON.parse(JSON.stringify(c.conditions || [])),
      pv: Number(c.dataset.pv ?? 10),
      dano: Number(c.dataset.dano ?? 0)
    }));

    // 2) Extraemos la celda a mover
    const moving = data.splice(fromIndex, 1)[0];
    // 3) Insertamos en nueva posición
    data.splice(toIndex, 0, moving);

    // 4) Reescribimos DOM con los datos
    cells.forEach((c, i) => {
      c.innerHTML = data[i].img;
      c.conditions = JSON.parse(JSON.stringify(data[i].conditions || []));
      c.dataset.conditions = JSON.stringify(c.conditions);
      c.dataset.pv = String(data[i].pv ?? 10);
      c.dataset.dano = String(data[i].dano ?? 0);
      renderCellConditions(c);
    });

    // 5) Ajustar currentIndex
    if (currentIndex === fromIndex) currentIndex = toIndex;
    else if (fromIndex < currentIndex && currentIndex <= toIndex) currentIndex--;
    else if (toIndex <= currentIndex && currentIndex < fromIndex) currentIndex++;

    // 6) Ajustar selectedCells
    if (selectedCells.size) {
      const newSet = new Set();
      [...selectedCells].forEach(idx => {
        if (idx === fromIndex) newSet.add(toIndex);
        else if (fromIndex < toIndex && idx > fromIndex && idx <= toIndex) newSet.add(idx - 1);
        else if (fromIndex > toIndex && idx >= toIndex && idx < fromIndex) newSet.add(idx + 1);
        else newSet.add(idx);
      });
      selectedCells = newSet;
    }
  });

  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

/* ==================== Turnos ==================== */
function decrementConditions(cell) {
  if (!cell || !cell.conditions || !cell.conditions.length) return;
  cell.conditions.forEach(c => c.turns = Math.max(0, (c.turns || 0) - 1));
  cell.conditions = cell.conditions.filter(c => c.turns > 0);
  cell.dataset.conditions = JSON.stringify(cell.conditions);
  renderCellConditions(cell);
}

function nextTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;

  const prevIndex = currentIndex;

  if (prevIndex >= 0 && prevIndex < grid.children.length) {
    const prevCell = grid.children[prevIndex];
    if (prevCell && prevCell.querySelector("img")) decrementConditions(prevCell);
  }

  let nextIndex = currentIndex;
  let attempts = 0;
  do {
    nextIndex = (nextIndex + 1) % grid.children.length;
    attempts++;
    if (attempts > grid.children.length) break;
  } while (!grid.children[nextIndex].querySelector("img"));

  if (prevIndex >= 0 && nextIndex <= prevIndex) {
    currentRonda++;
    saveRondaMeta();
    actualizarRondaUI();
  }

  currentIndex = nextIndex;
  updateHighlight();
  saveGrid();
}

function prevTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;

  if (currentIndex >= 0 && currentIndex < grid.children.length) {
    const prevCell = grid.children[currentIndex];
    if (prevCell && prevCell.querySelector("img")) decrementConditions(prevCell);
  }

  let attempts = 0;
  do {
    currentIndex = (currentIndex - 1 + grid.children.length) % grid.children.length;
    attempts++;
    if (attempts > grid.children.length + 1) break;
  } while (!grid.children[currentIndex].querySelector("img"));

  updateHighlight();
  saveGrid();
}

/* ==================== Eliminación ==================== */
function deleteAt(index) {
  const cell = grid.children[index];
  if (!cell.querySelector("img")) return;

  cell.classList.add('removed');

  setTimeout(() => {
    grid.removeChild(cell);

    if (currentIndex === index) currentIndex = -1;
    else if (currentIndex > index) currentIndex--;

    addCellEvents();
    updateNumbers();
    updateHighlight();
    centerGrid();
    saveGrid();
  }, 300);
}

function clearGrid() {
  const cells = [...grid.children];
  cells.forEach(cell => grid.removeChild(cell));
  selectedCells.clear();
  currentIndex = -1;
  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

function animateRonda() {
  rondaNumDiv.classList.add("ronda-pulse");
  setTimeout(() => rondaNumDiv.classList.remove("ronda-pulse"), 300);
}

function addCellEvents() {
  const cells = [...grid.children];
  cells.forEach((cell, i) => {
    cell.setAttribute("draggable", true);
    cell.ondragstart = e => {
      if (!cell.querySelector("img")) e.preventDefault();
      else e.dataTransfer.setData("text/plain", i);
    };
    cell.ondragenter = e => e.preventDefault();
    cell.ondragover = e => e.preventDefault();
    cell.ondrop = e => {
      e.preventDefault();
      const fromIndex = parseInt(e.dataTransfer.getData("text/plain"));
      if (!Number.isNaN(fromIndex) && fromIndex !== i) insertCellAt(fromIndex, i);
    };
    cell.oncontextmenu = e => { e.preventDefault(); deleteAt(i); };
    cell.onclick = e => {
      const hasImg = !!cell.querySelector("img");
      if (!hasImg) return;
      if (conditionsMode) {
        activeCell = cell;
        renderCellConditions(cell);
        positionConditionsMenuForCell(cell);
      }
    };
    renderCellConditions(cell);
  });
}

// Hacer draggable el botón de añadir celdas
(function makeAddCellDraggable(){
  let dragging = false, offsetX = 0, offsetY = 0;
  const storedPos = JSON.parse(localStorage.getItem("addCellPos"));
  if(storedPos){
    addCell.style.left = storedPos.left + "px";
    addCell.style.top = storedPos.top + "px";
    addCell.style.transform = "none";
  }
  addCell.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dragging = true;
    const rect = addCell.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    try { addCell.setPointerCapture(e.pointerId); } catch {}
  });
  document.addEventListener("pointermove", (e) => {
    if(!dragging) return;
    let left = e.clientX - offsetX;
    let top  = e.clientY - offsetY;
    const maxLeft = window.innerWidth - addCell.offsetWidth;
    const maxTop = window.innerHeight - addCell.offsetHeight;
    left = Math.max(0, Math.min(left, maxLeft));
    top = Math.max(0, Math.min(top, maxTop));
    addCell.style.left = left + "px";
    addCell.style.top = top + "px";
    addCell.style.transform = "none";
  });
  document.addEventListener("pointerup", (e) => {
    if(!dragging) return;
    dragging = false;
    localStorage.setItem("addCellPos", JSON.stringify({
      left: parseInt(addCell.style.left),
      top: parseInt(addCell.style.top)
    }));
    try { addCell.releasePointerCapture(e.pointerId); } catch {}
  });
})();

addCell.addEventListener("dragover", e => e.preventDefault());
addCell.addEventListener("drop", e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;

  let startIndex = [...grid.children].findIndex(c => !c.querySelector("img"));
  if (startIndex < 0) startIndex = grid.children.length;

  const loadNext = i => {
    if (i >= files.length) { addCellEvents(); return; }
    const reader = new FileReader();
    reader.onload = () => { insertImageAt(startIndex + i, reader.result); loadNext(i + 1); };
    reader.readAsDataURL(files[i]);
  };
  loadNext(0);
});

openDB(() => { loadGrid(); });
</script>
