<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3. Mapamundi</title>
<style>
:root{
  --bg-screen: #0e1522;
  --parchment: #b89368;
  --parchment-2: #d2b48c;
  --ink: #2a1f0f;
  --shadow: rgba(0,0,0,.4);
}
html,body{
  margin:0; padding:0; height:100%;
  background: var(--bg-screen); color: #eee;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}
.toolbar{
  position: sticky; top:0; z-index:1000;
  background: #0b101b; border-bottom: 1px solid #1e2a3d;
  padding:.5rem; display:flex; gap:.5rem; align-items:center; flex-wrap: wrap;
}
.title-edit{ background:#0f1726; color:#e5e7eb; border:1px solid #22324d; padding:.35rem .5rem; border-radius:.5rem; width: min(420px, 60vw); }
.btn{ cursor:pointer; background: #1a2538; color:#e5e7eb; border:1px solid #2b3d5f; padding:.45rem .7rem; border-radius:.6rem; box-shadow: 0 2px 6px var(--shadow); font-weight:600; user-select:none; }
.hint{opacity:.8; font-size:.9rem;}

.stage-wrap{ display:flex; justify-content:center; padding: 1rem; }
.stage{ width: 1920px; height: 1080px; position: relative; border: 3px solid #2b3d5f; border-radius: 12px; overflow: hidden; background: #101826; box-shadow: 0 8px 20px var(--shadow); }
.map-bg{ width:100%; height:100%; object-fit: cover; display:block; }

.overlay{ position:absolute; inset:0; pointer-events:none; }

.marker{
  position:absolute; width:22px; height:22px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #ffd08a, #e09a3f 60%, #804b00 100%);
  border:1px solid #3a250e; box-shadow: 0 2px 8px var(--shadow);
  transform: translate(-50%, -50%);
  cursor: grab; pointer-events:auto;
}
.marker[data-title]::before{
  content: attr(data-title);
  position:absolute; bottom: 120%; left:50%;
  transform: translateX(-50%);
  background: rgba(16,24,38,.9); color:#f3e7d3;
  padding:.2rem .35rem; border:1px solid #3a2a17; border-radius:.35rem;
  font-size:.75rem; white-space: nowrap; pointer-events:none;
}

.modal-backdrop{
  position:fixed; inset:0; background: rgba(0,0,0,.55);
  display:none; align-items:center; justify-content:center; padding:1rem; z-index:2000;
}
.modal{
  width: 80%; height: 80%; max-width: 80%; max-height: 80%;
  border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 1rem; background: #0f1726; box-shadow: 0 8px 20px var(--shadow);
}
.modal h3{ margin:.2rem 0 .6rem; font-size:1.4rem; text-align:center; }
.modal .row { display: flex; flex: 1; gap: 1rem; }
.modal .row > div:first-child { flex: 0.25; max-width: 25%; }
.modal .row > div:last-child  { flex: 0.75; }
.modal .row > div { display: flex; flex-direction: column; justify-content: center; }
.modal input[type="text"], .modal textarea{
  width:100%; background: #f3e7d3; color:#2a1f0f; border:1px solid #6e4d2d;
  border-radius:.5rem; padding:.5rem .6rem; margin:.3rem 0;
}
.modal .img-frame{
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #f6ebd6; overflow: hidden;
}
.modal .img-frame img{
  width: 80%; height: 80%; object-fit: contain; border-radius: 8px;
  transition: transform .28s ease; will-change: transform;
}
.popup-card{ opacity:0; transform:scale(.96); transition:opacity .35s, transform .35s; pointer-events:none; }
.popup-card.show{ opacity:1; transform:scale(1); pointer-events:auto; }

.actions{ display:flex; justify-content: space-between; gap:.5rem; margin-top:.8rem; }
.modal .btn{ background:#8b5e34; border-color:#6e4d2d; color:#fdf5e6; }
.modal .btn.secondary{ background:#3c2a1a; }
.modal .btn.danger{ background:#5b2b20; }

.hidden { display: none !important; }

.zoom-overlay{
  position: fixed; inset: 0; z-index: 2900; background: rgba(0,0,0,0.55);
}
.zoom-clone{
  position: fixed; object-fit: cover; z-index: 3000;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
  transition: all .32s cubic-bezier(.2,.9,.2,1); cursor: zoom-out;
}

.marker span {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: bold;
  color: #000;
  text-shadow: 0 0 2px #fff, 0 0 4px #fff;
  pointer-events: none; /* 👈 evita que bloquee el arrastre */
}

</style>
</head>
<body>

<header class="toolbar">
  <input id="docTitle" class="title-edit" value="3. Mapamundi" />
  <button class="btn" id="btnToggleMode">Modo: Interactivo</button>
  <span id="modeIndicator">Interactivo</span>

  <button class="btn" id="btnLoadBG">Cargar mapamundi</button>
  <input type="file" id="fileBG" accept="image/*" class="hidden" />

  <button class="btn" id="btnAddMarker">Añadir punto</button>

  <button class="btn" id="btnSave">Guardar</button>
  <button class="btn" id="btnExport">Exportar JSON</button>
  <label class="btn" for="fileImport">Importar JSON</label>
  <input type="file" id="fileImport" accept="application/json" class="hidden" />

  <div class="legend hint">Click en el mapa para añadir. Arrastra para mover. Click para editar. Secundario para borrar.</div>
</header>

<main class="stage-wrap">
  <section class="stage" id="stage">
    <canvas id="mapCanvas" class="map-bg"></canvas>
    <div id="markerLayer" class="overlay"></div>
  </section>
</main>

<!-- ... resto del código idéntico (JS + modal) ... -->

</body>
</html>


<div class="modal-backdrop" id="modalBackdrop">
<div class="modal popup-card" id="modal">
<h3>Editar lugar</h3>
<div class="row">
<div>
<label for="locNum">Número</label>
<input type="number" id="locNum" min="1" />
<label for="locTitle">Título</label>
<input type="text" id="locTitle" placeholder="Nombre del lugar" />
<label for="locDesc">Descripción</label>
<textarea id="locDesc" placeholder="Historia, clima, cultura..."></textarea>
<label for="locNotes">Anotaciones</label>
<textarea id="locNotes" placeholder="Rumores, ganchos, PNJ, misiones..."></textarea>
</div>
<div>
<div class="pill">
<button class="btn" id="btnLoadRegion">Cargar mapa de región</button>
<input type="file" id="fileRegion" accept="image/*" class="hidden" />
</div>
<div class="img-frame" id="regionFrame"><span class="hint">Sin imagen</span></div>
</div>
</div>
<div class="actions">
<button class="btn danger" id="btnDeleteMarker">Borrar punto</button>
<div>
<button class="btn secondary" id="btnCancel">Cerrar</button>
<button class="btn" id="btnApply">Aplicar</button>
</div>
</div>
</div>
</div>

<script>

const $ = (s, p=document) => p.querySelector(s);
const $$ = (s, p=document) => Array.from(p.querySelectorAll(s));

/* ---------- Referencias ---------- */
const locNum = $('#locNum');
const mapCanvas = $('#mapCanvas');
const ctx = mapCanvas.getContext('2d');
const markerLayer = $('#markerLayer');
const stageEl = $('#stage');

mapCanvas.width = 1920;
mapCanvas.height = 1080;

let mapScale = 1, mapOffsetX = 0, mapOffsetY = 0;
let isPanningMap = false, startPanX = 0, startPanY = 0;
let bgImage = null;

let state = {
  title: document.getElementById('docTitle').value.trim(),
  background: '',
  markers: []
};

let autosaveTimer = null;

/* ---------- Guardado ---------- */
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveNow, 600);
}
async function saveNow(){
  state.title = $('#docTitle').value.trim() || 'Mapa Interactivo';
  document.title = state.title;
  state.updatedAt = new Date().toISOString();
  try{
    const db = await openDB();
    db.transaction('maps','readwrite')
      .objectStore('maps')
      .put(structuredClone(state));
  }catch(e){ console.warn(e); }
  try{ localStorage.setItem('mapa:'+state.title, JSON.stringify(state)); }catch(e){}
}

const DB_NAME='MapaInteractivoDB', DB_STORE='maps';
function openDB(){
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(DB_STORE))
        db.createObjectStore(DB_STORE,{ keyPath:'title' });
    };
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
  });
}
async function idbGet(title){
  try{
    const db = await openDB();
    return new Promise((res,rej)=>{
      const rq=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(title);
      rq.onsuccess=()=>res(rq.result||null);
      rq.onerror=()=>rej(rq.error);
    });
  }catch(e){ return null; }
}

/* ---------- Render ---------- */
function render(){
  ctx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
  if(bgImage){
    ctx.save();
    ctx.translate(mapOffsetX,mapOffsetY);
    ctx.scale(mapScale,mapScale);
    ctx.drawImage(bgImage,0,0,mapCanvas.width,mapCanvas.height);
    ctx.restore();
  }
  markerLayer.style.transformOrigin = '0 0';
  markerLayer.style.transform = `translate(${mapOffsetX}px, ${mapOffsetY}px) scale(${mapScale})`;
  renderMarkers();
}

function renderMarkers(){
  $$('.marker', markerLayer).forEach(n=>n.remove());

  for(const m of state.markers){
    const el = document.createElement('div');
    el.className = 'marker';
    el.style.left = (m.x*100) + '%';
    el.style.top  = (m.y*100) + '%';
    el.dataset.id = m.id;
    if(m.title) el.dataset.title = m.title;

    const numSpan = document.createElement('span');
    numSpan.textContent = m.num;
    el.appendChild(numSpan);

    attachMarkerEvents(el);
    markerLayer.appendChild(el);
  }
}

/* ---------- Marcadores ---------- */
function newMarker(px,py){
  const rect = stageEl.getBoundingClientRect();
  const x = (px - rect.left) / rect.width;
  const y = (py - rect.top) / rect.height;
  const id = crypto.randomUUID();
  const marker = { id, x, y, title:'', desc:'', notes:'', regionImg:'', num: state.markers.length + 1 };
  state.markers.push(marker);
  scheduleAutosave();
  render();
  if(editMode) openEditor(id);
}

function deleteMarker(id){
  state.markers = state.markers.filter(m=>m.id!==id);
  state.markers.forEach((m, i)=> m.num = i+1);
  scheduleAutosave();
  render();
  closePopup(modal);
}

function attachMarkerEvents(el){
  let dragging = false;
  const id = el.dataset.id;

  // 👉 Arrastrar solo en edición
  el.addEventListener('mousedown', ev=>{
    if(!editMode) return; // nada de arrastre en interactivo
    if(ev.button !== 0) return;
    dragging = true;
    const rect = stageEl.getBoundingClientRect();

    function onMove(moveEv){
      if(!dragging) return;
      const mk = state.markers.find(mk => mk.id === id);
      if(mk){
        mk.x = Math.min(1, Math.max(0, (moveEv.clientX - rect.left) / rect.width));
        mk.y = Math.min(1, Math.max(0, (moveEv.clientY - rect.top) / rect.height));
        el.style.left = (mk.x*100)+'%';
        el.style.top  = (mk.y*100)+'%';
      }
    }
    function onUp(){
      if(dragging){
        dragging = false;
        scheduleAutosave();
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // 👉 Clic: mini ficha solo en interactivo
  el.addEventListener('click', e=>{
    if(editMode) return; // no abrir nada en edición
    e.stopPropagation();
    const m = state.markers.find(mm=>mm.id===id);
    showMiniInfo(el,m);
  });

  // 👉 Doble clic: abrir editor solo en edición
  el.addEventListener('dblclick', e=>{
    if(!editMode) return;
    e.stopPropagation();
    openEditor(id);
  });

  // 👉 Click derecho (borrar) solo en edición
  el.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(editMode) deleteMarker(id);
  });
}

/* ---------- Mini info ---------- */
let miniInfoEl = null;
function showMiniInfo(el,m){
  removeMiniInfo();
  miniInfoEl = document.createElement('div');
  miniInfoEl.className = 'mini-info';
  Object.assign(miniInfoEl.style,{
    position:'absolute', zIndex:2100, background:'rgba(16,24,38,0.95)', color:'#f3e7d3',
    padding:'8px', border:'1px solid #3a2a17', borderRadius:'6px',
    maxWidth:'320px', fontSize:'.9rem'
  });
  miniInfoEl.innerHTML = `<strong>${m.title||'Sin título'}</strong>
    <div style="margin-top:.3rem; max-height:6rem; overflow:hidden;">${(m.desc||'').substring(0,300)}</div>`;
  const rect = stageEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  let left = elRect.left - rect.left + 24;
  let top  = elRect.top  - rect.top  - 8;
  if(left + 340 > rect.width) left = rect.width - 360;
  if(top < 0) top = elRect.top - rect.top + 28;
  miniInfoEl.style.left = left+'px';
  miniInfoEl.style.top = top+'px';
  stageEl.appendChild(miniInfoEl);

  const onClickOutside = ev=>{
    if(!miniInfoEl.contains(ev.target)) removeMiniInfo();
    document.removeEventListener('click', onClickOutside);
  };
  document.addEventListener('click', onClickOutside);
}
function removeMiniInfo(){
  if(miniInfoEl){ miniInfoEl.remove(); miniInfoEl=null; }
}

/* ---------- Modal ---------- */
const modalBackdrop = $('#modalBackdrop'), modal = $('#modal');
const locTitle = $('#locTitle'), locDesc = $('#locDesc'), locNotes = $('#locNotes');
const regionFrame = $('#regionFrame'), fileRegion = $('#fileRegion');
const btnDeleteMarker = $('#btnDeleteMarker'), btnApply = $('#btnApply'), btnLoadRegion = $('#btnLoadRegion');
let currentId = null;

function setModalMode(editable){
  [locTitle, locDesc, locNotes].forEach(el => el.readOnly = !editable);
  [btnLoadRegion, btnDeleteMarker, btnApply].forEach(btn => btn.style.display = editable ? '' : 'none');
}
function openPopup(popup){
  modalBackdrop.style.display='flex';
  requestAnimationFrame(()=> popup.classList.add('show'));
}
function closePopup(popup){
  popup.classList.remove('show');
  setTimeout(()=>{ if(!modal.classList.contains('show')) modalBackdrop.style.display='none'; },420);
}
modalBackdrop.addEventListener('click', e=>{ if(e.target===modalBackdrop) closePopup(modal); });

/* ---------- Zoom imagen ---------- */
let zoomClone = null, zoomOverlay = null;
function createZoomOverlay(){
  zoomOverlay = document.createElement('div');
  zoomOverlay.className = 'zoom-overlay';
  document.body.appendChild(zoomOverlay);
}
function removeZoomOverlay(){ if(zoomOverlay) zoomOverlay.remove(); zoomOverlay = null; }
function zoomImageFromElem(img){
  if(zoomClone) return unzoomImage();
  const rect = img.getBoundingClientRect();
  createZoomOverlay();
  const clone = img.cloneNode(true);
  clone.className = 'zoom-clone';
  Object.assign(clone.style,{
    left: rect.left+'px', top: rect.top+'px',
    width: rect.width+'px', height: rect.height+'px',
    borderRadius:'8px', objectFit:'contain', maxWidth:'90vw', maxHeight:'90vh'
  });
  document.body.appendChild(clone);

  requestAnimationFrame(()=>{
    const targetW = Math.min(1920, window.innerWidth);
    const targetH = Math.min(1080, window.innerHeight);
    clone.style.left = ((window.innerWidth - targetW)/2) + 'px';
    clone.style.top  = ((window.innerHeight - targetH)/2) + 'px';
    clone.style.width = targetW + 'px';
    clone.style.height = targetH + 'px';
    clone.style.borderRadius = '0px';
  });

  clone.addEventListener('dblclick', unzoomImage);
  zoomOverlay.addEventListener('click', unzoomImage);
  window.addEventListener('keydown', escHandler);
  zoomClone = { node: clone, originalRect: rect };
}
function unzoomImage(){
  if(!zoomClone) return;
  const { node, originalRect } = zoomClone;
  Object.assign(node.style,{
    left: originalRect.left+'px', top: originalRect.top+'px',
    width: originalRect.width+'px', height: originalRect.height+'px',
    borderRadius:'8px'
  });
  node.addEventListener('transitionend', function te(){
    node.removeEventListener('transitionend', te);
    node.remove(); removeZoomOverlay();
    window.removeEventListener('keydown', escHandler);
    zoomClone = null;
  });
}
function escHandler(e){ if(e.key === 'Escape') unzoomImage(); }

/* ---------- Edición región ---------- */
function drawRegion(dataURL){
  regionFrame.innerHTML = dataURL
    ? `<img src="${dataURL}" style="max-width:100%;max-height:100%;border-radius:10px;cursor:zoom-in">`
    : '<span class="hint">Sin imagen</span>';
  const img = regionFrame.querySelector('img');
  if(img){
    img.addEventListener('dblclick', ev=>{
      ev.stopPropagation();
      if(!editMode) zoomImageFromElem(img);
    });
  }
}

/* ---------- Abrir modal ---------- */
function openEditor(id){
  currentId = id;
  const m = state.markers.find(x=>x.id===id);
  if(!m) return;
  setModalMode(true);
  locNum.value = m.num;
  locTitle.value = m.title||'';
  locDesc.value = m.desc||'';
  locNotes.value = m.notes||'';
  drawRegion(m.regionImg);
  openPopup(modal);
}

function openRegionView(id){
  currentId = id;
  const m = state.markers.find(x=>x.id===id);
  if(!m) return;
  setModalMode(false);
  locNum.value = m.num;
  locTitle.value = m.title||'';
  locDesc.value = m.desc||'';
  locNotes.value = m.notes||'';
  drawRegion(m.regionImg);
  openPopup(modal);
}

/* ---------- Listeners modal ---------- */
$('#btnApply').addEventListener('click', ()=>{
  if(!currentId) return closePopup(modal);
  const m = state.markers.find(x=>x.id===currentId);
  if(!m) return closePopup(modal);

  m.num   = parseInt(locNum.value) || m.num;
  m.title = locTitle.value.trim();
  m.desc  = locDesc.value;
  m.notes = locNotes.value;

  scheduleAutosave();
  render();
  closePopup(modal);
});

$('#btnCancel').addEventListener('click', ()=> closePopup(modal));
btnDeleteMarker.addEventListener('click', ()=> { if(currentId) deleteMarker(currentId); });
btnLoadRegion.addEventListener('click', ()=> fileRegion.click());
fileRegion.addEventListener('change', async e=>{
  const file = e.target.files?.[0]; if(!file || !currentId) return;
  const dataURL = await fileToDataURL(file);
  const m = state.markers.find(x=>x.id===currentId);
  if(m){ m.regionImg = dataURL; drawRegion(dataURL); scheduleAutosave(); }
});

/* ---------- Util ---------- */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}

/* ---------- Toolbar ---------- */
$('#btnAddMarker').addEventListener('click', ()=>{
  stageEl.style.cursor = 'crosshair';
  function onClick(ev){
    newMarker(ev.clientX, ev.clientY);
    stageEl.removeEventListener('click', onClick);
    stageEl.style.cursor = '';
  }
  stageEl.addEventListener('click', onClick);
});
$('#btnLoadBG').addEventListener('click', ()=> $('#fileBG').click());
$('#fileBG').addEventListener('change', async e=>{
  const file = e.target.files?.[0]; if(!file) return;
  const dataURL = await fileToDataURL(file);
  state.background = dataURL;
  bgImage = new Image(); bgImage.onload = ()=> render(); bgImage.src = dataURL;
  scheduleAutosave();
});
$('#btnSave').addEventListener('click', saveNow);
$('#btnExport').addEventListener('click', ()=>{
  state.title = $('#docTitle').value.trim() || 'Mapa Interactivo';
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${state.title}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('#fileImport').addEventListener('change', async e=>{
  const file=e.target.files?.[0]; if(!file) return;
  try{
    const obj=JSON.parse(await file.text());
    if(!obj||!obj.markers) throw new Error('JSON inválido');
    state=obj;
    document.title=state.title||'Mapa Interactivo';
    $('#docTitle').value=document.title;
    if(state.background){
      bgImage=new Image(); bgImage.onload=()=>render(); bgImage.src=state.background;
    } else bgImage=null;
    render(); scheduleAutosave();
  }catch(err){ alert('No se pudo importar el JSON.'); console.error(err); }
});

/* ---------- Título / auto-load ---------- */
let titleTimer=null;
$('#docTitle').addEventListener('input', ()=>{
  clearTimeout(titleTimer);
  titleTimer=setTimeout(async ()=>{
    const t=$('#docTitle').value.trim(); if(!t) return;
    const saved = await idbGet(t);
    if(saved) state=saved;
    else { state.title=t; document.title=t; }
    if(state.background){
      bgImage=new Image(); bgImage.onload=()=>render(); bgImage.src=state.background;
    }
    render(); scheduleAutosave();
  },500);
});

/* ---------- Modo edición ---------- */
let editMode = false;
$('#btnToggleMode').addEventListener('click', ()=>{
  editMode = !editMode;
  $('#btnToggleMode').textContent = 'Modo: ' + (editMode ? 'Edición' : 'Interacción');
  $('#modeIndicator').textContent = editMode ? 'Edición' : 'Interacción';
});

/* ---------- Zoom y Pan ---------- */
stageEl.addEventListener('wheel', e=>{
  if(modalBackdrop.style.display === 'flex') return;
  if(!editMode){
    e.preventDefault();
    const factor = 1 + (e.deltaY * -0.0015);
    const prevScale = mapScale;
    const newScale = Math.min(Math.max(1, mapScale * factor), 3);
    const rect = stageEl.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const worldX = (cx - mapOffsetX) / prevScale;
    const worldY = (cy - mapOffsetY) / prevScale;
    mapScale = newScale;
    mapOffsetX = cx - worldX * mapScale;
    mapOffsetY = cy - worldY * mapScale;
    render();
  }
},{passive:false});

stageEl.addEventListener('mousedown', e=>{
  if(e.button !== 0 || editMode) return;
  if(e.target.closest('.marker,.modal,.toolbar')) return;
  if(mapScale > 1){
    isPanningMap=true;
    startPanX = e.clientX - mapOffsetX;
    startPanY = e.clientY - mapOffsetY;
    document.body.style.cursor='grabbing';
  }
});
window.addEventListener('mousemove', e=>{
  if(isPanningMap){
    mapOffsetX = e.clientX - startPanX;
    mapOffsetY = e.clientY - startPanY;
    render();
  }
});
window.addEventListener('mouseup', ()=>{ isPanningMap=false; document.body.style.cursor=''; });

/* ---------- Inicio ---------- */
(async function init(){
  const saved = await idbGet(state.title);
  if(saved) state=saved;
  else {
    const ls=localStorage.getItem('mapa:'+state.title);
    if(ls) state=JSON.parse(ls);
  }
  document.title=state.title||'Mapa Interactivo';
  $('#docTitle').value=document.title;
  if(state.background){
    bgImage=new Image(); bgImage.onload=()=>render(); bgImage.src=state.background;
  }
  render();
})();

</script>
