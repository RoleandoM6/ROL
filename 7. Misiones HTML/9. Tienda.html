<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>9. Tienda</title>
<style>
  body {
    font-family: 'Garamond', 'Georgia', serif;
    background-color:  #3a2a1a; /* fondo marrón oscuro */ /* verde croma */ /* Magenta (#FF00FF) o un azul eléctrico (#00FFFF).*/ /*#00ff00; /* verde croma */ 
    color: #fdf5e6;
    margin: 0;
    padding: 20px;
  }
  h1 { text-align: center; border-bottom:3px solid #7b4f2f; padding-bottom:10px; margin-bottom:20px; }
  
  .botones { text-align:center; margin-bottom:20px; }
  button {
    margin:5px; padding:10px 20px; font-size:16px; cursor:pointer;
    background-color:#f5ecd9; border:2px solid #7b4f2f; border-radius:8px; color:#3b2f2f;
    transition:0.2s;
  }
  button.activo { background-color:#d6bfa6; border-color:#5a3320; }
  button:hover { background-color:#e5dcc8; }

  #tienda-container {
    display:flex; gap:20px; max-width:1800px; margin:0 auto; max-height:1000px;
    padding:20px; overflow-y:auto;
  }
  #editor, #vista {
    flex:1; min-height:200px; max-height:1000px; overflow-y:auto; box-sizing:border-box;
  }
  #vista {
    background-color:#fff8e1; border:3px solid #7b4f2f; border-radius:12px; padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.15); min-width:500px; color:#3b2f2f; font-weight:bold;
    font-size: 16px;
  }

  /* Botones especiales */
  #guardar-btn, #exportar-btn, #importar-btn {
    background-color:#c1d8c1; border-color:#5a7d5a; color:#1f2f1f;
  }
  #guardar-btn:hover, #exportar-btn:hover, #importar-btn:hover { background-color:#a3c3a3; }

#vista table {
  border-collapse: collapse;
  width: 100%;
  border: 1.5px solid #7b4f2f;
  margin: 18px 0;
  background-color: #fff8e1;
}

#vista th, #vista td {
  border: 1.5px solid #7b4f2f;
  padding: 6px 10px;
  text-align: left;
}

#vista th {
  background-color: #f5ecd9;
  font-weight: bold;
}

/* Alterna color de filas en tablas */
#vista table tr:nth-child(even) td {
  background-color: rgba(0, 0, 0, 0.04); /* tono oscuro suave */
}

/* Alterna color de columnas en tablas */
/*#vista table td:nth-child(even) {
  background-color: rgba(255, 255, 255, 0.04); /* tono claro suave
}
*/


</style>
<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
</head>
<body>

<!-- Botones de gestión -->
<button id="guardar-btn">Guardar</button>
<button id="exportar-btn">Exportar JSON</button>
<button id="importar-btn">Importar JSON</button>
<input type="file" id="import-file" style="display:none;">

<div class="botones">
  <div id="botones-dinamicos" style="display:inline-block;"></div>
  <button id="nueva-tienda-btn">+ Nueva Tienda</button>
</div>

<div id="tienda-container">
  <textarea id="editor" style="flex:1; padding:10px; border:2px solid #7b4f2f; border-radius:8px; background-color:#fff8e1; font-family:monospace;"></textarea>
  <div id="vista"></div>
</div>

<script>
const md = window.markdownit({ html:true, breaks:true, linkify:true });
let db;
let tiendas = {};

// IndexedDB
const request = indexedDB.open("TiendaDB", 1);
request.onupgradeneeded = e => {
  db = e.target.result;
  if(!db.objectStoreNames.contains("tiendas")) db.createObjectStore("tiendas",{ keyPath:"nombre" });
};
request.onsuccess = e => {
  db = e.target.result;
  const tx = db.transaction("tiendas","readonly");
  const store = tx.objectStore("tiendas");
  store.getAll().onsuccess = ev => {
    ev.target.result.forEach(item => tiendas[item.nombre]=item.contenido);
    cargarBotones();
    const ultima = localStorage.getItem('ultimaTienda');
    if(ultima && tiendas[ultima]) cargarTienda(ultima);
  };
};

// Función cargar tienda
function cargarTienda(nombre) {
  const contenido = tiendas[nombre] || "# Nueva Tienda\n";
  document.getElementById('editor').value = contenido;
  document.getElementById('vista').innerHTML = md.render(contenido);
  localStorage.setItem('ultimaTienda', nombre);
  document.querySelectorAll('.botones button').forEach(b=>b.classList.remove('activo'));
  const boton = Array.from(document.querySelectorAll('.botones button')).find(b=>b.dataset.tienda===nombre);
  if(boton) boton.classList.add('activo');
}

// Guardar tienda
function guardarTienda(nombre){
  const contenido = document.getElementById('editor').value;
  const tx = db.transaction("tiendas","readwrite");
  tx.objectStore("tiendas").put({nombre:nombre,contenido:contenido});
  tiendas[nombre] = contenido;
}

// Crear botón
function crearBotonTienda(nombre){
  const btn = document.createElement('button');
  btn.textContent = nombre;
  btn.dataset.tienda = nombre;

  const eliminar = document.createElement('span');
  eliminar.textContent = " ✖";
  eliminar.style.cursor = "pointer";
  eliminar.style.marginLeft="6px";
  eliminar.style.color="#900";
  eliminar.onclick = e => {
  e.stopPropagation();
  if(confirm(`¿Eliminar "${nombre}"?`)){
    // Borrar de IndexedDB
    const tx = db.transaction("tiendas","readwrite");
    const store = tx.objectStore("tiendas");
    store.delete(nombre).onsuccess = () => {
      // Borrar de memoria y de botones
      delete tiendas[nombre];
      btn.remove();

      // Actualizar orden de botones en localStorage
      guardarOrdenBotones();

      // Si la tienda eliminada estaba cargada, limpiar editor y vista
      const ultima = localStorage.getItem('ultimaTienda');
      if(ultima === nombre) {
        document.getElementById('editor').value = '';
        document.getElementById('vista').innerHTML = '';
        localStorage.removeItem('ultimaTienda');
      }
    };
  }
};

  btn.appendChild(eliminar);

  btn.onclick = () => cargarTienda(nombre);

  btn.draggable = true;
  btn.addEventListener('dragstart', e=> e.dataTransfer.setData('text/plain', nombre));
  btn.addEventListener('dragover', e=> e.preventDefault());
  btn.addEventListener('drop', e=>{
    e.preventDefault();
    const dragged = e.dataTransfer.getData('text/plain');
    const draggedBtn = Array.from(document.querySelectorAll('.botones button')).find(b=>b.dataset.tienda===dragged);
    document.getElementById('botones-dinamicos').insertBefore(draggedBtn, btn);
    guardarOrdenBotones();
  });

  document.getElementById('botones-dinamicos').appendChild(btn);
}

// Guardar orden botones
function guardarOrdenBotones(){
  const orden = Array.from(document.querySelectorAll('#botones-dinamicos button')).map(b=>b.dataset.tienda);
  localStorage.setItem('ordenBotones', JSON.stringify(orden));
}

// Cargar orden botones
function cargarOrdenBotones(){
  const orden = JSON.parse(localStorage.getItem('ordenBotones')||'[]');
  orden.forEach(key=>{
    const btn = Array.from(document.querySelectorAll('#botones-dinamicos button')).find(b=>b.dataset.tienda===key);
    if(btn) document.getElementById('botones-dinamicos').appendChild(btn);
  });
}

// Cargar botones iniciales
function cargarBotones(){
  document.getElementById('botones-dinamicos').innerHTML = "";
  Object.keys(tiendas).forEach(nombre=>crearBotonTienda(nombre));
  cargarOrdenBotones();
}

// Crear nueva tienda
document.getElementById('nueva-tienda-btn').addEventListener('click', ()=>{
  const nombre = prompt("Nombre de la nueva tienda:");
  if(!nombre) return;
  if(tiendas[nombre]){
    alert("Ya existe esa tienda!");
    return;
  }
  tiendas[nombre] = `# ${nombre}\nContenido inicial...`;
  crearBotonTienda(nombre);
  guardarTienda(nombre);
  cargarTienda(nombre);
});

const editor = document.getElementById('editor');
editor.addEventListener('input', () => {
  const contenido = editor.value;
  const ultima = localStorage.getItem('ultimaTienda');
  if (ultima) tiendas[ultima] = contenido;
  document.getElementById('vista').innerHTML = md.render(contenido);
  if (ultima) guardarTienda(ultima);
});

// Guardar al escribir
document.getElementById('editor').addEventListener('input', ()=>{
  const ultima = localStorage.getItem('ultimaTienda');
  if(ultima) guardarTienda(ultima);
});

// Botón Guardar
document.getElementById('guardar-btn').addEventListener('click', ()=>{
  const ultima = localStorage.getItem('ultimaTienda');
  if(ultima) guardarTienda(ultima);
  const btn = document.getElementById('guardar-btn');
  btn.style.transform = "scale(0.95)";
  setTimeout(()=>btn.style.transform="scale(1)",100);
});

// Exportar JSON
document.getElementById('exportar-btn').addEventListener('click', ()=>{
  const tx = db.transaction("tiendas","readonly");
  const store = tx.objectStore("tiendas");
  store.getAll().onsuccess = e=>{
    const dataStr = JSON.stringify(e.target.result,null,2);
    const blob = new Blob([dataStr],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download="tiendas.json"; a.click();
    URL.revokeObjectURL(url);
  };
});

// Importar JSON
document.getElementById('importar-btn').addEventListener('click', ()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(evt){
    const data = JSON.parse(evt.target.result);
    const tx = db.transaction("tiendas","readwrite");
    const store = tx.objectStore("tiendas");
    data.forEach(item=>store.put(item));
    data.forEach(item=>tiendas[item.nombre]=item.contenido);
    alert("Importación completada!");
    cargarBotones();
  };
  reader.readAsText(file);
});

window.onload = ()=> cargarBotones();
</script>

</body>
</html>
