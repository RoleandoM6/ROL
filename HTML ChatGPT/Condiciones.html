<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Barra de Iniciativa + Condiciones</title>
<style>
  body {
    background-color: #f5e0c3;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 10px;
  }

  /* Barra de iniciativa */
  #grid-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(50px, 188px));
    grid-auto-rows: 202px;
    gap: 5px;
    justify-content: center;
  }

  .cell {
    aspect-ratio: 188 / 202;
    background-color: rgba(119,119,119,0.9);
    border: 5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    transition: border 0.2s, transform 0.3s;
    cursor: grab;
    position: relative;
    box-shadow: 0 0 15px rgba(231, 39, 5, 0.6);
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: transform 0.3s;
  }

  .number {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(0,0,0,0.6);
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 0 3px black;
    border-radius: 4px;
    border: 2px solid gold;
    pointer-events: none;
  }

  .cell.current {
    border: 6px solid rgb(48, 231, 88);
  }

  #buttons-overlay {
    position: absolute;
    top: 1000px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 20;
  }

  #add-cell {
    width: 188px;
    height: 202px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(85,85,85,0.8);
    border: 2px dashed #aaa;
    font-size: 48px;
    cursor: pointer;
    margin-top: 10px;
    user-select: none;
  }

  /* Condiciones */
  #conditions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 1200px;
    margin-top: 20px;
  }

  .cell-conditions {
    border: 3px solid #333;
    border-radius: 8px;
    padding: 10px;
    background-color: rgba(200,180,150,0.9);
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .cell-conditions.selected {
    border-color: rgb(48, 231, 88);
  }

  .cell-title {
    font-weight: bold;
    margin-bottom: 5px;
  }

  .conditions-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
  }

  .condition {
    background-color: rgba(255,50,50,0.8);
    color: white;
    font-size: 12px;
    border-radius: 3px;
    padding: 1px 5px;
    cursor: pointer;
    user-select: none;
  }

  button {
    margin-top: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Barra de iniciativa -->
<div id="grid-wrapper">
  <div id="grid"></div>
  <div id="buttons-overlay">
    <button onclick="prevTurn()">Turno Anterior</button>
    <button onclick="nextTurn()">Siguiente Turno</button>
    <button onclick="clearGrid()">Vaciar Barra</button>
    <button onclick="deleteSelected()">Eliminar Seleccionadas</button>
    <button onclick="deleteEmpty()">Eliminar Vacías</button>
    <button onclick="saveGrid()">Guardar Estado</button>
  </div>
</div>
<div id="add-cell">+</div>

<!-- Condiciones -->
<h2>Condiciones</h2>
<div id="conditions-grid"></div>
<button id="add-condition">Añadir condición</button>

<script>
// ------------------- Barra de Iniciativa -------------------
const grid = document.getElementById("grid");
const addCell = document.getElementById("add-cell");
let currentIndex = parseInt(localStorage.getItem("currentIndex")) || -1;
let selectedCells = new Set();

function ensureCells(count) {
  while (grid.children.length < count) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("draggable", true);
    grid.appendChild(cell);
  }
}

function updateHighlight() {
  [...grid.children].forEach((cell, i) => {
    cell.classList.toggle("current", i === currentIndex && cell.querySelector("img"));
  });
}

function saveGrid() {
  const data = [...grid.children].map(c => c.querySelector("img")?.src || null);
  localStorage.setItem("barra", JSON.stringify(data));
  localStorage.setItem("currentIndex", currentIndex);
}

// (Aquí se omiten funciones de manipulación de la barra para abreviar, asumiendo que tu código original se mantiene intacto)
// ------------------- FIN Barra -------------------

// ------------------- Condiciones -------------------
const conditionsGrid = document.getElementById("conditions-grid");
const addCondBtn = document.getElementById("add-condition");
let allConditions = JSON.parse(localStorage.getItem("conditions")) || {};
let selectedCell = currentIndex;

// Renderiza todas las celdas con condiciones
function renderConditions() {
  conditionsGrid.innerHTML = "";
  const barraArray = JSON.parse(localStorage.getItem("barra")) || [];
  barraArray.forEach((_, i) => {
    const cellDiv = document.createElement("div");
    cellDiv.className = "cell-conditions";
    if (i === selectedCell) cellDiv.classList.add("selected");

    const title = document.createElement("div");
    title.className = "cell-title";
    title.textContent = `Celda ${i+1}`;
    cellDiv.appendChild(title);

    const listDiv = document.createElement("div");
    listDiv.className = "conditions-list";
    (allConditions[i] || []).forEach(cond => {
      const condDiv = document.createElement("div");
      condDiv.className = "condition";
      condDiv.textContent = cond;
      condDiv.addEventListener("click", () => removeCondition(i, cond));
      listDiv.appendChild(condDiv);
    });
    cellDiv.appendChild(listDiv);

    cellDiv.addEventListener("click", () => {
      selectedCell = i;
      localStorage.setItem("currentIndex", selectedCell);
      renderConditions();
    });

    conditionsGrid.appendChild(cellDiv);
  });
}

function addCondition() {
  const cond = prompt("Nombre de la condición:");
  if (!cond) return;
  if (!allConditions[selectedCell]) allConditions[selectedCell] = [];
  allConditions[selectedCell].push(cond);
  saveConditions();
  renderConditions();
}

function removeCondition(cellIndex, cond) {
  allConditions[cellIndex] = allConditions[cellIndex].filter(c => c !== cond);
  saveConditions();
  renderConditions();
}

function saveConditions() {
  localStorage.setItem("conditions", JSON.stringify(allConditions));
}

// Actualiza sincronización cada segundo
setInterval(() => {
  currentIndex = parseInt(localStorage.getItem("currentIndex")) || 0;
  selectedCell = currentIndex;
  renderConditions();
}, 1000);

addCondBtn.addEventListener("click", addCondition);
renderConditions();
</script>

</body>
</html>
