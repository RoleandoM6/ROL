<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>2. Listado INI</title>
<style>
  html, body { 
    height: 100%; 
    margin: 0; 
    font-family: "Georgia", serif; 
    background: #3a2a1a; /* fondo marrón oscuro */
    /*background-color:  #00ff00; /* verde croma */
    color: #2b1b0f;
  }

  body { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }

  #marco {
    background-image: url('Textura Pergamino.png');
    background-size: cover;
    background-position: center;
    border: 5px solid #5a3b1e; /* borde marrón oscuro */
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
    padding: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #contenedor { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    min-width: 320px; 
    background: #3a2a1a; /* fondo marrón oscuro */
  }

  h2 {
    margin: 5px 0; 
    font-family: "Papyrus", "Georgia", serif;
    font-size: 22px;
    color: #8b5e3c;
   /*text-shadow: 1px 1px #e0c68c;*/
  }

  .input-row {
  display: flex;
  justify-content: space-between; /* separa izquierda y derecha */
  align-items: flex-start; /* alinea arriba */
  gap: 20px; /* espacio entre los grupos */
  margin-bottom: 10px;
}

.main-layout {
  display: grid;
  grid-template-columns: 200px 1fr 200px; /* izquierda, centro, derecha */
  gap: 20px;
  align-items: start;
  margin-top: 15px;
}

/* Inputs apilados */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* Botones apilados */
.button-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

  .input-row input[type="text"], 
  .input-row input[type="number"] {
    background: #f4e3c1; 
    border: 1px solid #5a3b1e; 
    border-radius: 4px;
    padding: 3px 5px;
    font-weight: normal;
  }

  .input-row button { 
    background: #8b5e3c; 
    border: 2px solid #5a3b1e; 
    border-radius: 6px; 
    color: #fdf6e3; 
    padding: 4px 8px; 
    font-size: 13px; 
    cursor: pointer; 
    font-weight: bold; 
    transition: background 0.2s, transform 0.1s;
  }

  .input-row button:hover { 
    background: #a46d42; 
    transform: scale(1.05);
  }

  .input-row button:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
  }

  table { 
    border-collapse: collapse; 
    font-size: 14px; 
    font-weight: bold; 
    margin: 0; 
    width: 100%; 
    background: rgba(244,227,193,0.9);
    border: 2px solid #5a3b1e;
    border-radius: 8px;
    overflow: hidden;
  }

  th { 
    background: #8b5e3c; 
    color: #fdf6e3; 
    border: 1px solid #5a3b1e;
    padding: 5px 8px; 
    text-align: center;
  }

  td { 
    border: 1px solid #5a3b1e; 
    padding: 4px 6px; 
    text-align: left; 
    white-space: nowrap; 
  }

#lista {
  display: grid;
  grid-auto-flow: column; /* coloca columnas de izquierda a derecha */
  grid-auto-columns: max-content; /* ancho según contenido */
  height: 352px;
  width: 1480px;
  justify-content: center; /* centra el bloque */
  gap: 15px;
  background: rgba(255, 255, 255, 0.0); /* transparente */
  padding: 10px;
  border-radius: 8px;
}


.columna {
  background: rgba(244,227,193,0.9);
  border: 2px solid #5a3b1e;
  border-radius: 8px;
  overflow: hidden;
}
.columna table {
  border-collapse: collapse;
  font-size: 14px;
  font-weight: bold;
  /* width: 100%; */ /* quitar para que se ajuste al contenido */
}

.columna th {
  background: #8b5e3c;
  color: #fdf6e3;
  padding: 5px 8px;
}
.columna td {
  border: 1px solid #5a3b1e;
  padding: 4px 6px;
}

  input[type="number"].small { 
    width: 40px; 
    padding: 2px; 
    font-size: 13px; 
    font-weight: normal; 
  }

  input[type="number"].player { 
    background-color: #d9c3a3; 
    font-weight: bold; 
    border: 1px solid #7a5230;
  }

  button.small { 
    padding: 2px 6px; 
    font-size: 12px; 
    font-weight: bold; 
    background: #a46d42; 
    color: #fff; 
    border: 1px solid #5a3b1e; 
    border-radius: 4px;
  }

  button.small:hover { 
    background: #b97a4d; 
  }
</style>
</head>
<body>

<div id="marco">
  <div id="contenedor">
    <h2>Tirada de Iniciativa</h2>

    <div class="main-layout">
      <!-- Bloque izquierdo -->
      <div class="input-group">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="number" id="bono" placeholder="Bono">
        <input type="number" id="cantidad" placeholder="Cant." value="1" min="1">
        <button onclick="agregarEnemigo()" class="small">Añadir</button>
      </div>

      <!-- Bloque central (la lista) -->
      <div id="lista"></div>

      <!-- Bloque derecho -->
      <div class="button-group">
        <button onclick="tirarIniciativa()" class="small">Tirar Iniciativa</button>
        <button onclick="ordenarTabla()" class="small">Ordenar Tabla</button>
        <button onclick="guardarLista()" class="small">Guardar</button>
        <button onclick="exportarJSON()" class="small">Exportar JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importarJSON(event)">
        <button onclick="document.getElementById('importFile').click()" class="small">Importar JSON</button>
        <button onclick="vaciarTodo()" class="small">Vaciar</button>
      </div>
    </div>
  </div>
</div>

<script>
let jugadoresBase = [
  {nombre:"Mago", bono:2, tirada:undefined},
  {nombre:"Paladín", bono:1, tirada:undefined},
  {nombre:"Explorador", bono:3, tirada:undefined},
  {nombre:"Pícaro", bono:4, tirada:undefined}
];

let participantes = [];

// --- INICIO: IndexedDB ---
let db;
const request = indexedDB.open("ListadoINI_DB", 1);

request.onerror = function(event) {
  console.error("IndexedDB error:", event.target.error);
};

request.onupgradeneeded = function(event) {
  db = event.target.result;
  if (!db.objectStoreNames.contains("participantes")) {
    db.createObjectStore("participantes", { autoIncrement: true });
  }
};

request.onsuccess = function(event) {
  db = event.target.result;
  cargarListaIndexedDB(); // cargar datos al iniciar
};
// --- FIN: IndexedDB ---

window.onload = function() {
  // la carga real se hace en request.onsuccess de IndexedDB
};


function guardarLista() {
  if (!db) return;
  const transaction = db.transaction(["participantes"], "readwrite");
  const store = transaction.objectStore("participantes");

  // Limpiar todo antes de guardar
  store.clear().onsuccess = function() {
    participantes.forEach(p => store.add(p));
  };
}

function cargarListaIndexedDB() {
  if (!db) return;
  const transaction = db.transaction(["participantes"], "readonly");
  const store = transaction.objectStore("participantes");

  const request = store.getAll();
  request.onsuccess = function(event) {
    let guardados = event.target.result;
    if (guardados && guardados.length > 0) {
      participantes = guardados.map(p => ({ nombre: p.nombre, bono: p.bono, tirada: p.tirada }));
    }

    // Asegurar que los 4 jugadores estén presentes
    jugadoresBase.forEach(j => {
      if (!participantes.some(p => p.nombre === j.nombre)) {
        participantes.unshift({...j});
      }
    });

    mostrarLista();
  };
}

function agregarEnemigo() {
  let nombre = document.getElementById('nombre').value.trim();
  let bono = parseInt(document.getElementById('bono').value) || 0;
  let cantidad = parseInt(document.getElementById('cantidad').value) || 1;
  if (!nombre || cantidad < 1) return;

  // Calcular cuántos se pueden añadir sin pasar de 40
  let disponibles = 40 - participantes.length;
  if (disponibles <= 0) return; // ya hay 40
  if (cantidad > disponibles) cantidad = disponibles;

  let baseNombre = nombre;
  let maxIndex = 0;
  participantes.forEach(p => {
    if (p.nombre.startsWith(baseNombre)) {
      let m = p.nombre.match(/#(\d+)$/);
      if (m && parseInt(m[1]) > maxIndex) maxIndex = parseInt(m[1]);
    }
  });

  for (let i = 1; i <= cantidad; i++) {
    let nombreFinal = cantidad > 1 ? `${baseNombre}#${maxIndex + i}` : baseNombre;
    participantes.push({ nombre: nombreFinal, bono });
  }

  guardarLista();
  mostrarLista();
  document.getElementById('nombre').value = '';
  document.getElementById('bono').value = '';
  document.getElementById('cantidad').value = 1;
}

function mostrarLista() {
  if (participantes.length === 0) { 
    document.getElementById('lista').innerHTML = ''; 
    return; 
  }

  let columnasHTML = '';
  let numColumnas = Math.ceil(participantes.length / 10);
  if (numColumnas > 4) numColumnas = 4; // máximo 4 columnas

  for (let c = 0; c < numColumnas; c++) {
    let inicio = c * 10;
    let fin = inicio + 10;
    let subset = participantes.slice(inicio, fin);

    let html = '<div class="columna"><table>';
    html += '<tr><th>#</th><th>Nombre</th><th>Bono</th><th>Tirada</th><th>Acción</th></tr>';

    subset.forEach((p, i) => {
      let esJugador = jugadoresBase.some(j=>j.nombre===p.nombre);
      let index = inicio + i;
      html += `<tr>
        <td>${index+1}</td>
        <td>${p.nombre}</td>
        <td><input type="number" class="small" value="${p.bono}" onchange="editarBono(${index}, this.value)"></td>
        <td><input type="number" class="small ${esJugador?'player':''}" value="${p.tirada!==undefined?p.tirada:''}" onchange="editarTirada(${index}, this.value)"></td>
        <td><button class="small" onclick="eliminar(${index})" ${esJugador?'disabled':''}>X</button></td>
      </tr>`;
    });

    html += '</table></div>';
    columnasHTML += html;
  }

  document.getElementById('lista').innerHTML = columnasHTML;
}

function editarBono(index, valor) { participantes[index].bono = parseInt(valor)||0; guardarLista(); }
function editarTirada(index, valor) { participantes[index].tirada = parseInt(valor)||0; guardarLista(); }
function eliminar(index) { participantes.splice(index,1); guardarLista(); mostrarLista(); }

function vaciarTodo() {
  // Solo conservar los PJs
  participantes = participantes.filter(p => jugadoresBase.some(j=>j.nombre===p.nombre));
  participantes.forEach(p => p.tirada = undefined);
  guardarLista();
  mostrarLista();
}

function tirarIniciativa() {
  participantes.forEach(p => { 
    let esJugador = jugadoresBase.some(j=>j.nombre===p.nombre);
    if(p.tirada===undefined && !esJugador) 
      p.tirada=Math.floor(Math.random()*10)+Math.floor(Math.random()*10)+1+p.bono; 
  });
  participantes.sort((a,b)=>(b.tirada||0)-(a.tirada||0));
  mostrarLista();
  guardarLista();
}

function ordenarTabla() {
  participantes.sort((a,b)=>(b.tirada||0)-(a.tirada||0));
  mostrarLista();
  guardarLista();
}

function exportarJSON() {
  const dataStr = JSON.stringify(participantes, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

  // Nombre del archivo según el HTML
  let htmlName = document.title || "ListadoINI";
  a.download = htmlName + ".json";
  a.click();
}

function importarJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        participantes = data.map(p => ({ nombre: p.nombre, bono: p.bono, tirada: p.tirada }));
        guardarLista();
        mostrarLista();
      } else {
        alert("Archivo inválido");
      }
    } catch (err) {
      alert("Error leyendo el JSON");
    }
  };
  reader.readAsText(file);
}

</script>
</body>
</html>
