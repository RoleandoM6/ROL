<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>2. Listado INI</title>
<style>
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; background: #00ff00; }
  body { display: flex; justify-content: center; align-items: center; }

  #marco {
    /* border: 3px solid black; */
    background-image: url('Textura Pergamino.png');
    background-size: cover;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #contenedor { display: flex; flex-direction: column; align-items: center; min-width: 300px; }

  .input-row { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 3px; font-size: 14px; font-weight: bold; }
  .input-row input[type="text"] { width: auto; min-width: 70px; padding: 3px; font-weight: normal; }
  .input-row input[type="number"] { width: 40px; padding: 3px; font-weight: normal; }
  .input-row button { padding: 3px 6px; font-size: 13px; cursor: pointer; font-weight: bold; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  table { border-collapse: collapse; font-size: 14px; font-weight: bold; margin: 0; width: 100%; }
  th, td { border: 1px solid #000; padding: 2px 5px; text-align: left; white-space: nowrap; background-color: rgba(255,255,255,0.8); }
  input[type="number"].small { width: 35px; padding: 2px; font-size: 13px; font-weight: normal; }
  input[type="number"].player { background-color: #fff2cc; } /* color crema para jugadores */
  button.small { padding: 2px 5px; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>
<div id="marco">
  <div id="contenedor">
    <h2 style="margin:2px 0;">Tirada de Iniciativa</h2>

    <div class="input-row">
      <input type="text" id="nombre" placeholder="Nombre">
      <input type="number" id="bono" placeholder="Bono">
      <input type="number" id="cantidad" placeholder="Cant." value="1" min="1">
      <button onclick="agregarEnemigo()" class="small">Añadir</button>
      <button onclick="vaciarTodo()" class="small">Vaciar</button>
      <button onclick="tirarIniciativa()" class="small">Tirar Ini.</button>
      <button onclick="ordenarTabla()" class="small">Ordenar Tabla</button>
      <button onclick="guardarLista()" class="small">Guardar</button>
      <button onclick="exportarJSON()" class="small">Exportar JSON</button>
      <input type="file" id="importFile" style="display:none" onchange="importarJSON(event)">
      <button onclick="document.getElementById('importFile').click()" class="small">Importar JSON</button>

    </div>

    <div id="lista"></div>
  </div>
</div>

<script>
let jugadoresBase = [
  {nombre:"Mago", bono:2, tirada:undefined},
  {nombre:"Paladín", bono:1, tirada:undefined},
  {nombre:"Explorador", bono:3, tirada:undefined},
  {nombre:"Pícaro", bono:4, tirada:undefined}
];

let participantes = [];

// --- INICIO: IndexedDB ---
let db;
const request = indexedDB.open("ListadoINI_DB", 1);

request.onerror = function(event) {
  console.error("IndexedDB error:", event.target.error);
};

request.onupgradeneeded = function(event) {
  db = event.target.result;
  if (!db.objectStoreNames.contains("participantes")) {
    db.createObjectStore("participantes", { autoIncrement: true });
  }
};

request.onsuccess = function(event) {
  db = event.target.result;
  cargarListaIndexedDB(); // cargar datos al iniciar
};
// --- FIN: IndexedDB ---

window.onload = function() {
  // la carga real se hace en request.onsuccess de IndexedDB
};


function guardarLista() {
  if (!db) return;
  const transaction = db.transaction(["participantes"], "readwrite");
  const store = transaction.objectStore("participantes");

  // Limpiar todo antes de guardar
  store.clear().onsuccess = function() {
    participantes.forEach(p => store.add(p));
  };
}

function cargarListaIndexedDB() {
  if (!db) return;
  const transaction = db.transaction(["participantes"], "readonly");
  const store = transaction.objectStore("participantes");

  const request = store.getAll();
  request.onsuccess = function(event) {
    let guardados = event.target.result;
    if (guardados && guardados.length > 0) {
      participantes = guardados.map(p => ({ nombre: p.nombre, bono: p.bono, tirada: p.tirada }));
    }

    // Asegurar que los 4 jugadores estén presentes
    jugadoresBase.forEach(j => {
      if (!participantes.some(p => p.nombre === j.nombre)) {
        participantes.unshift({...j});
      }
    });

    mostrarLista();
  };
}


function agregarEnemigo() {
  let nombre = document.getElementById('nombre').value.trim();
  let bono = parseInt(document.getElementById('bono').value) || 0;
  let cantidad = parseInt(document.getElementById('cantidad').value) || 1;
  if (!nombre || cantidad < 1) return;

  let baseNombre = nombre;
  let maxIndex = 0;
  participantes.forEach(p => {
    if (p.nombre.startsWith(baseNombre)) {
      let m = p.nombre.match(/#(\d+)$/);
      if (m && parseInt(m[1]) > maxIndex) maxIndex = parseInt(m[1]);
    }
  });

  for (let i = 1; i <= cantidad; i++) {
    let nombreFinal = cantidad > 1 ? `${baseNombre}#${maxIndex + i}` : baseNombre;
    participantes.push({ nombre: nombreFinal, bono });
  }

  guardarLista();
  mostrarLista();
  document.getElementById('nombre').value = '';
  document.getElementById('bono').value = '';
  document.getElementById('cantidad').value = 1;
}

function mostrarLista() {
  if (participantes.length === 0) { 
    document.getElementById('lista').innerHTML = ''; 
    return; 
  }
  let html = '<table><tr><th>#</th><th>Nombre</th><th>Bono</th><th>Tirada</th><th>Acción</th></tr>';
  participantes.forEach((p, i) => {
    let esJugador = jugadoresBase.some(j=>j.nombre===p.nombre);
    html += `<tr>
      <td>${i+1}</td>
      <td>${p.nombre}</td>
      <td><input type="number" class="small" value="${p.bono}" onchange="editarBono(${i}, this.value)"></td>
      <td><input type="number" class="small ${esJugador?'player':''}" value="${p.tirada!==undefined?p.tirada:''}" onchange="editarTirada(${i}, this.value)"></td>
      <td><button class="small" onclick="eliminar(${i})" ${esJugador?'disabled':''}>X</button></td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('lista').innerHTML = html;
}

function editarBono(index, valor) { participantes[index].bono = parseInt(valor)||0; guardarLista(); }
function editarTirada(index, valor) { participantes[index].tirada = parseInt(valor)||0; guardarLista(); }
function eliminar(index) { participantes.splice(index,1); guardarLista(); mostrarLista(); }

function vaciarTodo() {
  // Solo conservar los PJs
  participantes = participantes.filter(p => jugadoresBase.some(j=>j.nombre===p.nombre));
  participantes.forEach(p => p.tirada = undefined);
  guardarLista();
  mostrarLista();
}

function tirarIniciativa() {
  participantes.forEach(p => { 
    let esJugador = jugadoresBase.some(j=>j.nombre===p.nombre);
    if(p.tirada===undefined && !esJugador) 
      p.tirada=Math.floor(Math.random()*10)+Math.floor(Math.random()*10)+1+p.bono; 
  });
  participantes.sort((a,b)=>(b.tirada||0)-(a.tirada||0));
  mostrarLista();
  guardarLista();
}

function ordenarTabla() {
  participantes.sort((a,b)=>(b.tirada||0)-(a.tirada||0));
  mostrarLista();
  guardarLista();
}

function exportarJSON() {
  const dataStr = JSON.stringify(participantes, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

  // Nombre del archivo según el HTML
  let htmlName = document.title || "ListadoINI";
  a.download = htmlName + ".json";
  a.click();
}

function importarJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        participantes = data.map(p => ({ nombre: p.nombre, bono: p.bono, tirada: p.tirada }));
        guardarLista();
        mostrarLista();
      } else {
        alert("Archivo inválido");
      }
    } catch (err) {
      alert("Error leyendo el JSON");
    }
  };
  reader.readAsText(file);
}

</script>
</body>
</html>
