<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Barra de Iniciativa HTML OBS</title>
<style>
  body {
    background-color: #f5e0c3;
    background-image: url('Textura Pergamino.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    filter: contrast(1.05) sepia(0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    color: #333;
    overflow-x: hidden;
    padding: 20px;
    box-sizing: border-box;
  }

  #grid-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    max-width: 95%;
    position: relative;
    transition: box-shadow .2s ease, outline .2s ease;
    border-radius: 12px;
  }

  /* Marco/realce cuando Modo Condiciones está activo */
  #grid-wrapper.conditions-mode {
    box-shadow: inset 0 0 0 4px #22c55e, 0 0 24px #22c55e;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(50px, 188px));
    grid-auto-rows: 202px;
    gap: 5px;
    justify-content: center;
    max-width: 100%;
  }

  .cell {
    aspect-ratio: 188 / 202;
    background-color: rgba(119,119,119,0.9);
    border: 5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    transition: border 0.2s, transform 0.3s;
    cursor: grab;
    position: relative;
    box-shadow: 0 0 15px rgba(231, 39, 5, 0.6);
  }

  .cell:hover {
    transform: scale(1.2);
    z-index: 10;
    animation: pulse 1s infinite;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: transform 0.3s;
  }

  .number {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(0,0,0,0.6);
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 0 3px black;
    border-radius: 4px;
    border: 2px solid gold;
    pointer-events: none;
    transition: transform 0.2s;
  }

  .cell:hover .number {
    transform: scale(1.3);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 8px rgb(48, 231, 88); }
    50% { box-shadow: 0 0 20px rgb(48, 231, 88); }
    100% { box-shadow: 0 0 8px rgb(48, 231, 88); }
  }

  .cell.current {
    border: 6px solid rgb(48, 231, 88);
  }

  .cell.current:not(.removed) {
    animation: pulse 1s infinite;
  }

  .selected {
    outline: 3px dashed red;
  }

  #buttons-overlay {
    position: absolute;
    top: 1000px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 20;
    pointer-events: auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  #add-cell {
    width: 188px;
    height: 202px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(85,85,85,0.8);
    border: 2px dashed #aaa;
    font-size: 48px;
    cursor: pointer;
    margin-top: 10px;
    user-select: none;
    transition: transform 0.2s;
  }

  #add-cell:hover {
    transform: scale(1.2);
  }

  button {
    margin: 5px;
    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
  }

  #toggle-conditions.active {
    background-color: #22c55e;
    color: white;
    border: 2px solid #16a34a;
  }

  @keyframes cellIn {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes cellOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.5); }
  }

  .cell.added {
    animation: cellIn 0.3s ease forwards;
  }

  .cell.removed {
    animation: cellOut 0.3s ease forwards;
  }

  /* Menú de condiciones */
  #conditions-menu {
    display: none;
    position: absolute;
    background: rgba(0,0,0,0.92);
    color: white;
    border: 2px solid gold;
    padding: 10px;
    z-index: 50;
    max-height: 300px;
    overflow-y: auto;
    min-width: 220px;
    border-radius: 8px;
  }

  #conditions-menu h4 {
    margin: 0 0 8px 0;
  }

  /* Posicionar condiciones arriba a la derecha */
.conditions {
  position: absolute;
  top: 4px;      /* ajustable según gusto */
  right: 4px;    /* ajustable según gusto */
  background: rgba(0,0,0,0.0); /* fondo transparente o semitransparente */
  color: white;
  font-size: 12px;
  padding: 0;
  border-radius: 0;
  display: flex;
  flex-direction: column; /* apilar hacia abajo */
  align-items: flex-end;  /* alinear a la derecha */
  max-height: 90%;       /* para que no se salga de la celda */
  overflow-y: auto;
}

/* Cada condición */
.conditions span {
  margin: 1px 0;          /* margen vertical entre condiciones */
  display: inline-block;
  padding: 2px 4px;
  background: rgba(0,0,0,0.6);
  border-radius: 4px;
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;        /* opcional si quieres clic para disminuir turnos */
}

  .conditions span b {
    color: #ef4444;
    margin-left: 4px;
  }
</style>
</head>
<body>

<div id="grid-wrapper">
  <div id="grid"></div>
  <div id="buttons-overlay">
    <button onclick="prevTurn()">Turno Anterior</button>
    <button onclick="nextTurn()">Siguiente Turno</button>
    <button onclick="clearGrid()">Vaciar Barra</button>
    <button onclick="deleteSelected()">Eliminar Seleccionadas</button>
    <button onclick="deleteEmpty()">Eliminar Vacías</button>
    <button onclick="saveGrid()">Guardar Estado</button>
    <button id="toggle-conditions">Modo Condiciones</button>

    <!-- NUEVOS BOTONES -->
  <button id="export-json">Exportar JSON</button>
  <input type="file" id="import-json" style="display:none;" accept=".json">
  <button onclick="document.getElementById('import-json').click()">Importar JSON</button>

  </div>
</div>

<div id="add-cell">+</div>

<div id="conditions-menu">
  <h4>Condiciones:</h4>
  <div id="conditions-list"></div>
  <button id="close-conditions">Cerrar</button>
</div>

<script>
/* ==================== Estado & Referencias ==================== */
const grid = document.getElementById("grid");
const gridWrapper = document.getElementById("grid-wrapper");
const addCell = document.getElementById("add-cell");
const buttonsOverlay = document.getElementById("buttons-overlay");
const conditionsMenu = document.getElementById("conditions-menu");
const conditionsListDiv = document.getElementById("conditions-list");
const closeConditionsBtn = document.getElementById("close-conditions");
const toggleConditionsBtn = document.getElementById("toggle-conditions");
const specialConditions = [
  {name: "PV", key: "pv", min: 0, max: 999},
  {name: "Daño", key: "dano", min: 0, max: 999}
];

let currentIndex = parseInt(localStorage.getItem("currentIndex")) || -1;
let selectedCells = new Set();
let conditionsMode = false;
let activeCell = null;

/* ==================== Definición de Condiciones ==================== */
const conditions = [
  {name:"Envenenado", icon:"☠️", defaultTurns:1, desc:"Envenenado: 1D4 daño; Desventaja FUE y CON"},
  {name:"Quemado", icon:"🔥", defaultTurns:1, desc:"Quemado: 1D6 daño al inicio del turno; no puede ocultarse"},
  {name:"Congelado", icon:"❄️", defaultTurns:1, desc:"Congelado: Velocidad 0; desventaja en tiradas de DES"},
  {name:"Ralentizado", icon:"🐌", defaultTurns:1, desc:"Ralentizado: Mitad de movimiento; -2 a iniciativa"},
  {name:"Acelerado", icon:"💨", defaultTurns:1, desc:"Acelerado: Doble movimiento; ventaja en iniciativa"},
  {name:"Ventaja", icon:"⭐", defaultTurns:1, desc:"Ventaja: Tira dos dados, escoge el mejor"},
  {name:"Desventaja", icon:"❗", defaultTurns:1, desc:"Desventaja: Tira dos dados, escoge el peor"},
  {name:"Cegado", icon:"👁️‍🗨️", defaultTurns:1, desc:"Cegado: No puede ver; ataques contra él tienen ventaja"},
  {name:"Sordo", icon:"🙉", defaultTurns:1, desc:"Sordo: No puede oír; -2 a percepción auditiva"},
  {name:"Silenciado", icon:"🤐", defaultTurns:1, desc:"Silenciado: No puede lanzar conjuros con componente verbal"},
  {name:"Aturdido", icon:"💫", defaultTurns:1, desc:"Aturdido: Pierde su turno; no puede reaccionar"},
  {name:"Confuso", icon:"🌀", defaultTurns:1, desc:"Confuso: 50% actúa normalmente; 50% actúa al azar"},
  {name:"Encantado", icon:"💖", defaultTurns:1, desc:"Encantado: No puede dañar al encantador"},
  {name:"Controlado", icon:"🎮", defaultTurns:1, desc:"Controlado: El enemigo decide sus acciones"},
  {name:"Inmóvil", icon:"🪨", defaultTurns:1, desc:"Inmóvil: No puede moverse ni usar acciones de movimiento"},
  {name:"Inconsciente", icon:"🛏️", defaultTurns:1, desc:"Inconsciente: Caído; ataques CC ventaja y críticos si impactan"},
  {name:"Oculto", icon:"👤", defaultTurns:1, desc:"Oculto: No puede ser objetivo directo si no es detectado"},
  {name:"Iluminado", icon:"💡", defaultTurns:1, desc:"Iluminado: Pierde beneficio de ocultamiento o sigilo"},
  {name:"Protegido", icon:"🛡️", defaultTurns:1, desc:"Protegido: +2 CA o resistencia al daño"},
  {name:"Maldito", icon:"🕷️", defaultTurns:1, desc:"Maldito: No puede recuperar PV; desventaja en TS"},
  {name:"Herido Grave", icon:"🩸", defaultTurns:1, desc:"Herido Grave: PV ≤50%; -1 a todas las tiradas"},
  {name:"Regenerando", icon:"🌱", defaultTurns:1, desc:"Regenerando: Recupera 1D4 PV al inicio del turno"},
  {name:"Derribado", icon:"🍌", defaultTurns:1, desc:"Derribado: En suelo; ventajas CC, -CD; 1/2 movimiento para levantarse"}
];

/* ==================== Construcción del Menú de Condiciones ==================== */
function buildConditionsMenu() {
  conditionsListDiv.innerHTML = "";
  conditions.forEach(cond => {
    const btn = document.createElement("button");
    btn.innerHTML = `${cond.icon} ${cond.name}`;
    btn.style.display = "block";
    btn.style.margin = "3px 0";
    btn.title = cond.desc;
    btn.onclick = () => addConditionToCell(activeCell, cond);
    conditionsListDiv.appendChild(btn);
  });
}
buildConditionsMenu();

/* ==================== UI: Modo Condiciones ==================== */
function setConditionsMode(on){
    conditionsMode = on;
    toggleConditionsBtn.classList.toggle("active", on);
    gridWrapper.classList.toggle("conditions-mode", on);
    // Actualizamos visibilidad de botones especiales en todas las celdas
    [...grid.children].forEach(cell => {
        const condDiv = cell.querySelector(".conditions");
        if(!condDiv) return;
        [...condDiv.querySelectorAll(".special-btn")].forEach(btn=>{
            btn.style.display = on ? "inline-block" : "none";
        });
    });
}

toggleConditionsBtn.addEventListener("click", () => {
  setConditionsMode(!conditionsMode);
});

/* Cerrar menú de condiciones */
function closeConditionsMenu() {
  conditionsMenu.style.display = "none";
  activeCell = null;
}
closeConditionsBtn.addEventListener("click", closeConditionsMenu);

/* Cerrar menú si clic fuera */
document.addEventListener("click", (e) => {
  if (conditionsMenu.style.display === "block") {
    const withinMenu = conditionsMenu.contains(e.target);
    const openedFromCell = activeCell && activeCell.contains && activeCell.contains(e.target);
    const clickedToggle = e.target === toggleConditionsBtn;
    if (!withinMenu && !openedFromCell && !clickedToggle) closeConditionsMenu();
  }
});

/* Posicionamiento seguro del menú junto a la celda */
function positionConditionsMenuForCell(cell) {
  const rect = cell.getBoundingClientRect();
  conditionsMenu.style.display = "block"; // para medir
  const menuW = conditionsMenu.offsetWidth;
  const menuH = conditionsMenu.offsetHeight;

  let left = rect.left + window.scrollX;
  let top  = rect.bottom + window.scrollY + 6;

  if (left + menuW > window.scrollX + window.innerWidth) {
    left = window.scrollX + window.innerWidth - menuW - 10;
  }
  if (top + menuH > window.scrollY + window.innerHeight) {
    top = rect.top + window.scrollY - menuH - 6;
  }
  if (left < window.scrollX + 6) left = window.scrollX + 6;
  if (top < window.scrollY + 6) top = window.scrollY + 6;

  conditionsMenu.style.left = left + "px";
  conditionsMenu.style.top = top + "px";
}

/* ==================== Render de Condiciones en celda ==================== */
function ensureConditionsDiv(cell) {
  let condDiv = cell.querySelector(".conditions");
  if (!condDiv) {
    condDiv = document.createElement("div");
    condDiv.className = "conditions";
    cell.appendChild(condDiv);
  }
  return condDiv;
}

function renderCellConditions(cell) {
  const condDiv = ensureConditionsDiv(cell);
  condDiv.innerHTML = "";

  // Inicializar PV/Daño siempre, incluso si no hay imagen
  specialConditions.forEach(sc => {
    if (cell[sc.key] === undefined) cell[sc.key] = (sc.key === "pv" ? 10 : 0);
    const span = document.createElement("span");
    span.innerHTML = `${sc.name}: <b>${cell[sc.key]}</b> `;

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.className = "special-btn";
    plus.style.marginLeft = "2px";
    plus.style.fontSize = "10px";
    plus.style.display = conditionsMode ? "inline-block" : "none";
    plus.onclick = e => {
      e.stopPropagation();
      cell[sc.key] = Math.min(sc.max, cell[sc.key] + 1);
      renderCellConditions(cell);
      saveGrid();
    };

    const minus = document.createElement("button");
    minus.textContent = "-";
    minus.className = "special-btn";
    minus.style.marginLeft = "2px";
    minus.style.fontSize = "10px";
    minus.style.display = conditionsMode ? "inline-block" : "none";
    minus.onclick = e => {
      e.stopPropagation();
      cell[sc.key] = Math.max(sc.min, cell[sc.key] - 1);
      renderCellConditions(cell);
      saveGrid();
    };

    span.appendChild(plus);
    span.appendChild(minus);
    condDiv.appendChild(span);
  });

  // Renderizar condiciones normales
  (cell.conditions || []).forEach((c, index) => {
    const span = document.createElement("span");
    span.innerHTML = `${c.icon}${c.turns}`;
    span.title = c.desc;
    span.style.cursor = "pointer";
    span.onclick = (e) => {
      e.stopPropagation();
      c.turns = Math.max(0, c.turns - 1);
      if (c.turns === 0) cell.conditions.splice(index, 1);
      renderCellConditions(cell);
      saveGrid();
    };
    condDiv.appendChild(span);
  });
}

/* Añadir condición a la celda activa */
function addConditionToCell(cell, cond) {
  if (!cell) return;

  // Preguntar duración al añadir
  let turns = parseInt(prompt(`Añadir condición "${cond.name}". Indica duración en turnos:`, cond.defaultTurns));
  if (isNaN(turns) || turns < 1) turns = cond.defaultTurns;

  cell.conditions = cell.conditions || [];
  cell.conditions.push({...cond, turns});
  renderCellConditions(cell);
  saveGrid();
}

/* ==================== Utilidades de Grid ==================== */
function ensureCells(count) {
  while (grid.children.length < count) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("draggable", true);
    grid.appendChild(cell);
  }
}

function centerGrid() {
  grid.style.justifyContent = 'center';
}

/* ==================== Números & Selección ==================== */
function updateNumbers() {
  [...grid.children].forEach((cell, i) => {
    let num = cell.querySelector('.number');
    if (!num) {
      num = document.createElement('div');
      num.className = 'number';
      cell.appendChild(num);
    }
    num.textContent = i + 1;
  });
}

function updateHighlight() {
  [...grid.children].forEach((cell, i) => {
    cell.classList.toggle("current", i === currentIndex && cell.querySelector("img"));
  });
}

/* ==================== Guardado / Carga ==================== */
function saveGrid() {
  const data = [...grid.children].map(c => ({
    img: c.querySelector("img")?.src || null,
    conditions: c.conditions || [],
    pv: c.pv ?? 10,
    dano: c.dano ?? 0
  }));
  localStorage.setItem("barra", JSON.stringify(data));
  localStorage.setItem("currentIndex", currentIndex);
}

function loadGrid() {
  const saved = JSON.parse(localStorage.getItem("barra")) || [];
  [...grid.children].forEach(c => c.remove());
  saved.forEach((data, i) => {
    ensureCells(i + 1);
    const cell = grid.children[i];
    cell.innerHTML = "";
    if (data.img) cell.innerHTML = `<img src="${data.img}">`;
    cell.conditions = data.conditions || [];
    cell.pv = data.pv ?? 10;
    cell.dano = data.dano ?? 0;
    renderCellConditions(cell);
  });
  addCellEvents();
  updateNumbers();
  updateHighlight();
  centerGrid();
}

/* ==================== Inserción / Movimiento ==================== */
function insertImageAt(index, src) {
  ensureCells(index + 1);
  const cell = grid.children[index];
  cell.innerHTML = `<img src="${src}">`;
  cell.conditions = [];
  renderCellConditions(cell);
  cell.classList.add('added');
  setTimeout(() => cell.classList.remove('added'), 300);
  updateNumbers();
  centerGrid();
  saveGrid();
}

function moveImage(fromIndex, toIndex) {
  if (fromIndex === toIndex) return;

  const fromCell = grid.children[fromIndex];
  const toCell = grid.children[toIndex];

  // Capturamos HTML y condiciones del origen
  const movedHTML = fromCell.querySelector("img")?.outerHTML || "";
  const movedConditions = JSON.parse(JSON.stringify(fromCell.conditions || []));

  const step = fromIndex < toIndex ? 1 : -1;
  for (let i = fromIndex; i !== toIndex; i += step) {
    const next = i + step;
    const nextCell = grid.children[next];
    const currCell = grid.children[i];

    // Mover imagen "hacia atrás" paso a paso
    const nextImg = nextCell.querySelector("img")?.outerHTML || "";
    currCell.querySelector("img")?.remove();
    if (nextImg) currCell.innerHTML = nextImg;

    // Copiar condiciones del siguiente
    currCell.conditions = JSON.parse(JSON.stringify(nextCell.conditions || []));
    renderCellConditions(currCell);
  }

  // Dejar el contenido movido en la celda destino
  toCell.querySelector("img")?.remove();
  if (movedHTML) toCell.innerHTML = movedHTML;
  toCell.conditions = movedConditions;
  renderCellConditions(toCell);

  // Ajustar índice actual
  if (currentIndex === fromIndex) currentIndex = toIndex;
  else if (fromIndex < currentIndex && toIndex >= currentIndex) currentIndex--;
  else if (fromIndex > currentIndex && toIndex <= currentIndex) currentIndex++;

  // Ajustar selección múltiple (si corresponde)
  if (selectedCells.size) {
    const newSet = new Set();
    [...selectedCells].forEach(idx => {
      if (idx === fromIndex) newSet.add(toIndex);
      else if (fromIndex < idx && idx <= toIndex) newSet.add(idx - 1);
      else if (toIndex <= idx && idx < fromIndex) newSet.add(idx + 1);
      else newSet.add(idx);
    });
    selectedCells = newSet;
  }

  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

/* ==================== Turnos ==================== */
function decrementConditions(cell) {
  if (!cell || !cell.conditions || !cell.conditions.length) return;
  cell.conditions.forEach(c => c.turns = Math.max(0, (c.turns || 0) - 1));
  cell.conditions = cell.conditions.filter(c => c.turns > 0);
  renderCellConditions(cell);
}

function nextTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;

  // Decrementa condiciones del que termina su turno (currentIndex actual)
  if (currentIndex >= 0 && currentIndex < grid.children.length) {
    const prevCell = grid.children[currentIndex];
    if (prevCell && prevCell.querySelector("img")) {
      decrementConditions(prevCell);
    }
  }

  // Avanza al siguiente con imagen
  let attempts = 0;
  do {
    currentIndex = (currentIndex + 1) % grid.children.length;
    attempts++;
    if (attempts > grid.children.length + 1) break;
  } while (!grid.children[currentIndex].querySelector("img"));

  updateHighlight();
  saveGrid();
}

function prevTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;

  // Decrementa condiciones del que termina su turno (currentIndex actual)
  if (currentIndex >= 0 && currentIndex < grid.children.length) {
    const prevCell = grid.children[currentIndex];
    if (prevCell && prevCell.querySelector("img")) {
      decrementConditions(prevCell);
    }
  }

  // Retrocede al anterior con imagen
  let attempts = 0;
  do {
    currentIndex = (currentIndex - 1 + grid.children.length) % grid.children.length;
    attempts++;
    if (attempts > grid.children.length + 1) break;
  } while (!grid.children[currentIndex].querySelector("img"));

  updateHighlight();
  saveGrid();
}

/* ==================== Eliminación ==================== */
function deleteAt(index) {
  const cell = grid.children[index];
  if (!cell.querySelector("img")) return;
  cell.classList.add('removed');
  setTimeout(() => {
    for (let i = index; i < grid.children.length - 1; i++) {
      const nextContent = grid.children[i+1].querySelector("img")?.outerHTML || "";
      grid.children[i].querySelector("img")?.remove();
      if (nextContent) grid.children[i].innerHTML = nextContent;
      grid.children[i].conditions = JSON.parse(JSON.stringify(grid.children[i+1].conditions || []));
      renderCellConditions(grid.children[i]);
    }
    const lastCell = grid.children[grid.children.length-1];
    lastCell.querySelector("img")?.remove();
    lastCell.conditions = [];
    renderCellConditions(lastCell);
    cell.classList.remove('removed');
    if (currentIndex === index) currentIndex = -1;
    else if (currentIndex > index) currentIndex--;
    updateNumbers();
    updateHighlight();
    centerGrid();
    saveGrid();
  },300);
}

function deleteSelected() {
  Array.from(selectedCells).sort((a,b)=>b-a).forEach(i => deleteAt(i));
  selectedCells.clear();
  [...grid.children].forEach(c => c.classList.remove("selected"));
}

function deleteEmpty() {
  for(let i=grid.children.length-1;i>=0;i--){
    if(!grid.children[i].querySelector("img")){
      grid.removeChild(grid.children[i]);
    }
  }
  selectedCells.clear();
  updateNumbers();
  centerGrid();
  saveGrid();
}

/* ==================== Vaciar ==================== */
function clearGrid() {
  [...grid.children].forEach(cell => {
    cell.innerHTML="";
    cell.conditions=[];
    renderCellConditions(cell);
  });
  selectedCells.clear();
  currentIndex=-1;
  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

/* ==================== Eventos de Celdas ==================== */
function addCellEvents() {
  const cells = [...grid.children];
  cells.forEach((cell, i) => {
    // Eliminamos listeners previos (sin usar cloneNode)
    cell.replaceWith(cell); // Esto asegura que no queden listeners duplicados
    
    cell.setAttribute("draggable", true);

    cell.ondragstart = e => {
      if (!cell.querySelector("img")) e.preventDefault();
      else e.dataTransfer.setData("text/plain", i);
    };
    cell.ondragenter = e => e.preventDefault();
    cell.ondragover = e => e.preventDefault();
    cell.ondrop = e => {
      e.preventDefault();
      const fromIndex = parseInt(e.dataTransfer.getData("text/plain"));
      if (!Number.isNaN(fromIndex) && fromIndex !== i) moveImage(fromIndex, i);
    };

    // Click derecho: eliminar en esa posición
    cell.oncontextmenu = e => {
      e.preventDefault();
      deleteAt(i);
    };

    // Click izquierdo: selección / condiciones
    cell.onclick = e => {
    const hasImg = !!cell.querySelector("img");
    if (!hasImg) return;

    if (conditionsMode) {
        activeCell = cell;
        renderCellConditions(cell); // Fuerza renderizar condiciones, incluso si está vacío
        positionConditionsMenuForCell(cell);
    } else if (e.ctrlKey) {
        if (selectedCells.has(i)) selectedCells.delete(i);
        else selectedCells.add(i);
        cell.classList.toggle("selected");
    } else {
        // Antes cambiaba el turno; ahora solo selecciona sin alterar currentIndex
        if (selectedCells.has(i)) selectedCells.delete(i);
        else selectedCells.add(i);
        cell.classList.toggle("selected");
    }
};
    // Siempre renderizamos condiciones especiales (PV/Daño) aunque no haya condiciones normales
    renderCellConditions(cell);
  });
}

/* ==================== Arrastrar Nuevas Imágenes ==================== */
addCell.addEventListener("dragover", e => e.preventDefault());
addCell.addEventListener("drop", e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const firstEmpty = [...grid.children].findIndex(c => !c.querySelector("img"));
      if (firstEmpty >= 0) insertImageAt(firstEmpty, reader.result);
      else insertImageAt(grid.children.length, reader.result);
      addCellEvents();
    };
    reader.readAsDataURL(file);
  });
});

/* ==================== Inicio ==================== */
loadGrid();
</script>

<script>
/* ==================== Exportar JSON ==================== */
document.getElementById("export-json").addEventListener("click", () => {
  const data = [...grid.children].map(c => ({
    img: c.querySelector("img")?.src || null,
    conditions: c.conditions || [],
    pv: c.pv ?? 10,
    dano: c.dano ?? 0
  }));
  const exportData = {
    currentIndex,
    grid: data
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `BarraDeIniciativa_${new Date().toISOString()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

/* ==================== Importar JSON ==================== */
document.getElementById("import-json").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.grid || !Array.isArray(data.grid)) throw "Formato inválido";
      
      // Limpiamos grid
      [...grid.children].forEach(c => c.remove());
      
      // Restauramos celdas
      data.grid.forEach((cellData, i) => {
        ensureCells(i + 1);
        const cell = grid.children[i];
        cell.innerHTML = "";
        if (cellData.img) cell.innerHTML = `<img src="${cellData.img}">`;
        cell.conditions = cellData.conditions || [];
        cell.pv = cellData.pv ?? 10;
        cell.dano = cellData.dano ?? 0;
        renderCellConditions(cell);
      });
      
      addCellEvents();
      currentIndex = data.currentIndex ?? -1;
      updateNumbers();
      updateHighlight();
      centerGrid();
      saveGrid();
      alert("Importación completada correctamente.");
    } catch(err) {
      alert("Error al importar el archivo JSON: " + err);
    }
  };
  reader.readAsText(file);
});
</script>

</body>
</html>
