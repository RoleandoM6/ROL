<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciativa Enemigos Compacta</title>
<style>
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; background: #ccc; }
  body {
    display: flex;
    justify-content: center; 
    align-items: center;     
  }

  /* Marco negro y fondo de pergamino */
  #marco {
    border: 3px solid black;
    background-image: url('Textura Pergamino.png');
    background-size: cover;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #contenedor {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 300px;
  }

  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    margin-bottom: 3px;
    font-size: 14px;
    font-weight: bold;
  }

  .input-row input[type="text"] { width: auto; min-width: 70px; padding: 3px; font-weight: normal; }
  .input-row input[type="number"] { width: 40px; padding: 3px; font-weight: normal; }
  .input-row button { padding: 3px 6px; font-size: 13px; cursor: pointer; font-weight: bold; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  table { border-collapse: collapse; font-size: 14px; font-weight: bold; margin: 0; width: 100%; }
  th, td { border: 1px solid #000; padding: 2px 5px; text-align: left; white-space: nowrap; 
           background-color: rgba(255,255,255,0.8); /* halo blanco interior */ }
  input[type="number"].small { width: 35px; padding: 2px; font-size: 13px; font-weight: normal; }
  button.small { padding: 2px 5px; font-size: 13px; font-weight: bold; }

</style>
</head>
<body>
  <div id="marco">
    <div id="contenedor">
      <h2 style="margin:2px 0;">Iniciativa Enemigos</h2>

      <div class="input-row">
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="number" id="bono" placeholder="Bono">
        <input type="number" id="cantidad" placeholder="Cant." value="1" min="1">
        <button onclick="agregarEnemigo()" class="small">Añadir</button>
        <button onclick="vaciarTodo()" class="small">Vaciar</button>
        <button onclick="tirarIniciativa()" class="small">Tirar Ini.</button>
      </div>

      <div id="lista"></div>
      <div id="resultado"></div>
    </div>
  </div>

<script>
let participantes = [];

window.onload = function() {
  let guardados = localStorage.getItem('participantes');
  if (guardados) participantes = JSON.parse(guardados);
  mostrarLista();
  mostrarResultado();
}

function guardarLista() {
  localStorage.setItem('participantes', JSON.stringify(participantes));
}

function agregarEnemigo() {
  let nombre = document.getElementById('nombre').value.trim();
  let bono = parseInt(document.getElementById('bono').value) || 0;
  let cantidad = parseInt(document.getElementById('cantidad').value) || 1;
  if (!nombre || cantidad < 1) return;

  let baseNombre = nombre;
  let maxIndex = 0;
  participantes.forEach(p => {
    if (p.nombre.startsWith(baseNombre)) {
      let m = p.nombre.match(/#(\d+)$/);
      if (m && parseInt(m[1]) > maxIndex) maxIndex = parseInt(m[1]);
    }
  });

  for (let i = 1; i <= cantidad; i++) {
    let nombreFinal = cantidad > 1 ? `${baseNombre}#${maxIndex + i}` : baseNombre;
    participantes.push({ nombre: nombreFinal, bono });
  }

  guardarLista();
  mostrarLista();
  document.getElementById('nombre').value = '';
  document.getElementById('bono').value = '';
  document.getElementById('cantidad').value = 1;
}

function mostrarLista() {
  if (participantes.length === 0) {
    document.getElementById('lista').innerHTML = '';
    return;
  }
  let html = '<table><tr><th>Nombre</th><th>Bono</th><th>Acción</th></tr>';
  participantes.forEach((p, i) => {
    html += `<tr>
      <td>${p.nombre}</td>
      <td><input type="number" class="small" value="${p.bono}" onchange="editarBono(${i}, this.value)" ${p.tirada !== undefined ? 'disabled' : ''}></td>
      <td><button class="small" onclick="eliminar(${i})" ${p.tirada !== undefined ? 'disabled' : ''}>X</button></td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('lista').innerHTML = html;
}

function editarBono(index, valor) {
  participantes[index].bono = parseInt(valor) || 0;
  guardarLista();
}

function eliminar(index) {
  participantes.splice(index, 1);
  guardarLista();
  mostrarLista();
}

function vaciarTodo() {
  participantes = [];
  document.getElementById('resultado').innerHTML = '';
  localStorage.removeItem('participantes');
  mostrarLista();
}

function tirarIniciativa() {
  participantes.forEach(p => {
    if (p.tirada === undefined) {
      p.tirada = Math.floor(Math.random() * 10) + Math.floor(Math.random() * 10) + 1 + p.bono;
    }
  });
  participantes.sort((a,b)=>(b.tirada||0)-(a.tirada||0));
  mostrarResultado();
  mostrarLista();
  guardarLista();
}

function mostrarResultado() {
  if (participantes.length === 0) {
    document.getElementById('resultado').innerHTML = '';
    return;
  }
  // Misma tabla que la de arriba
  let html = '<table><tr><th>Nombre</th><th>Tirada</th></tr>';
  participantes.forEach(p => {
    html += `<tr><td>${p.nombre}</td><td>${p.tirada !== undefined ? p.tirada : '-'}</td></tr>`;
  });
  html += '</table>';
  document.getElementById('resultado').innerHTML = html;
}
</script>
</body>
</html>
