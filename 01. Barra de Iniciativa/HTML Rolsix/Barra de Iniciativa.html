<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Barra de Iniciativa Dinámica</title>
<style>
  body {
    background-color: #f5e0c3; /* color base tipo pergamino */
    background-image: url('https://github.com/RoleandoM6/ROL/blob/main/01.%20Barra%20de%20Iniciativa/HTML%20Rolsix/Textura%20Pergamino.png?raw=true'); /* textura de pergamino */
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    filter: contrast(1.05) sepia(0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    color: #333;
    overflow-x: hidden;
    padding: 20px;
    box-sizing: border-box;
  }

  #grid-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    max-width: 95%;
    position: relative; /* para que los botones se posicionen encima */
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(50px, 188px));
    grid-auto-rows: 202px;
    gap: 5px;
    justify-content: center;
    max-width: 100%;
  }

  .cell {
    aspect-ratio: 188 / 202;
    background-color: rgba(119,119,119,0.9);
    border: 5px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    transition: border 0.2s, transform 0.3s;
    cursor: grab;
    position: relative;
    box-shadow: 0 0 15px rgba(231, 39, 5, 0.6);
  }

  .cell:hover {
    transform: scale(1.2);
    z-index: 10;
    animation: pulse 1s infinite;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: transform 0.3s;
  }

  .number {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(0,0,0,0.6);
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 0 3px black;
    border-radius: 4px;
    border: 2px solid gold;
    pointer-events: none;
    transition: transform 0.2s;
  }

  .cell:hover .number {
    transform: scale(1.3);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 8px rgb(48, 231, 88); }
    50% { box-shadow: 0 0 20px rgb(48, 231, 88); }
    100% { box-shadow: 0 0 8px rgb(48, 231, 88); }
  }

  .cell.current {
    border: 6px solid rgb(48, 231, 88);
  }

  .cell.current:not(.removed) {
    animation: pulse 1s infinite;
  }

  .selected {
    outline: 3px dashed red;
  }

  #buttons-overlay {
    position: absolute;
    top: 1000px; /* ajusta este valor para separar más los botones */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 20;
    pointer-events: auto;
}

  #add-cell {
    width: 188px;
    height: 202px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(85,85,85,0.8);
    border: 2px dashed #aaa;
    font-size: 48px;
    cursor: pointer;
    margin-top: 10px;
    user-select: none;
    transition: transform 0.2s;
  }

  #add-cell:hover {
    transform: scale(1.2);
  }

  button {
    margin: 5px;
    padding: 5px 10px;
    font-size: 16px;
    cursor: pointer;
  }

  @keyframes cellIn {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes cellOut {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.5); }
  }

  .cell.added {
    animation: cellIn 0.3s ease forwards;
  }

  .cell.removed {
    animation: cellOut 0.3s ease forwards;
  }
</style>
</head>
<body>

<div id="grid-wrapper">
  <div id="grid"></div>
  <div id="buttons-overlay">
    <button onclick="prevTurn()">Turno Anterior</button>
    <button onclick="nextTurn()">Siguiente Turno</button>
    <button onclick="clearGrid()">Vaciar Barra</button>
    <button onclick="deleteSelected()">Eliminar Seleccionadas</button>
    <button onclick="deleteEmpty()">Eliminar Vacías</button>
  </div>
</div>

<div id="add-cell">+</div>

<script>
const grid = document.getElementById("grid");
const addCell = document.getElementById("add-cell");
const buttonsOverlay = document.getElementById("buttons-overlay");
let currentIndex = parseInt(localStorage.getItem("currentIndex")) || -1;
let selectedCells = new Set();

function ensureCells(count) {
  while (grid.children.length < count) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.setAttribute("draggable", true);
    grid.appendChild(cell);
  }
}

function centerGrid() {
  grid.style.justifyContent = 'center';
}

function loadGrid() {
  const saved = JSON.parse(localStorage.getItem("barra")) || [];
  [...grid.children].forEach(c => c.remove());
  saved.forEach((src, i) => {
    ensureCells(i + 1);
    if (src) grid.children[i].innerHTML = `<img src="${src}">`;
  });
  addCellEvents();
  updateNumbers();
  updateHighlight();
  centerGrid();
}

function addCellEvents() {
  [...grid.children].forEach(cell => {
    cell.replaceWith(cell.cloneNode(true));
  });

  const cells = [...grid.children];
  cells.forEach((cell, i) => {
    cell.addEventListener("dragstart", e => {
      if (!cell.querySelector("img")) e.preventDefault();
      else e.dataTransfer.setData("text/plain", i);
    });
    cell.addEventListener("dragenter", e => e.preventDefault());
    cell.addEventListener("dragover", e => e.preventDefault());
    cell.addEventListener("drop", e => {
      e.preventDefault();
      const fromIndex = parseInt(e.dataTransfer.getData("text/plain"));
      if (fromIndex !== i) moveImage(fromIndex, i);
    });

    cell.addEventListener("contextmenu", e => {
      e.preventDefault();
      deleteAt(i);
    });

    cell.addEventListener("click", e => {
      const hasImg = !!cell.querySelector("img");
      if (e.ctrlKey && hasImg) {
        if (selectedCells.has(i)) selectedCells.delete(i);
        else selectedCells.add(i);
        cell.classList.toggle("selected");
      } else if (hasImg) {
        currentIndex = i;
        updateHighlight();
        saveGrid();
      }
    });
  });
}

function insertImageAt(index, src) {
  ensureCells(index + 1);
  const cell = grid.children[index];
  cell.innerHTML = `<img src="${src}">`;
  cell.classList.add('added');
  setTimeout(() => cell.classList.remove('added'), 300);
  updateNumbers();
  centerGrid();
  saveGrid();
}

function clearGrid() {
  [...grid.children].forEach(cell => cell.innerHTML = "");
  selectedCells.clear();
  currentIndex = -1;
  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

function deleteAt(index) {
  const cell = grid.children[index];
  const removedImage = cell.querySelector("img");
  if (!removedImage) return;

  cell.classList.add('removed');

  setTimeout(() => {
    for (let i = index; i < grid.children.length - 1; i++) {
      const nextContent = grid.children[i + 1].innerHTML;
      if(nextContent) {
        grid.children[i].innerHTML = nextContent;
        grid.children[i].style.transform = 'translateX(100%)';
        setTimeout(() => grid.children[i].style.transform = 'translateX(0)', 10);
      } else grid.children[i].innerHTML = "";
    }
    grid.children[grid.children.length - 1].innerHTML = "";
    cell.classList.remove('removed');

    if (currentIndex === index) {
      let next = index;
      while(next < grid.children.length && !grid.children[next].querySelector("img")) next++;
      if(next < grid.children.length) currentIndex = next;
      else {
        next = index - 1;
        while(next >= 0 && !grid.children[next].querySelector("img")) next--;
        currentIndex = next >= 0 ? next : -1;
      }
    } else if (currentIndex > index) {
      currentIndex--;
    }

    updateNumbers();
    updateHighlight();
    centerGrid();
    saveGrid();
  }, 300);
}

function deleteSelected() {
  const indices = Array.from(selectedCells).sort((a,b)=>b-a);
  indices.forEach(i => deleteAt(i));
  selectedCells.clear();
  [...grid.children].forEach(cell => cell.classList.remove("selected"));
}

function moveImage(fromIndex, toIndex) {
  if (fromIndex === toIndex) return;
  const moved = grid.children[fromIndex].innerHTML;
  if (!moved) return;

  const step = fromIndex < toIndex ? 1 : -1;
  for (let i = fromIndex; i !== toIndex; i += step) {
    const next = i + step;
    grid.children[i].innerHTML = grid.children[next].innerHTML;
  }
  grid.children[toIndex].innerHTML = moved;

  if (currentIndex === fromIndex) currentIndex = toIndex;
  else if (fromIndex < currentIndex && toIndex >= currentIndex) currentIndex--;
  else if (fromIndex > currentIndex && toIndex <= currentIndex) currentIndex++;

  [...grid.children].forEach(cell => {
    cell.style.transition = 'transform 0.3s';
  });

  updateNumbers();
  updateHighlight();
  centerGrid();
  saveGrid();
}

function updateHighlight() {
  [...grid.children].forEach((cell, i) => {
    cell.classList.toggle("current", i === currentIndex && cell.querySelector("img"));
  });
}

function updateNumbers() {
  [...grid.children].forEach((cell, i) => {
    let num = cell.querySelector('.number');
    if (!num) {
      num = document.createElement('div');
      num.className = 'number';
      cell.appendChild(num);
    }
    num.textContent = i + 1;
  });
}

function nextTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;
  do { currentIndex = (currentIndex + 1) % grid.children.length; } 
  while (!grid.children[currentIndex].querySelector("img"));
  updateHighlight();
  saveGrid();
}

function prevTurn() {
  const images = [...grid.children].filter(c => c.querySelector("img"));
  if (!images.length) return;
  do { currentIndex = (currentIndex - 1 + grid.children.length) % grid.children.length; } 
  while (!grid.children[currentIndex].querySelector("img"));
  updateHighlight();
  saveGrid();
}

function deleteEmpty() {
  for (let i = grid.children.length - 1; i >= 0; i--) {
    const cell = grid.children[i];
    if (!cell.querySelector("img")) {
      grid.removeChild(cell);
    }
  }
  selectedCells.clear();
  updateNumbers();
  centerGrid();
}

function saveGrid() {
  const data = [...grid.children].map(c => c.querySelector("img")?.src || null);
  localStorage.setItem("barra", JSON.stringify(data));
  localStorage.setItem("currentIndex", currentIndex);
}

addCell.addEventListener("dragover", e => e.preventDefault());
addCell.addEventListener("drop", e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const firstEmpty = [...grid.children].findIndex(c => !c.querySelector("img"));
      if (firstEmpty >= 0) insertImageAt(firstEmpty, reader.result);
      else insertImageAt(grid.children.length, reader.result);
      addCellEvents();
    };
    reader.readAsDataURL(file);
  });
});

// Funciones para ocultar/mostrar botones
function hideButtons() { buttonsOverlay.style.display = "none"; }
function showButtons() { buttonsOverlay.style.display = "flex"; }

loadGrid();
</script>
</body>
</html>
